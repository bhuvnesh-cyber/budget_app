<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Spend Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #F7F8FA;
  --s0: #FFFFFF;
  --s1: #F0F2F7;
  --s2: #E4E8F0;
  --bd: #DDE2EC;
  --bd2: #C8D0E0;
  --tx: #111827;
  --m1: #4B5563;
  --m2: #9CA3AF;
  --acc: #2563EB;
  --acc-lt: #EFF6FF;
  --acc-bd: #BFDBFE;
  --grn: #059669;
  --grn-lt: #ECFDF5;
  --grn-bd: #A7F3D0;
  --red: #DC2626;
  --red-lt: #FEF2F2;
  --red-bd: #FECACA;
  --amb: #D97706;
  --amb-lt: #FFFBEB;
  --amb-bd: #FDE68A;
  --pur: #7C3AED;
  --pur-lt: #F5F3FF;
  --pur-bd: #DDD6FE;
  --pnk: #DB2777;
  --pnk-lt: #FDF2F8;
  --pnk-bd: #FBCFE8;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
  --r: 14px;
  --rs: 9px;
  --nav-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --sh: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --sh2: 0 4px 16px rgba(37,99,235,.10), 0 1px 4px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: var(--sans); overflow-x: hidden; font-size: 14px; line-height: 1.5; }
#root { display: flex; flex-direction: column; min-height: 100%; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-b)); background: rgba(255,255,255,.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--bd); display: flex; align-items: stretch; z-index: 100; padding-bottom: var(--safe-b); box-shadow: 0 -2px 12px rgba(0,0,0,.06); }
.nb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--m2); font-family: var(--sans); font-size: .46rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; transition: color .15s; padding: 0; }
.nb.on { color: var(--acc); }
.nb svg { width: 21px; height: 21px; stroke-width: 1.75; fill: none; stroke: currentColor; transition: stroke .15s; }
.nb-dot { width: 16px; height: 2.5px; border-radius: 99px; background: var(--acc); display: none; }
.nb.on .nb-dot { display: block; }

.page { flex: 1; padding: .5rem 1rem calc(var(--nav-h) + var(--safe-b) + 1rem); max-width: 520px; margin: 0 auto; width: 100%; }

/* CARDS */
.card { background: var(--s0); border: 1px solid var(--bd); border-radius: var(--r); padding: .85rem 1rem; margin-bottom: .5rem; box-shadow: var(--sh); }

/* PAGE HEADER */
.ph { padding: .65rem 0 .6rem; display: flex; align-items: baseline; justify-content: space-between; }
.ph-title { font-size: 1.15rem; font-weight: 800; color: var(--tx); letter-spacing: -.02em; }
.ph-sub { font-size: .6rem; color: var(--m2); font-family: var(--mono); }

/* SECTION HEADER */
.sh { font-size: .5rem; letter-spacing: .16em; text-transform: uppercase; color: var(--acc); font-weight: 800; margin: 1.1rem 0 .5rem; display: flex; align-items: center; gap: .5rem; }
.sh::after { content: ''; flex: 1; height: 1px; background: var(--bd); }

/* GRIDS */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-bottom: .45rem; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; margin-bottom: .45rem; }

/* STAT CARD */
.sc { background: var(--s0); border: 1px solid var(--bd); border-radius: var(--r); padding: .7rem .85rem; box-shadow: var(--sh); }
.sc-lbl { font-size: .49rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--m2); margin-bottom: .28rem; }
.sc-val { font-family: var(--mono); font-size: 1.15rem; font-weight: 700; line-height: 1; }
.sc-sub { font-size: .58rem; color: var(--m2); margin-top: .22rem; font-family: var(--mono); }

/* HEAT COLORS — green→amber→red by amount */
.h0 { color: #059669; }
.h1 { color: #10B981; }
.h2 { color: #65A30D; }
.h3 { color: #84CC16; }
.h4 { color: #CA8A04; }
.h5 { color: #D97706; }
.h6 { color: #EA580C; }
.h7 { color: #DC2626; }
.h8 { color: #B91C1C; }
.h9 { color: #991B1B; }

/* HERO */
.hero { border-radius: var(--r); padding: 1rem 1.1rem; margin-bottom: .5rem; border: 1px solid; position: relative; overflow: hidden; }
.hero-lbl { font-size: .5rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-bottom: .2rem; }
.hero-amt { font-family: var(--mono); font-size: 2rem; font-weight: 800; line-height: 1; letter-spacing: -.03em; margin-bottom: .3rem; }
.hero-sub { font-size: .62rem; font-family: var(--mono); opacity: .75; }
.hero-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: .6rem; padding-top: .55rem; }
.hero-mini-lbl { font-size: .58rem; color: inherit; opacity: .7; }
.hero-mini-val { font-family: var(--mono); font-weight: 700; font-size: .78rem; }
.hero-ok { background: linear-gradient(135deg, #ECFDF5, #D1FAE5); border-color: var(--grn-bd); color: var(--grn); }
.hero-warn { background: linear-gradient(135deg, #FFFBEB, #FEF3C7); border-color: var(--amb-bd); color: var(--amb); }
.hero-bad { background: linear-gradient(135deg, #FEF2F2, #FEE2E2); border-color: var(--red-bd); color: var(--red); }

/* NOTES */
.note { display: flex; align-items: center; gap: 7px; padding: .42rem .75rem; border-radius: var(--rs); font-size: .68rem; font-weight: 600; margin-bottom: .45rem; border-left: 3px solid; }
.note-grn { background: var(--grn-lt); border-color: var(--grn); color: var(--grn); }
.note-blu { background: var(--acc-lt); border-color: var(--acc); color: var(--acc); }
.note-amb { background: var(--amb-lt); border-color: var(--amb); color: var(--amb); }
.note-red { background: var(--red-lt); border-color: var(--red); color: var(--red); }
.note-pur { background: var(--pur-lt); border-color: var(--pur); color: var(--pur); }

/* PILL */
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 99px; font-size: .52rem; font-weight: 700; letter-spacing: .05em; border: 1px solid; white-space: nowrap; }
.pill-grn { background: var(--grn-lt); border-color: var(--grn-bd); color: var(--grn); }
.pill-blu { background: var(--acc-lt); border-color: var(--acc-bd); color: var(--acc); }
.pill-amb { background: var(--amb-lt); border-color: var(--amb-bd); color: var(--amb); }
.pill-red { background: var(--red-lt); border-color: var(--red-bd); color: var(--red); }
.pill-pur { background: var(--pur-lt); border-color: var(--pur-bd); color: var(--pur); }
.pill-pnk { background: var(--pnk-lt); border-color: var(--pnk-bd); color: var(--pnk); }
.pill-gray { background: var(--s1); border-color: var(--bd2); color: var(--m1); }

/* TAG PILLS */
.tag-rent      { background: #EFF6FF; border: 1px solid #BFDBFE; color: #1D4ED8; border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-family    { background: var(--pur-lt); border: 1px solid var(--pur-bd); color: var(--pur); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-savings   { background: var(--grn-lt); border: 1px solid var(--grn-bd); color: var(--grn); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-vegetable { background: #F0FDF4; border: 1px solid #BBF7D0; color: #15803D; border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-uber      { background: var(--red-lt); border: 1px solid var(--red-bd); color: var(--red); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-credit    { background: var(--amb-lt); border: 1px solid var(--amb-bd); color: var(--amb); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-sbi       { background: #EFF6FF; border: 1px solid #93C5FD; color: #2563EB; border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-cash      { background: var(--grn-lt); border: 1px solid #6EE7B7; color: #047857; border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-food      { background: #FFF7ED; border: 1px solid #FED7AA; color: #C2410C; border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-shopping  { background: var(--pnk-lt); border: 1px solid var(--pnk-bd); color: var(--pnk); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-bills     { background: var(--s1); border: 1px solid var(--bd2); color: var(--m1); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }
.tag-untagged  { background: var(--s1); border: 1px solid var(--bd2); color: var(--m2); border-radius: 99px; padding: 2px 8px; font-size: .5rem; font-weight: 700; display: inline-flex; align-items: center; }

/* INPUT / SELECT */
input[type=number], input[type=text], input[type=date], select, textarea {
  width: 100%; background: var(--s1); border: 1.5px solid var(--bd); color: var(--tx);
  border-radius: var(--rs); font-family: var(--sans); font-size: .82rem; font-weight: 500;
  padding: .52rem .8rem; outline: none; transition: border-color .15s, box-shadow .15s;
  -moz-appearance: textfield;
}
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input:focus, select:focus, textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(37,99,235,.1); background: var(--s0); }
input::placeholder, textarea::placeholder { color: var(--m2); }
label { font-size: .58rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--m1); display: block; margin-bottom: 4px; }

/* BUTTONS */
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: .6rem 1rem; border-radius: var(--rs); border: none; cursor: pointer; font-family: var(--sans); font-weight: 700; font-size: .8rem; transition: all .12s; width: 100%; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-pri { background: linear-gradient(135deg, #1D4ED8, #2563EB); color: #fff; box-shadow: 0 3px 10px rgba(37,99,235,.3); }
.btn-grn { background: linear-gradient(135deg, #047857, #059669); color: #fff; box-shadow: 0 3px 10px rgba(5,150,105,.25); }
.btn-sec { background: var(--s0); border: 1.5px solid var(--bd); color: var(--m1); }
.btn-red { background: var(--red-lt); border: 1px solid var(--red-bd); color: var(--red); }
.btn-sm { padding: .35rem .7rem; font-size: .68rem; width: auto; }
.btn-del { background: none; border: none; color: var(--m2); cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: .8rem; transition: color .1s; }
.btn-del:hover { color: var(--red); }

/* BAR */
.bar-wrap { background: var(--s1); border-radius: 99px; height: 4px; margin-top: 5px; overflow: hidden; }
.bar-fill { height: 4px; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

/* TOGGLE */
.tgl { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
.tgl input { opacity: 0; width: 0; height: 0; position: absolute; }
.tsl { position: absolute; inset: 0; background: var(--bd2); border-radius: 99px; cursor: pointer; transition: .2s; }
.tsl::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.tgl input:checked + .tsl { background: var(--grn); }
.tgl input:checked + .tsl::before { transform: translateX(16px); }

/* TRANSACTIONS */
.txn-list { background: var(--s0); border: 1px solid var(--bd); border-radius: var(--r); overflow: hidden; margin-bottom: .5rem; box-shadow: var(--sh); }
.txn-row { display: flex; align-items: flex-start; gap: .5rem; padding: .6rem .85rem; border-bottom: 1px solid var(--bd); transition: background .1s; }
.txn-row:last-child { border-bottom: none; }
.txn-row:hover { background: var(--s1); }
.txn-left { flex: 1; min-width: 0; }
.txn-date { font-size: .53rem; color: var(--m2); font-family: var(--mono); margin-bottom: 2px; }
.txn-recv { font-size: .73rem; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.txn-right { text-align: right; flex-shrink: 0; }
.txn-amt { font-family: var(--mono); font-weight: 700; font-size: .82rem; }

/* TAG SELECT */
.tag-sel { background: var(--s1); border: 1.5px solid var(--bd); color: var(--tx); border-radius: 99px; font-family: var(--sans); font-size: .55rem; font-weight: 700; padding: 2px 8px; outline: none; cursor: pointer; width: auto; }
.tag-sel:focus { border-color: var(--acc); }

/* UPLOAD */
.upload-zone { border: 2px dashed var(--bd2); border-radius: var(--r); padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all .2s; background: var(--s0); }
.upload-zone.drag, .upload-zone:hover { border-color: var(--acc); background: var(--acc-lt); }
.upload-zone input { display: none; }

/* WF (waterfall) */
.wf-row { display: flex; justify-content: space-between; align-items: center; padding: .42rem 0; border-bottom: 1px solid var(--bd); }
.wf-row:last-child { border-bottom: none; }
.wf-lbl { font-size: .7rem; color: var(--m1); }
.wf-val { font-family: var(--mono); font-weight: 600; font-size: .73rem; }

/* CATEGORY ROW */
.cat-row { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--bd); }
.cat-row:last-child { border-bottom: none; }
.cat-icon { font-size: .95rem; width: 26px; text-align: center; flex-shrink: 0; }
.cat-name { font-size: .75rem; font-weight: 600; }
.cat-count { font-size: .55rem; color: var(--m2); font-family: var(--mono); }
.cat-amt { font-family: var(--mono); font-weight: 700; font-size: .82rem; }

/* EMPTY */
.empty { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; text-align: center; gap: .45rem; background: var(--s0); border: 1.5px dashed var(--bd2); border-radius: var(--r); }
.empty-icon { font-size: 2rem; }
.empty-title { font-size: .85rem; font-weight: 700; color: var(--m1); }
.empty-body { font-size: .68rem; color: var(--m2); max-width: 200px; line-height: 1.5; }

/* TAB BAR */
.tab-bar { display: flex; background: var(--s1); border-radius: 10px; padding: 3px; margin-bottom: .75rem; gap: 2px; border: 1px solid var(--bd); }
.tab { flex: 1; padding: .33rem .3rem; border: none; border-radius: 7px; cursor: pointer; font-family: var(--sans); font-size: .52rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--m2); background: transparent; transition: all .15s; white-space: nowrap; }
.tab.on { color: var(--acc); background: var(--s0); box-shadow: var(--sh); }

/* INS ROW */
.ins-row { display: flex; justify-content: space-between; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--bd); }
.ins-row:last-child { border-bottom: none; }
.ins-lbl { font-size: .7rem; color: var(--m1); }
.ins-val { font-family: var(--mono); font-weight: 700; font-size: .75rem; }

/* TOAST */
.toast { position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 10px); left: 50%; transform: translateX(-50%); background: var(--tx); color: #fff; padding: .42rem 1.2rem; border-radius: 99px; font-size: .68rem; font-weight: 700; z-index: 200; animation: fu .18s ease; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
@keyframes fu { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

/* BUDGET PROGRESS */
.budget-bar { background: var(--s0); border: 1px solid var(--bd); border-radius: var(--r); padding: .75rem .9rem; margin-bottom: .45rem; box-shadow: var(--sh); }
.budget-bar-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; }
.budget-bar-title { font-size: .75rem; font-weight: 700; }
.budget-bar-pct { font-family: var(--mono); font-size: .65rem; font-weight: 700; }

/* MONEY LIST (debts/savings/lent) */
.money-item { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--bd); }
.money-item:last-child { border-bottom: none; }
.money-label { flex: 1; font-size: .75rem; font-weight: 600; }
.money-amt { font-family: var(--mono); font-weight: 700; font-size: .8rem; }

hr { border: none; border-top: 1px solid var(--bd); margin: .65rem 0; }
.row { display: flex; align-items: center; gap: .5rem; }
.f1 { flex: 1; }
.mb { margin-bottom: .5rem; }
.gap4 { display: flex; flex-direction: column; gap: .4rem; }

@media (max-width: 380px) {
  .g3 { grid-template-columns: 1fr 1fr; }
  .ph-title { font-size: 1rem; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { createElement: h, useState, useEffect, useCallback, useRef, useMemo } = React;

// ── CONSTANTS ───────────────────────────────────────────────────────────────
const ALL_TAGS = ['rent','family','savings','vegetable','uber','credit','sbi','cash','food','shopping','bills','untagged'];
const TAG_META = {
  rent:      { icon:'🏠', label:'Rent' },
  family:    { icon:'👨‍👩‍👧', label:'Family' },
  savings:   { icon:'💰', label:'Savings' },
  vegetable: { icon:'🥦', label:'Vegetable' },
  uber:      { icon:'🚗', label:'Uber' },
  credit:    { icon:'💳', label:'Credit' },
  sbi:       { icon:'💳', label:'SBI CC' },
  cash:      { icon:'💵', label:'Cash' },
  food:      { icon:'🍽️', label:'Food' },
  shopping:  { icon:'🛍️', label:'Shopping' },
  bills:     { icon:'📋', label:'Bills' },
  untagged:  { icon:'❓', label:'Untagged' },
};
const HEAT_THRESHOLDS = [100,250,500,800,1200,2000,3000,5000,10000];
function heatClass(amt) {
  const i = HEAT_THRESHOLDS.findIndex(t => amt < t);
  return 'h' + (i === -1 ? 9 : i);
}
function heatHex(amt) {
  const colors = ['#059669','#10B981','#65A30D','#84CC16','#CA8A04','#D97706','#EA580C','#DC2626','#B91C1C','#991B1B'];
  const i = HEAT_THRESHOLDS.findIndex(t => amt < t);
  return colors[i === -1 ? 9 : i];
}

const LS_SETTINGS = 'sa_settings_v2';
const LS_TAG_MAP  = 'sa_tagmap_v2';
const LS_MANUAL   = 'sa_manual_v2';

function loadLS(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
function fmt(n)   { return '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN'); }
function fmtK(n)  { return n >= 1000 ? '₹' + (n/1000).toFixed(1) + 'k' : '₹' + Math.round(n); }
function pct(a,b) { return b ? Math.min(100, Math.round(a/b*100)) : 0; }

function parseDate(str) { // DD/MM/YYYY
  const [d,m,y] = str.split('/'); return new Date(+y, +m-1, +d);
}
function toDateStr(date) {
  return date.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function isWeekend(date) { const d = date.getDay(); return d===0||d===6; }
function getWeekOfMonth(date) {
  const first = new Date(date.getFullYear(), date.getMonth(), 1);
  return Math.ceil((date.getDate() + first.getDay()) / 7);
}

function autoTag(txn) {
  const recv = (txn.receiver||'').toUpperCase();
  const [hh,mm] = txn.time.split(':').map(Number);
  const mins = hh*60 + mm;
  const dow = parseDate(txn.date).getDay();
  if (recv.includes('ANKA')) return 'rent';
  if (recv.includes('UMAR')) return 'family';
  if (recv.includes('UBEY')) return 'savings';
  if (recv.includes('MOJO')) return 'food';
  if (recv.includes('SWIGGY')||recv.includes('ZOMATO')) return 'food';
  if (recv.includes('AMZN')||recv.includes('AMAZON')) return 'shopping';
  if (recv.includes('CTET')) return 'bills';
  // Sunday 17:30–19:00 → vegetable
  if (dow===0 && mins>=17*60+30 && mins<=19*60) return 'vegetable';
  // Weekday 08:50–09:40 or 18:10–19:30 → uber
  if (dow>=1 && dow<=5 && ((mins>=8*60+50 && mins<=9*60+40)||(mins>=18*60+10 && mins<=19*60+30))) return 'uber';
  return 'untagged';
}

function parseHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const rows = doc.querySelectorAll('table tr');
  const txns = [];
  let isFirst = true;
  rows.forEach(row => {
    if (isFirst) { isFirst = false; return; }
    const cells = Array.from(row.querySelectorAll('td,th')).map(c => c.innerText.trim());
    if (cells.length < 11) return;
    const [date,time,bank,,sender,receiver,ref,,amount,drCr,status] = cells;
    if (!date || drCr!=='DR' || status!=='SUCCESS') return;
    txns.push({ date, time, bank, sender, receiver, ref, amount: parseFloat(amount)||0 });
  });
  const seen = new Set(), deduped = [];
  for (const t of txns) { if (!seen.has(t.ref)) { seen.add(t.ref); deduped.push(t); } }
  return deduped;
}

}

          h('div',{className:'txn-left'},
            h('div',{className:'txn-recv'},recv),
            h(Bar,{spend:amt,budget:topRecv[0][1]})
          ),
          h('div',{className:`txn-amt ${heatClass(amt)}`},fmt(amt))
        )
      )
    )
  );
}

// ── MONEY PAGE (debts/savings/lent/cash) ─────────────────────────────────────
function MoneyPage({ manual, onManualChange, toast }) {
  const [tab, setTab] = useState('debts');

  function addItem(key) {
    const list = manual[key]||[];
    onManualChange({ ...manual, [key]: [...list, {label:'',amount:0,id:Date.now()}] });
  }
  function updateItem(key, id, field, val) {
    onManualChange({ ...manual, [key]: (manual[key]||[]).map(i=>i.id===id?{...i,[field]:val}:i) });
  }
  function removeItem(key, id) {
    onManualChange({ ...manual, [key]: (manual[key]||[]).filter(i=>i.id!==id) });
  }

  const sections = {
    debts:   { icon:'💳', color:'var(--red)',   label:'Debt repayments',  placeholder:'e.g. Credit card, loan…' },
    savings: { icon:'💰', color:'var(--grn)',   label:'Savings set aside', placeholder:'e.g. SIP, FD, emergency…' },
    lent:    { icon:'🤝', color:'var(--pur)',   label:'Money lent out',    placeholder:'e.g. Lent to Rahul…' },
  };

  const activeSection = sections[tab];
  const list = manual[tab]||[];
  const total = list.reduce((a,i)=>a+i.amount,0);
  const cashSpend = manual.cashSpend||0;

  return h('div', { className:'page' },
    h('div', { className:'ph' },
      h('div', { className:'ph-title' }, 'Money Flows'),
      h('div', { className:'ph-sub' }, 'Debts · Savings · Lent · Cash')
    ),

    h('div', { className:'tab-bar' },
      ['debts','savings','lent','cash'].map(t =>
        h('button', { key:t, className:`tab${tab===t?' on':''}`, onClick:()=>setTab(t) },
          sections[t]?.icon||'💵',
          ' ',
          t==='cash'?'Cash':sections[t]?.label.split(' ')[0]
        )
      )
    ),

    tab !== 'cash' ? h('div', null,
      h('div', { className:'note', style:{background:`${activeSection.color}10`,borderColor:activeSection.color,color:activeSection.color} },
        activeSection.icon+' '+activeSection.label
      ),
      list.length === 0
        ? h('div',{className:'empty',style:{marginBottom:'.5rem'}},h('div',{className:'empty-icon'},activeSection.icon),h('div',{className:'empty-title'},'Nothing added yet'),h('div',{className:'empty-body'},'Tap + Add below to track a '+tab.slice(0,-1)+'.'))
        : h('div', { className:'card', style:{marginBottom:'.5rem'} },
          list.map((item,idx) =>
            h('div', { key:item.id, className:'money-item' },
              h('div', { className:'f1', style:{display:'flex',flexDirection:'column',gap:4} },
                h('input', { type:'text', value:item.label, placeholder:activeSection.placeholder, onChange:e=>updateItem(tab,item.id,'label',e.target.value), style:{padding:'.3rem .6rem',fontSize:'.72rem'} }),
                h('input', { type:'number', value:item.amount||'', inputMode:'numeric', placeholder:'Amount', onChange:e=>updateItem(tab,item.id,'amount',parseFloat(e.target.value)||0), style:{padding:'.3rem .6rem',fontSize:'.72rem'} })
              ),
              h('button', { className:'btn-del', onClick:()=>removeItem(tab,item.id) }, '✕')
            )
          ),
          h('div', { style:{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:'.5rem',borderTop:'1px solid var(--bd)',marginTop:'.25rem'} },
            h('span',{style:{fontSize:'.65rem',fontWeight:700,color:'var(--m1)'}},tab==='debts'?'Total paid':tab==='savings'?'Total saved':'Total lent'),
            h('span',{style:{fontFamily:'var(--mono)',fontWeight:800,fontSize:'.88rem',color:activeSection.color}},fmt(total))
          )
        ),
      h('button', { className:'btn btn-sec btn-sm', style:{width:'auto',marginBottom:'.5rem'}, onClick:()=>addItem(tab) }, '+ Add '+tab.slice(0,-1))
    ) : h('div', null,
      h('div', { className:'note note-amb' }, '💵 Cash purchases not in your bank history'),
      h('div', { className:'card' },
        h('label', null, 'Total cash spent'),
        h('input', { type:'number', inputMode:'numeric', value:cashSpend||'', placeholder:'0', onChange:e=>onManualChange({...manual,cashSpend:parseFloat(e.target.value)||0}) }),
        cashSpend>0 && h('div', { style:{marginTop:'.4rem',fontSize:'.65rem',fontFamily:'var(--mono)',color:'var(--amb)',fontWeight:600} }, '−'+fmt(cashSpend)+' from balance')
      )
    )
  );
}

// ── SETTINGS PAGE ────────────────────────────────────────────────────────────
function SettingsPage({ settings, onSettingsChange, txnCount, toast }) {
  const [loc, setLoc] = useState({ ...settings });
  function save() { onSettingsChange(loc); toast('Settings saved ✓'); }

  return h('div', { className:'page' },
    h('div', { className:'ph' },
      h('div', { className:'ph-title' }, 'Settings'),
      h('div', { className:'ph-sub' }, txnCount+' transactions loaded')
    ),

    h('div', { className:'sh' }, 'Salary'),
    h('div', { className:'card' },
      h('div', { className:'row mb' },
        h('div', { className:'f1' },
          h('label', null, 'Monthly salary'),
          h('input', { type:'number', inputMode:'numeric', value:loc.salary||'', placeholder:'e.g. 102844', onChange:e=>setLoc({...loc,salary:parseFloat(e.target.value)||0}) })
        )
      ),
      h('div', null,
        h('label', null, 'Salary credited date'),
        h('input', { type:'date', value:loc.salaryDate||'', onChange:e=>setLoc({...loc,salaryDate:e.target.value}) }),
        h('div', { style:{fontSize:'.6rem',color:'var(--m2)',marginTop:4} }, 'Only transactions on or after this date are counted')
      )
    ),

    h('div', { className:'sh' }, 'Auto-tag rules'),
    h('div', { className:'note note-blu' }, 'ℹ These are automatic. Future: custom keywords coming.'),
    h('div', { className:'card' },
      [
        ['🏠 ANKA','Rent'],['👨‍👩‍👧 UMAR','Family'],['💰 UBEY','Savings'],
        ['🥦 Sunday 17:30–19:00','Vegetable'],['🚗 Weekday morning/evening','Uber'],
        ['🍽️ Swiggy/Zomato/Mojo','Food'],['🛍️ Amazon','Shopping'],
      ].map(([rule,tag],i,arr)=>
        h('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.3rem 0',borderBottom:i<arr.length-1?'1px solid var(--bd)':'none'}},
          h('span',{style:{fontSize:'.68rem',color:'var(--m1)'}},rule),
          h('span',{className:`tag-${tag.toLowerCase()}`,style:{display:'inline-flex',alignItems:'center',padding:'2px 8px',borderRadius:'99px',fontSize:'.5rem',fontWeight:700,border:'1px solid currentColor',opacity:.9}},tag)
        )
      )
    ),

    h('div', { className:'sh' }, 'Data'),
    h('div', { className:'card' },
      h('div',{className:'ins-row'},
        h('span',{className:'ins-lbl'},'Transactions loaded'),
        h('span',{className:'ins-val'},txnCount)
      ),
      h('div',{className:'ins-row'},
        h('span',{className:'ins-lbl'},'Tags saved in browser'),
        h('span',{className:'ins-val',style:{color:'var(--grn)'}},'✓ Auto-saved')
      )
    ),

    h('button', { className:'btn btn-pri', style:{marginTop:'.5rem'}, onClick:save }, '✓ Save Settings'),

    h('div', { className:'sh', style:{color:'var(--red)'} }, 'Danger zone'),
    h('button', { className:'btn btn-red', onClick:()=>{
      if(confirm('Clear all saved tags and settings?')){
        localStorage.removeItem(LS_SETTINGS);
        localStorage.removeItem(LS_TAG_MAP);
        localStorage.removeItem(LS_MANUAL);
        window.location.reload();
      }
    }}, '🗑 Clear all saved data')
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [settings, setSettings] = useState(() => loadLS(LS_SETTINGS, { salary:0, salaryDate:'' }));
  const [tagMap,   setTagMap]   = useState(() => loadLS(LS_TAG_MAP, {}));
  const [manual,   setManual]   = useState(() => loadLS(LS_MANUAL, { debts:[], savings:[], lent:[], cashSpend:0 }));
  const [rawTxns,  setRawTxns]  = useState([]);  // parsed, deduped, date-filtered
  const [page,     setPage]     = useState('upload');
  const [toastMsg, setToastMsg] = useState('');
  const toastRef = useRef();

  function showToast(msg) {
    setToastMsg(msg);
    if (toastRef.current) clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToastMsg(''), 2200);
  }

  // Persist
  useEffect(() => { saveLS(LS_SETTINGS, settings); }, [settings]);
  useEffect(() => { saveLS(LS_TAG_MAP,  tagMap);   }, [tagMap]);
  useEffect(() => { saveLS(LS_MANUAL,   manual);   }, [manual]);

  // Build display txns: rawTxns + tagMap applied
  const txns = useMemo(() => {
    return rawTxns.map(t => ({ ...t, tag: tagMap[t.ref] || t.autoTag }));
  }, [rawTxns, tagMap]);

  function handleLoad(html) {
    const parsed = parseHTML(html);
    // Filter by salary date if set
    const cutoff = settings.salaryDate ? new Date(settings.salaryDate) : null;
    const filtered = parsed
      .filter(t => {
        if (!cutoff) return true;
        const d = parseDate(t.date);
        return d >= cutoff;
      })
      .map(t => ({ ...t, autoTag: autoTag(t) }));

    setRawTxns(filtered);
    setPage('overview');
    const newCount = filtered.filter(t => !tagMap[t.ref]).length;
    const total = filtered.length;
    showToast(`Loaded ${total} txns · ${newCount} new to tag`);
  }

  function handleTagChange(ref, tag) {
    setTagMap(prev => ({ ...prev, [ref]: tag }));
  }

  function handleManualChange(m) {
    setManual(m);
  }

  function handleSettingsChange(s) {
    setSettings(s);
  }

  const hasData = txns.length > 0;
  const untaggedCount = txns.filter(t => t.tag === 'untagged').length;

  const navItems = [
    { id:'upload',   label:'Upload' },
    { id:'overview', label:'Overview' },
    { id:'tag',      label: untaggedCount>0 ? `Tag ${untaggedCount}` : 'Tag' },
    { id:'insights', label:'Insights' },
    { id:'money',    label:'Money' },
    { id:'settings', label:'Settings' },
  ];

  function navIcon(id) {
    if (id==='upload')   return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'17 8 12 3 7 8'}),h('line',{x1:12,y1:3,x2:12,y2:15}));
    if (id==='overview') return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:3,y:3,width:7,height:7,rx:1}),h('rect',{x:14,y:3,width:7,height:7,rx:1}),h('rect',{x:3,y:14,width:7,height:7,rx:1}),h('rect',{x:14,y:14,width:7,height:7,rx:1}));
    if (id==='tag')      return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z'}),h('line',{x1:7,y1:7,x2:7.01,y2:7}));
    if (id==='insights') return h('svg',{viewBox:'0 0 24 24'},h('polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'}));
    if (id==='money')    return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:2,y:5,width:20,height:14,rx:2}),h('line',{x1:2,y1:10,x2:22,y2:10}));
    if (id==='settings') return h('svg',{viewBox:'0 0 24 24'},h('circle',{cx:12,cy:12,r:3}),h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'}));
  }

  // No data guard for non-upload/settings pages
  const needsData = ['overview','tag','insights'].includes(page) && !hasData;

  return h('div', null,
    page==='upload'   && h(UploadPage,   { onLoad:handleLoad, hasData }),
    page==='overview' && (needsData ? null : h(OverviewPage, { txns, settings, manual })),
    page==='tag'      && (needsData ? null : h(TagPage,      { txns, onTagChange:(ref,tag)=>handleTagChange(ref, tag) })),
    page==='insights' && (needsData ? null : h(InsightsPage, { txns })),
    page==='money'    && h(MoneyPage,    { manual, onManualChange:handleManualChange, toast:showToast }),
    page==='settings' && h(SettingsPage, { settings, onSettingsChange:handleSettingsChange, txnCount:txns.length, toast:showToast }),

    needsData && h('div', { style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(247,248,250,.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,backdropFilter:'blur(4px)'} },
      h('div', { className:'card', style:{maxWidth:'260px',textAlign:'center',padding:'1.5rem'} },
        h('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'📂'),
        h('div',{style:{fontWeight:700,marginBottom:'.35rem'}},'No transactions'),
        h('div',{style:{fontSize:'.7rem',color:'var(--m2)',marginBottom:'.75rem'}},'Upload your YES Bank transaction HTML first.'),
        h('button',{className:'btn btn-pri',onClick:()=>setPage('upload')},'Go to Upload')
      )
    ),

    h('nav', { className:'nav' },
      navItems.map(n =>
        h('button', { key:n.id, className:`nb${page===n.id?' on':''}`, onClick:()=>setPage(n.id) },
          navIcon(n.id),
          h('span',{style:{fontSize:'.44rem',fontWeight:700,letterSpacing:'.05em',textTransform:'uppercase'}},n.label),
          h('span',{className:'nb-dot'})
        )
      )
    ),
    h(Toast, { msg: toastMsg })
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
</body>
</html>
