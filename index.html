<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Spend Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F0ECFF;
  --s0:#FFFFFF;
  --s1:#EAE4FF;
  --s2:#DDD6FF;
  --bd:#CAC0F0;
  --bd2:#B0A4E0;
  --tx:#1A0A3C;
  --m1:#4A3A72;
  --m2:#8C7EAE;

  --p1:#6D28D9;--p2:#7C3AED;--p3:#8B5CF6;--p4:#A78BFA;--p5:#EDE9FE;
  --p-dk:#4C1D95;

  --rose:#E11D48;--rose-lt:#FFF1F2;--rose-bd:#FECDD3;
  --grn:#059669;--grn-lt:#ECFDF5;--grn-bd:#A7F3D0;
  --amb:#B45309;--amb-lt:#FFFBEB;--amb-bd:#FDE68A;
  --sky:#0369A1;--sky-lt:#F0F9FF;--sky-bd:#BAE6FD;
  --pnk:#BE185D;--pnk-lt:#FDF2F8;--pnk-bd:#FBCFE8;
  --org:#C2410C;--org-lt:#FFF7ED;--org-bd:#FED7AA;
  --teal:#0F766E;--teal-lt:#F0FDFA;--teal-bd:#99F6E4;

  --mono:'JetBrains Mono',monospace;
  --sans:'Plus Jakarta Sans',sans-serif;
  --r:18px;--rs:12px;
  --nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --sh:0 2px 10px rgba(109,40,217,.09),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 8px 32px rgba(109,40,217,.2),0 2px 8px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow-x:hidden;font-size:16px;line-height:1.5}
#root{display:flex;flex-direction:column;min-height:100%}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));
  background:rgba(255,255,255,.98);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:2px solid var(--bd);display:flex;align-items:stretch;z-index:100;
  padding-bottom:var(--safe-b);box-shadow:0 -4px 28px rgba(109,40,217,.12)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:none;border:none;cursor:pointer;color:var(--m2);font-family:var(--sans);
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:color .15s;padding:0}
.nb.on{color:var(--p2)}
.nb svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor;transition:stroke .15s}
.nb-pip{width:20px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p3));display:none;margin-top:1px}
.nb.on .nb-pip{display:block}

.page{flex:1;padding:.75rem 1rem calc(var(--nav-h) + var(--safe-b) + 1.25rem);max-width:540px;margin:0 auto;width:100%}

/* ── CARDS ── */
.card{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);padding:1rem 1.15rem;margin-bottom:.6rem;box-shadow:var(--sh)}

/* ── PAGE HEADER ── */
.ph{padding:.8rem 0 .65rem;display:flex;align-items:baseline;justify-content:space-between}
.ph-title{font-size:1.5rem;font-weight:900;color:var(--tx);letter-spacing:-.03em}
.ph-sub{font-size:12px;color:var(--m2);font-family:var(--mono)}

/* ── SECTION HEADER ── */
.sh{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--p2);font-weight:900;
  margin:1.3rem 0 .6rem;display:flex;align-items:center;gap:.6rem}
.sh::after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,var(--bd),transparent)}

/* ── HERO CARD ── */
.hero{border-radius:var(--r);padding:1.3rem;margin-bottom:.6rem;border:1.5px solid;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;opacity:.1;background:currentColor;pointer-events:none}
.hero-lbl{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.3rem;opacity:.75}
.hero-amt{font-family:var(--mono);font-size:2.8rem;font-weight:700;line-height:1;letter-spacing:-.04em;margin-bottom:.4rem}
.hero-sub{font-size:12px;font-family:var(--mono);opacity:.75}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-top:.85rem;padding-top:.7rem;border-top:1px solid currentColor;opacity:.9}
.hg-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.72;margin-bottom:.2rem;font-weight:800}
.hg-val{font-family:var(--mono);font-weight:700;font-size:1rem}
.hero-ok{background:linear-gradient(140deg,#ECFDF5,#D1FAE5);border-color:var(--grn-bd);color:#065F46}
.hero-warn{background:linear-gradient(140deg,#FFFBEB,#FEF3C7);border-color:var(--amb-bd);color:#78350F}
.hero-bad{background:linear-gradient(140deg,#FFF1F2,#FFE4E6);border-color:var(--rose-bd);color:#9F1239}
.hero-pur{background:linear-gradient(140deg,#F5F3FF,#EDE9FE);border-color:var(--p4);color:var(--p-dk)}

/* ── STAT CARDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.sc{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);padding:.85rem 1rem;box-shadow:var(--sh)}
.sc-lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--m2);margin-bottom:.3rem}
.sc-val{font-family:var(--mono);font-size:1.35rem;font-weight:700;line-height:1}
.sc-sub{font-size:11px;color:var(--m2);margin-top:.22rem;font-family:var(--mono)}
.sc-top{border-top:3px solid}

/* ── HEAT COLORS ── */
.h0{color:#6D28D9}.h1{color:#7C3AED}.h2{color:#059669}.h3{color:#0D9488}
.h4{color:#B45309}.h5{color:#D97706}.h6{color:#C2410C}.h7{color:#DC2626}
.h8{color:#B91C1C}.h9{color:#991B1B}

/* ── BAR ── */
.bw{background:var(--s1);border-radius:99px;height:5px;margin-top:6px;overflow:hidden}
.bf{height:5px;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── NOTES ── */
.note{display:flex;align-items:center;gap:8px;padding:.55rem .9rem;border-radius:var(--rs);
  font-size:13px;font-weight:700;margin-bottom:.5rem;border-left:3.5px solid}
.n-pur{background:var(--p5);border-color:var(--p2);color:var(--p-dk)}
.n-grn{background:var(--grn-lt);border-color:var(--grn);color:#065F46}
.n-amb{background:var(--amb-lt);border-color:var(--amb);color:#78350F}
.n-red{background:var(--rose-lt);border-color:var(--rose);color:#9F1239}
.n-sky{background:var(--sky-lt);border-color:var(--sky);color:var(--sky)}
.n-teal{background:var(--teal-lt);border-color:var(--teal);color:var(--teal)}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;
  font-size:11px;font-weight:800;letter-spacing:.04em;border:1.5px solid;white-space:nowrap}
.tag-rent      {background:#EEF2FF;border-color:#C7D2FE;color:#3730A3}
.tag-electricity{background:var(--amb-lt);border-color:var(--amb-bd);color:var(--amb)}
.tag-family    {background:var(--p5);border-color:var(--p4);color:var(--p-dk)}
.tag-savings   {background:var(--grn-lt);border-color:var(--grn-bd);color:#065F46}
.tag-vegetable {background:#F0FDF4;border-color:#BBF7D0;color:#15803D}
.tag-uber      {background:var(--rose-lt);border-color:var(--rose-bd);color:var(--rose)}
.tag-yescc     {background:var(--amb-lt);border-color:var(--amb-bd);color:var(--amb)}
.tag-recharge  {background:var(--sky-lt);border-color:var(--sky-bd);color:var(--sky)}
.tag-entertainment{background:var(--pnk-lt);border-color:var(--pnk-bd);color:var(--pnk)}
.tag-milk      {background:var(--teal-lt);border-color:var(--teal-bd);color:var(--teal)}
.tag-other     {background:var(--s1);border-color:var(--bd2);color:var(--m1)}
.tag-furniture {background:var(--org-lt);border-color:var(--org-bd);color:var(--org)}
.tag-bills     {background:#F5F3FF;border-color:#DDD6FE;color:#5B21B6}
.tag-untagged  {background:var(--s2);border-color:var(--bd2);color:var(--m2)}

/* ── INPUTS ── */
input,select,textarea{width:100%;background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);
  border-radius:var(--rs);font-family:var(--sans);font-size:15px;font-weight:600;
  padding:.6rem .9rem;outline:none;transition:border-color .15s,box-shadow .15s;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--p3);box-shadow:0 0 0 3px rgba(139,92,246,.15);background:var(--s0)}
input::placeholder{color:var(--m2)}
label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--m1);display:block;margin-bottom:5px}

/* ── BUTTONS ── */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:.75rem 1.1rem;
  border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--sans);font-weight:800;
  font-size:15px;transition:all .12s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-pri{background:linear-gradient(135deg,var(--p-dk),var(--p2));color:#fff;box-shadow:0 4px 16px rgba(109,40,217,.35)}
.btn-sec{background:var(--s0);border:1.5px solid var(--bd);color:var(--m1)}
.btn-red{background:var(--rose-lt);border:1.5px solid var(--rose-bd);color:var(--rose)}
.btn-sm{padding:.38rem .85rem;font-size:13px;width:auto}
.del-btn{background:none;border:none;color:var(--m2);cursor:pointer;padding:5px 7px;
  border-radius:7px;font-size:16px;transition:color .1s;flex-shrink:0}
.del-btn:hover{color:var(--rose)}

/* ── UPLOAD ── */
.upload-zone{border:2px dashed var(--bd2);border-radius:var(--r);padding:2.5rem 1rem;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--s0)}
.upload-zone.drag,.upload-zone:hover{border-color:var(--p3);background:var(--p5)}
.upload-zone input{display:none}

/* ── TRANSACTION ROWS ── */
.txn-list{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:.6rem;box-shadow:var(--sh)}
.txn-row{display:flex;align-items:flex-start;gap:.6rem;padding:.72rem 1rem;border-bottom:1px solid var(--bd);transition:background .1s}
.txn-row:last-child{border-bottom:none}
.txn-row:hover{background:var(--s1)}
.txn-left{flex:1;min-width:0}
.txn-date{font-size:11px;color:var(--m2);font-family:var(--mono);margin-bottom:3px}
.txn-recv{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amt{font-family:var(--mono);font-weight:700;font-size:15px}
.tag-sel{background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);border-radius:99px;
  font-family:var(--sans);font-size:12px;font-weight:800;padding:3px 10px;
  outline:none;cursor:pointer;width:auto}
.tag-sel:focus{border-color:var(--p3)}

/* ── WATERFALL ── */
.wf-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.wf-row:last-child{border-bottom:none}
.wf-lbl{font-size:13px;color:var(--m1);font-weight:500}
.wf-val{font-family:var(--mono);font-weight:700;font-size:13px}

/* ── CAT ROW ── */
.cat-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-icon{font-size:1.1rem;width:28px;text-align:center;flex-shrink:0}
.cat-name{font-size:14px;font-weight:700}
.cat-cnt{font-size:11px;color:var(--m2);font-family:var(--mono)}
.cat-amt{font-family:var(--mono);font-weight:700;font-size:14px}

/* ── TAB BAR ── */
.tab-bar{display:flex;background:var(--s1);border-radius:12px;padding:3px;margin-bottom:.75rem;gap:2px;border:1.5px solid var(--bd)}
.tab{flex:1;padding:.38rem .3rem;border:none;border-radius:9px;cursor:pointer;font-family:var(--sans);
  font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--m2);background:transparent;transition:all .15s;white-space:nowrap}
.tab.on{color:var(--p2);background:var(--s0);box-shadow:var(--sh)}

/* ── INS ROW ── */
.ins-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.ins-row:last-child{border-bottom:none}
.ins-lbl{font-size:13px;color:var(--m1);font-weight:500}
.ins-val{font-family:var(--mono);font-weight:700;font-size:14px}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;padding:2.5rem 1rem;text-align:center;
  gap:.5rem;background:var(--s0);border:1.5px dashed var(--bd2);border-radius:var(--r)}
.empty-icon{font-size:2.5rem}.empty-title{font-size:1rem;font-weight:800;color:var(--m1)}
.empty-body{font-size:13px;color:var(--m2);max-width:220px;line-height:1.5}

/* ── MONEY ITEM ── */
.money-item{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--bd)}
.money-item:last-child{border-bottom:none}

/* ── WEEKEND CARD ── */
.wknd-card{background:var(--s0);border:1.5px solid var(--pnk-bd);border-radius:var(--r);overflow:hidden;margin-bottom:.6rem;box-shadow:var(--sh)}
.wknd-head{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;
  background:linear-gradient(135deg,#FDF2F8,#FCE7F3);border-bottom:1px solid var(--pnk-bd)}
.wknd-day{display:flex;justify-content:space-between;align-items:center;padding:.5rem 1rem;border-bottom:1px solid var(--bd)}
.wknd-day:last-child{border-bottom:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--p-dk),var(--p2));color:#fff;padding:.5rem 1.4rem;
  border-radius:99px;font-size:13px;font-weight:800;z-index:200;animation:fu .18s ease;
  white-space:nowrap;box-shadow:0 4px 24px rgba(109,40,217,.4)}
@keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── UPLOAD WELCOME CARD ── */
.welcome-card{background:linear-gradient(135deg,var(--p1),var(--p3));border-radius:var(--r);
  color:#fff;padding:1.2rem;margin-bottom:.75rem;box-shadow:var(--sh2);position:relative;overflow:hidden}
.welcome-card::after{content:'💸';position:absolute;right:.75rem;top:50%;transform:translateY(-50%);
  font-size:3rem;opacity:.2}

hr{border:none;border-top:1px solid var(--bd);margin:.65rem 0}
.row{display:flex;align-items:center;gap:.5rem}
.f1{flex:1}
.mb{margin-bottom:.6rem}

@media(max-width:380px){.g3{grid-template-columns:1fr 1fr}.ph-title{font-size:1.25rem}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const{createElement:h,useState,useEffect,useRef,useMemo}=React;

const LS={RAW:'sa_raw_v5',TAGS:'sa_tags_v5',SET:'sa_set_v5',MAN:'sa_man_v5'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

// ── TAGS ──────────────────────────────────────────────────────────────────
const TAGS=['rent','electricity','family','savings','milk','vegetable','uber','yescc','recharge',
            'entertainment','furniture','bills','other','untagged'];
const TM={
  rent:          {icon:'🏠',label:'Rent',color:'#3730A3'},
  electricity:   {icon:'⚡',label:'Electricity',color:'#B45309'},
  family:        {icon:'👨‍👩‍👧',label:'Family',color:'#4C1D95'},
  savings:       {icon:'💰',label:'Savings',color:'#065F46'},
  milk:          {icon:'🥛',label:'Milk / Provi',color:'#0F766E'},
  vegetable:     {icon:'🥦',label:'Vegetable',color:'#15803D'},
  uber:          {icon:'🚗',label:'Uber',color:'#9F1239'},
  yescc:         {icon:'💳',label:'YES Credit',color:'#78350F'},
  recharge:      {icon:'📱',label:'Recharge',color:'#0369A1'},
  entertainment: {icon:'🛍️',label:'Mall / Fun',color:'#BE185D'},
  furniture:     {icon:'🪑',label:'Furniture',color:'#C2410C'},
  bills:         {icon:'📋',label:'Bills',color:'#5B21B6'},
  other:         {icon:'🧾',label:'Other',color:'#4A3A72'},
  untagged:      {icon:'❓',label:'Untagged',color:'#8C7EAE'},
};

// ── HELPERS ───────────────────────────────────────────────────────────────
const fmt=n=>'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const fmtK=n=>n>=1000?'₹'+(n/1000).toFixed(1)+'k':'₹'+Math.round(n);
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;
function parseDate(s){const[d,m,y]=s.split('/');return new Date(+y,+m-1,+d)}
function isWeekend(d){const w=d.getDay();return w===0||w===6}
function weekOfMonth(d){const f=new Date(d.getFullYear(),d.getMonth(),1);return Math.ceil((d.getDate()+f.getDay())/7)}

// Show the part after @ up to ( — cleaner than full VPA
function cleanRecv(recv){
  if(!recv)return '';
  // Try to get name from parens first
  const pm=recv.match(/\(([^)]+)\)/);
  if(pm){
    const name=pm[1].replace(/x+/gi,'').trim();
    if(name.length>=3&&!/^\s*$/.test(name))return name;
  }
  // Fall back to part after @
  const am=recv.match(/@([^(@\s]+)/);
  return am?am[1]:'?';
}

const HEAT_T=[100,250,500,900,1500,2500,4000,6000,12000];
const HEAT_C=['#6D28D9','#7C3AED','#059669','#0D9488','#B45309','#D97706','#C2410C','#DC2626','#B91C1C','#991B1B'];
function heatCls(n){const i=HEAT_T.findIndex(t=>n<t);return'h'+(i<0?9:i)}
function heatHex(n){const i=HEAT_T.findIndex(t=>n<t);return HEAT_C[i<0?9:i]}

// ── AUTO-TAGGER ───────────────────────────────────────────────────────────
function autoTag(txn){
  const recv=(txn.receiver||'').toUpperCase();
  const vpa=(txn.receiverVpa||'').toLowerCase();
  const[hh,mm]=txn.time.split(':').map(Number);
  const mins=hh*60+mm;
  const date=parseDate(txn.date);
  const dow=date.getDay(); // 0=Sun,6=Sat
  const we=dow===0||dow===6;
  const wd=dow>=1&&dow<=5;
  const amt=txn.amount;

  // YES Bank Credit Card — from bank column
  if(txn.isYesCC) return 'yescc';

  // ── Named receivers — highest priority ──
  // ANKA: 15000 = rent, anything else = electricity
  if(recv.includes('ANKA')) return amt===15000?'rent':'electricity';

  // UMAR = family (father)
  if(recv.includes('UMAR')) return 'family';

  // UBEY = savings
  if(recv.includes('UBEY')) return 'savings';

  // MOJO = furniture rent (variable)
  if(recv.includes('MOJO')) return 'furniture';

  // Milk / provi: recurring small payments to same VPA
  // xxxxx92158@ybl (rpet) and bokre@ybl — both are milk bills
  if(vpa.includes('92158@ybl')||vpa.startsWith('bokre@ybl')) return 'milk';

  // Pronto = milk delivery app (cf.xronto@cashfreensdlpb, paytm-xxx64064@ptybl)
  if(recv.includes('PRONTO')||vpa.includes('xronto@cashfree')) return 'milk';

  // Recharge: @icici (Jio/Airtel), @airtel, rxairtel
  if(vpa.includes('@icici')&&(recv.includes('JIO')||recv.includes('AIRTEL'))) return 'recharge';
  if(vpa.includes('rxairtel')||vpa.includes('@airtel')) return 'recharge';
  if(recv.includes('JIO')) return 'recharge';

  // Bills: recurring utility-looking payments to kotakpay (non-credit-card), indus, ctet
  if(vpa.includes('kotakpay')&&!recv.includes('CARDP')) return 'bills';
  if(recv.includes('CTET')) return 'bills';

  // Sunday 17:30–19:00 → vegetable
  if(dow===0&&mins>=17*60+30&&mins<=19*60) return 'vegetable';

  // Weekday 08:50–09:40 or 18:10–19:30 → uber (hybrid office commute)
  if(wd&&((mins>=8*60+50&&mins<=9*60+40)||(mins>=18*60+10&&mins<=19*60+30))) return 'uber';

  // Weekend (Sat/Sun) → Mall / Entertainment
  if(we) return 'entertainment';

  // Weekday: < ₹500 → other; ≥ ₹500 → untagged (manual review)
  if(wd&&amt<500) return 'other';
  return 'untagged';
}

// ── PARSER ────────────────────────────────────────────────────────────────
function parseHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const rows=doc.querySelectorAll('table tr');
  const txns=[];let first=true;
  rows.forEach(row=>{
    if(first){first=false;return}
    const cells=Array.from(row.querySelectorAll('td,th')).map(c=>c.innerText.trim());
    if(cells.length<11)return;
    const[date,time,bank,,senderRaw,receiver,ref,,amount,drCr,status]=cells;
    if(!date||drCr!=='DR'||status!=='SUCCESS')return;
    const isYesCC=bank.toUpperCase().includes('CREDIT CARD');
    const vpam=receiver.match(/^([^(]+)/);
    const receiverVpa=vpam?vpam[1].trim():'';
    txns.push({date,time,bank,receiver,receiverVpa,ref,amount:parseFloat(amount)||0,isYesCC});
  });
  const seen=new Set(),out=[];
  for(const t of txns){if(!seen.has(t.ref)){seen.add(t.ref);out.push(t)}}
  return out;
}

function detectSalaryDate(raws){
  const kw=['ANKA','UMAR','UBEY','MOJO'];
  const hits=raws.filter(t=>kw.some(k=>t.receiver.toUpperCase().includes(k)));
  if(!hits.length)return null;
  hits.sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  return hits[0].date;
}

      h('div',{className:'sc sc-top',style:{borderTopColor:'var(--pnk)'}},h('div',{className:'sc-lbl'},'🛍️ Weekend'),h('div',{className:`sc-val ${heatCls(weTotal)}`},fmtK(weTotal)),h('div',{className:'sc-sub'},fmt(weTotal/weDays)+'/day')),
      h('div',{className:'sc sc-top',style:{borderTopColor:'var(--p3)'}},h('div',{className:'sc-lbl'},'💼 Weekday'),h('div',{className:`sc-val ${heatCls(wdTotal)}`},fmtK(wdTotal)),h('div',{className:'sc-sub'},fmt(wdTotal/wdDays)+'/day'))
    ),

    wkndWeeks.length>0&&h('div',null,
      h('div',{className:'sh'},'Weekend Breakdown'),
      wkndWeeks.map(([wk,data])=>
        h('div',{key:wk,className:'wknd-card'},
          h('div',{className:'wknd-head'},
            h('span',{style:{fontWeight:900,fontSize:'15px',color:'var(--pnk)'}},'🛍️ '+wk+' Weekend'),
            h('span',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:'16px',color:heatHex(data.total)}},fmt(data.total))
          ),
          Object.entries(data.days).sort((a,b)=>a[0].localeCompare(b[0])).map(([ds,dd])=>
            h('div',{key:ds,className:'wknd-day'},
              h('div',{style:{fontSize:'14px',fontWeight:700}},DNS[dd.date.getDay()]+', '+ds),
              h('span',{style:{fontFamily:'var(--mono)',fontWeight:700,color:heatHex(dd.total)}},fmt(dd.total))
            )
          )
        )
      )
    )
  );
}

// ── MONEY PAGE ────────────────────────────────────────────────────────────
function MoneyPage({manual,onManualChange}){
  const[tab,setTab]=useState('debts');
  function add(k){onManualChange({...manual,[k]:[...(manual[k]||[]),{label:'',amount:0,id:Date.now()}]})}
  function upd(k,id,f,v){onManualChange({...manual,[k]:(manual[k]||[]).map(i=>i.id===id?{...i,[f]:v}:i)})}
  function del(k,id){onManualChange({...manual,[k]:(manual[k]||[]).filter(i=>i.id!==id)})}
  const SEC={debts:{icon:'💳',color:'var(--rose)',hint:'Credit bills, loans, EMIs — deducted from balance'},savings:{icon:'💰',color:'var(--grn)',hint:'SIP, FD, savings — deducted from balance'},lent:{icon:'🤝',color:'var(--p3)',hint:'Money given out to someone — deducted from balance'}};
  const sec=SEC[tab];
  const list=manual[tab]||[];
  const total=list.reduce((a,i)=>a+i.amount,0);
  const cashSpend=manual.cashSpend||0;
  return h('div',{className:'page'},
    h('div',{className:'ph'},h('div',{className:'ph-title'},'Money Flows'),h('div',{className:'ph-sub'},'All deducted from balance')),
    h('div',{className:'tab-bar'},['debts','savings','lent','cash'].map(t=>h('button',{key:t,className:`tab${tab===t?' on':''}`,onClick:()=>setTab(t)},(SEC[t]?.icon||'💵')+' '+(t==='cash'?'Cash':t.charAt(0).toUpperCase()+t.slice(1))))),
    tab!=='cash'?h('div',null,
      h('div',{className:'note',style:{background:`${sec.color}14`,borderColor:sec.color,color:sec.color}},sec.icon+' '+sec.hint),
      list.length===0?h('div',{className:'empty',style:{marginBottom:'.6rem'}},h('div',{className:'empty-icon'},sec.icon),h('div',{className:'empty-title'},'None added'))
        :h('div',{className:'card mb'},
          list.map(item=>h('div',{key:item.id,className:'money-item'},
            h('div',{className:'f1',style:{display:'flex',flexDirection:'column',gap:5}},
              h('input',{type:'text',value:item.label,placeholder:'Label…',onChange:e=>upd(tab,item.id,'label',e.target.value)}),
              h('input',{type:'number',value:item.amount||'',inputMode:'numeric',placeholder:'Amount',onChange:e=>upd(tab,item.id,'amount',parseFloat(e.target.value)||0)})
            ),
            h('button',{className:'del-btn',onClick:()=>del(tab,item.id)},'✕')
          )),
          h('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'.5rem',borderTop:'1px solid var(--bd)',marginTop:'.25rem'}},
            h('span',{style:{fontSize:'13px',fontWeight:700,color:'var(--m1)'}},'Total'),
            h('span',{style:{fontFamily:'var(--mono)',fontWeight:900,fontSize:'1rem',color:sec.color}},fmt(total))
          )
        ),
      h('button',{className:'btn btn-sec btn-sm',style:{marginBottom:'.6rem'},onClick:()=>add(tab)},'+ Add')
    ):h('div',null,
      h('div',{className:'note n-amb'},'💵 Cash purchases not captured in bank history — deducted from balance'),
      h('div',{className:'card'},h('label',null,'Total cash spent this period'),h('input',{type:'number',inputMode:'numeric',value:cashSpend||'',placeholder:'0',onChange:e=>onManualChange({...manual,cashSpend:parseFloat(e.target.value)||0})}),
        cashSpend>0&&h('div',{style:{marginTop:'.45rem',fontSize:'12px',fontFamily:'var(--mono)',color:'var(--amb)',fontWeight:700}},'−'+fmt(cashSpend)+' deducted from balance')
      )
    )
  );
}

// ── SETTINGS ──────────────────────────────────────────────────────────────
function SettingsPage({settings,onSave,txnCount,autoDate,toast}){
  const[loc,setLoc]=useState({...settings});
  function save(){onSave(loc);toast('Settings saved ✓')}
  return h('div',{className:'page'},
    h('div',{className:'ph'},h('div',{className:'ph-title'},'Settings'),h('div',{className:'ph-sub'},txnCount+' transactions loaded')),
    h('div',{className:'sh'},'Income'),
    h('div',{className:'card'},
      h('div',{className:'mb'},h('label',null,'Monthly salary'),h('input',{type:'number',inputMode:'numeric',value:loc.salary||'',placeholder:'e.g. 102844',onChange:e=>setLoc({...loc,salary:parseFloat(e.target.value)||0})})),
      h('div',{className:'mb'},h('label',null,'Cash in hand (adds to total income)'),h('input',{type:'number',inputMode:'numeric',value:loc.cashInHand||'',placeholder:'0',onChange:e=>setLoc({...loc,cashInHand:parseFloat(e.target.value)||0})})),
      h('div',null,h('label',null,'SBI credit card spent this month'),h('input',{type:'number',inputMode:'numeric',value:loc.sbiSpent||'',placeholder:'0',onChange:e=>setLoc({...loc,sbiSpent:parseFloat(e.target.value)||0})}),h('div',{style:{fontSize:'12px',color:'var(--m2)',marginTop:4}},'Enter manually — deducted from your balance'))
    ),
    h('div',{className:'sh'},'Salary Start Date'),
    h('div',{className:'card'},
      autoDate&&h('div',{className:'note n-grn',style:{marginBottom:'.5rem'}},'✓ Auto-detected: '+autoDate+' — first payment to ANKA/UMAR/UBEY/MOJO'),
      h('label',null,'Override (optional)'),
      h('input',{type:'date',value:loc.salaryDate||'',onChange:e=>setLoc({...loc,salaryDate:e.target.value})}),
      h('div',{style:{fontSize:'12px',color:'var(--m2)',marginTop:4}},'Only transactions from this date are counted. Leave blank to use auto-detected date.')
    ),
    h('button',{className:'btn btn-pri',style:{marginTop:'.4rem',marginBottom:'.6rem'},onClick:save},'✓ Save Settings'),
    h('div',{className:'sh'},'Data'),
    h('div',{className:'card'},
      h('div',{className:'ins-row'},h('span',{className:'ins-lbl'},'Transactions loaded'),h('span',{className:'ins-val'},txnCount)),
      h('div',{className:'ins-row'},h('span',{className:'ins-lbl'},'Tags & settings'),h('span',{className:'ins-val',style:{color:'var(--grn)'}},'✓ Auto-saved to browser'))
    ),
    h('div',{className:'sh',style:{color:'var(--rose)'}},'Danger Zone'),
    h('button',{className:'btn btn-red',onClick:()=>{if(confirm('Clear all data, tags and settings?')){Object.values(LS).forEach(k=>localStorage.removeItem(k));window.location.reload()}}},
      '🗑 Clear all saved data')
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const[settings,setSettings]=useState(()=>lsGet(LS.SET,{salary:0,cashInHand:0,sbiSpent:0,salaryDate:''}));
  const[tagMap,setTagMap]=useState(()=>lsGet(LS.TAGS,{}));
  const[manual,setManual]=useState(()=>lsGet(LS.MAN,{debts:[],savings:[],lent:[],cashSpend:0}));
  const[rawTxns,setRawTxns]=useState(()=>lsGet(LS.RAW,[]));
  const[page,setPage]=useState(()=>lsGet(LS.RAW,[]).length>0?'overview':'upload');
  const[toastMsg,setToastMsg]=useState('');
  const toastRef=useRef();

  function toast(msg){setToastMsg(msg);if(toastRef.current)clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToastMsg(''),2400)}

  useEffect(()=>{lsSet(LS.SET,settings)},[settings]);
  useEffect(()=>{lsSet(LS.TAGS,tagMap)},[tagMap]);
  useEffect(()=>{lsSet(LS.MAN,manual)},[manual]);
  useEffect(()=>{lsSet(LS.RAW,rawTxns)},[rawTxns]);

  const autoDate=useMemo(()=>detectSalaryDate(rawTxns),[rawTxns]);

  const cutoff=useMemo(()=>{
    if(settings.salaryDate)return new Date(settings.salaryDate);
    if(autoDate){const[d,m,y]=autoDate.split('/');return new Date(+y,+m-1,+d)}
    return null;
  },[settings.salaryDate,autoDate]);

  const txns=useMemo(()=>
    rawTxns
      .filter(t=>!cutoff||parseDate(t.date)>=cutoff)
      .map(t=>({...t,tag:tagMap[t.ref]||(t.autoTag||'untagged')}))
  ,[rawTxns,tagMap,cutoff]);

  function handleLoad(html){
    const parsed=parseHTML(html);
    const existingRefs=new Set(rawTxns.map(t=>t.ref));
    const newOnes=parsed.filter(t=>!existingRefs.has(t.ref)).map(t=>({...t,autoTag:autoTag(t)}));
    const reTagged=rawTxns.map(t=>({...t,autoTag:autoTag(t)}));
    const merged=[...reTagged,...newOnes];
    setRawTxns(merged);
    setPage('overview');
    toast(merged.length+' total · '+newOnes.length+' new · tags kept ✓');
  }

  function handleTagChange(ref,tag){setTagMap(prev=>({...prev,[ref]:tag}))}

  const hasData=rawTxns.length>0;
  const untagCnt=txns.filter(t=>t.tag==='untagged').length;

  const NAV=[{id:'upload',label:'Upload'},{id:'overview',label:'Overview'},{id:'tag',label:untagCnt>0?`Tag ${untagCnt}`:'Tag'},{id:'insights',label:'Insights'},{id:'money',label:'Money'},{id:'settings',label:'Settings'}];

  function navIcon(id){
    if(id==='upload')   return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'17 8 12 3 7 8'}),h('line',{x1:12,y1:3,x2:12,y2:15}));
    if(id==='overview') return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:3,y:3,width:7,height:7,rx:1}),h('rect',{x:14,y:3,width:7,height:7,rx:1}),h('rect',{x:3,y:14,width:7,height:7,rx:1}),h('rect',{x:14,y:14,width:7,height:7,rx:1}));
    if(id==='tag')      return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z'}),h('line',{x1:7,y1:7,x2:7.01,y2:7}));
    if(id==='insights') return h('svg',{viewBox:'0 0 24 24'},h('polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'}));
    if(id==='money')    return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:2,y:5,width:20,height:14,rx:2}),h('line',{x1:2,y1:10,x2:22,y2:10}));
    if(id==='settings') return h('svg',{viewBox:'0 0 24 24'},h('circle',{cx:12,cy:12,r:3}),h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'}));
  }

  const needsData=['overview','tag','insights'].includes(page)&&!hasData;

  return h('div',null,
    page==='upload'   &&h(UploadPage,   {onLoad:handleLoad,hasSaved:hasData}),
    page==='overview' &&(needsData?null:h(OverviewPage, {txns,settings,manual})),
    page==='tag'      &&(needsData?null:h(TagPage,      {txns,onTagChange:handleTagChange})),
    page==='insights' &&(needsData?null:h(InsightsPage, {txns,settings,manual})),
    page==='money'    &&h(MoneyPage,    {manual,onManualChange:setManual}),
    page==='settings' &&h(SettingsPage, {settings,onSave:setSettings,txnCount:txns.length,autoDate,toast}),

    needsData&&h('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(240,236,255,.93)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,backdropFilter:'blur(6px)'}},
      h('div',{className:'card',style:{maxWidth:'280px',textAlign:'center',padding:'1.75rem',border:'2px solid var(--p4)'}},
        h('div',{style:{fontSize:'2.5rem',marginBottom:'.6rem'}},'📂'),
        h('div',{style:{fontWeight:900,fontSize:'1.1rem',marginBottom:'.4rem'}},'No transactions'),
        h('div',{style:{fontSize:'13px',color:'var(--m2)',marginBottom:'.85rem',lineHeight:1.5}},'Upload your YES Bank transaction HTML to get started.'),
        h('button',{className:'btn btn-pri',onClick:()=>setPage('upload')},'Go to Upload')
      )
    ),

    h('nav',{className:'nav'},
      NAV.map(n=>h('button',{key:n.id,className:`nb${page===n.id?' on':''}`,onClick:()=>setPage(n.id)},
        navIcon(n.id),
        h('span',{style:{fontSize:'10px',fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase'}},n.label),
        h('span',{className:'nb-pip'})
      ))
    ),
    h(Toast,{msg:toastMsg})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
