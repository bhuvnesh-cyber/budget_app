<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Spend Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  /* Warm off-white base — not generic gray */
  --bg:#F5F3EF;
  --s0:#FFFFFF;
  --s1:#F0EDE8;
  --s2:#E8E4DE;
  --bd:#DDD8D0;
  --bd2:#C8C2B8;
  --tx:#1C1917;
  --m1:#57534E;
  --m2:#A8A29E;

  /* Teal accent — distinctive, not blue-corp */
  --acc:#0D9488;
  --acc-lt:#F0FDFA;
  --acc-bd:#99F6E4;
  --acc-dk:#0F766E;

  --grn:#16A34A;--grn-lt:#F0FDF4;--grn-bd:#BBF7D0;
  --red:#DC2626;--red-lt:#FEF2F2;--red-bd:#FECACA;
  --amb:#D97706;--amb-lt:#FFFBEB;--amb-bd:#FDE68A;
  --pur:#7C3AED;--pur-lt:#F5F3FF;--pur-bd:#DDD6FE;
  --pnk:#DB2777;--pnk-lt:#FDF2F8;--pnk-bd:#FBCFE8;
  --sky:#0284C7;--sky-lt:#F0F9FF;--sky-bd:#BAE6FD;

  --mono:'JetBrains Mono',monospace;
  --sans:'Plus Jakarta Sans',sans-serif;
  --r:16px;--rs:10px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --sh:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shm:0 4px 20px rgba(13,148,136,.12),0 1px 4px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow-x:hidden;font-size:14px;line-height:1.5}
#root{display:flex;flex-direction:column;min-height:100%}

/* ── NAV ────────────────────────────────────────────────── */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:rgba(255,255,255,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);display:flex;align-items:stretch;z-index:100;padding-bottom:var(--safe-b);box-shadow:0 -2px 16px rgba(0,0,0,.05)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;color:var(--m2);font-family:var(--sans);font-size:.43rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;transition:color .15s;padding:0}
.nb.on{color:var(--acc)}
.nb svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;transition:stroke .15s}
.nb-bar{width:20px;height:2.5px;border-radius:99px;background:var(--acc);display:none;margin-top:1px}
.nb.on .nb-bar{display:block}

.page{flex:1;padding:.5rem 1rem calc(var(--nav-h) + var(--safe-b) + 1rem);max-width:520px;margin:0 auto;width:100%}

/* ── CARDS ────────────────────────────────────────────── */
.card{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:.5rem;box-shadow:var(--sh)}

/* ── PAGE HEADER ─────────────────────────────────────── */
.ph{padding:.7rem 0 .55rem;display:flex;align-items:baseline;justify-content:space-between}
.ph-title{font-size:1.15rem;font-weight:900;color:var(--tx);letter-spacing:-.025em}
.ph-sub{font-size:.58rem;color:var(--m2);font-family:var(--mono)}

/* ── SECTION HEAD ─────────────────────────────────────── */
.sh{font-size:.48rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:900;margin:1.15rem 0 .5rem;display:flex;align-items:center;gap:.5rem}
.sh::after{content:'';flex:1;height:1px;background:var(--bd)}

/* ── HERO ─────────────────────────────────────────────── */
.hero{border-radius:var(--r);padding:1.1rem;margin-bottom:.5rem;border:1px solid;position:relative;overflow:hidden}
.hero-lbl{font-size:.48rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.2rem;opacity:.75}
.hero-amt{font-family:var(--mono);font-size:2.1rem;font-weight:700;line-height:1;letter-spacing:-.035em;margin-bottom:.35rem}
.hero-sub{font-size:.6rem;font-family:var(--mono);opacity:.7}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.75rem;padding-top:.65rem;border-top:1px solid currentColor;opacity:.9}
.hg-lbl{font-size:.48rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:.18rem;font-weight:700}
.hg-val{font-family:var(--mono);font-weight:700;font-size:.82rem}
.hero-ok{background:linear-gradient(140deg,#F0FDFA,#CCFBF1);border-color:#99F6E4;color:#0F766E}
.hero-warn{background:linear-gradient(140deg,#FFFBEB,#FEF3C7);border-color:#FDE68A;color:#92400E}
.hero-bad{background:linear-gradient(140deg,#FEF2F2,#FEE2E2);border-color:#FECACA;color:#991B1B}

/* ── STAT CARDS ───────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.45rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-bottom:.45rem}
.sc{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:.7rem .85rem;box-shadow:var(--sh)}
.sc-lbl{font-size:.46rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--m2);margin-bottom:.28rem}
.sc-val{font-family:var(--mono);font-size:1.12rem;font-weight:700;line-height:1}
.sc-sub{font-size:.56rem;color:var(--m2);margin-top:.2rem;font-family:var(--mono)}
.sc-accent{border-top:2.5px solid}

/* ── HEAT COLORS ──────────────────────────────────────── */
/* Amount-based: teal→lime→amber→red */
.h0{color:#0D9488}.h1{color:#059669}.h2{color:#16A34A}.h3{color:#65A30D}
.h4{color:#CA8A04}.h5{color:#D97706}.h6{color:#EA580C}.h7{color:#DC2626}
.h8{color:#B91C1C}.h9{color:#991B1B}

/* ── BAR ──────────────────────────────────────────────── */
.bw{background:var(--s1);border-radius:99px;height:4px;margin-top:5px;overflow:hidden}
.bf{height:4px;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── NOTES ────────────────────────────────────────────── */
.note{display:flex;align-items:center;gap:7px;padding:.42rem .8rem;border-radius:var(--rs);font-size:.68rem;font-weight:700;margin-bottom:.45rem;border-left:3px solid}
.n-grn{background:var(--grn-lt);border-color:var(--grn);color:var(--grn)}
.n-teal{background:var(--acc-lt);border-color:var(--acc);color:var(--acc-dk)}
.n-amb{background:var(--amb-lt);border-color:var(--amb);color:#92400E}
.n-red{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.n-pur{background:var(--pur-lt);border-color:var(--pur);color:var(--pur)}

/* ── TAGS ─────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:.49rem;font-weight:800;letter-spacing:.04em;border:1px solid}
.tag-rent{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.tag-family{background:var(--pur-lt);border-color:var(--pur-bd);color:var(--pur)}
.tag-savings{background:var(--grn-lt);border-color:var(--grn-bd);color:var(--grn)}
.tag-vegetable{background:#F0FDF4;border-color:#BBF7D0;color:#15803D}
.tag-uber{background:var(--red-lt);border-color:var(--red-bd);color:var(--red)}
.tag-credit{background:var(--amb-lt);border-color:var(--amb-bd);color:#92400E}
.tag-sbi{background:var(--sky-lt);border-color:var(--sky-bd);color:var(--sky)}
.tag-entertainment{background:var(--pnk-lt);border-color:var(--pnk-bd);color:var(--pnk)}
.tag-other{background:var(--s1);border-color:var(--bd2);color:var(--m1)}
.tag-furniture{background:#FFF7ED;border-color:#FED7AA;color:#C2410C}
.tag-untagged{background:var(--s2);border-color:var(--bd2);color:var(--m2)}

/* ── INPUTS ───────────────────────────────────────────── */
input,select,textarea{width:100%;background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);border-radius:var(--rs);font-family:var(--sans);font-size:.8rem;font-weight:600;padding:.5rem .8rem;outline:none;transition:border-color .15s,box-shadow .15s;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(13,148,136,.12);background:var(--s0)}
input::placeholder{color:var(--m2)}
label{font-size:.55rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--m1);display:block;margin-bottom:4px}

/* ── BUTTONS ──────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:.6rem 1rem;border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--sans);font-weight:800;font-size:.78rem;transition:all .12s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-pri{background:linear-gradient(135deg,var(--acc-dk),var(--acc));color:#fff;box-shadow:0 3px 12px rgba(13,148,136,.3)}
.btn-sec{background:var(--s0);border:1.5px solid var(--bd);color:var(--m1)}
.btn-red{background:var(--red-lt);border:1px solid var(--red-bd);color:var(--red)}
.btn-sm{padding:.3rem .7rem;font-size:.65rem;width:auto}
.del-btn{background:none;border:none;color:var(--m2);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.8rem;transition:color .1s;flex-shrink:0}
.del-btn:hover{color:var(--red)}

/* ── UPLOAD ───────────────────────────────────────────── */
.upload-zone{border:2px dashed var(--bd2);border-radius:var(--r);padding:2rem 1rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--s0)}
.upload-zone.drag,.upload-zone:hover{border-color:var(--acc);background:var(--acc-lt)}
.upload-zone input{display:none}

/* ── TRANSACTIONS ─────────────────────────────────────── */
.txn-list{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:.5rem;box-shadow:var(--sh)}
.txn-row{display:flex;align-items:flex-start;gap:.5rem;padding:.58rem .85rem;border-bottom:1px solid var(--bd);transition:background .1s}
.txn-row:last-child{border-bottom:none}
.txn-row:hover{background:var(--s1)}
.txn-left{flex:1;min-width:0}
.txn-date{font-size:.52rem;color:var(--m2);font-family:var(--mono);margin-bottom:2px}
.txn-recv{font-size:.72rem;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amt{font-family:var(--mono);font-weight:700;font-size:.82rem}
.tag-sel{background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);border-radius:99px;font-family:var(--sans);font-size:.52rem;font-weight:700;padding:2px 8px;outline:none;cursor:pointer;width:auto}
.tag-sel:focus{border-color:var(--acc)}

/* ── WATERFALL ────────────────────────────────────────── */
.wf-row{display:flex;justify-content:space-between;align-items:center;padding:.42rem 0;border-bottom:1px solid var(--bd)}
.wf-row:last-child{border-bottom:none}
.wf-lbl{font-size:.7rem;color:var(--m1);font-weight:500}
.wf-val{font-family:var(--mono);font-weight:700;font-size:.73rem}

/* ── CATEGORY ROW ─────────────────────────────────────── */
.cat-row{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-icon{font-size:.95rem;width:26px;text-align:center;flex-shrink:0}
.cat-name{font-size:.73rem;font-weight:700}
.cat-count{font-size:.54rem;color:var(--m2);font-family:var(--mono)}
.cat-amt{font-family:var(--mono);font-weight:700;font-size:.82rem}

/* ── TAB BAR ──────────────────────────────────────────── */
.tab-bar{display:flex;background:var(--s1);border-radius:11px;padding:3px;margin-bottom:.7rem;gap:2px;border:1px solid var(--bd)}
.tab{flex:1;padding:.33rem .3rem;border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:.5rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--m2);background:transparent;transition:all .15s;white-space:nowrap}
.tab.on{color:var(--acc);background:var(--s0);box-shadow:var(--sh)}

/* ── INS ROW ─────────────────────────────────────────── */
.ins-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--bd)}
.ins-row:last-child{border-bottom:none}
.ins-lbl{font-size:.7rem;color:var(--m1);font-weight:500}
.ins-val{font-family:var(--mono);font-weight:700;font-size:.75rem}

/* ── EMPTY ────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;padding:2.2rem 1rem;text-align:center;gap:.45rem;background:var(--s0);border:1.5px dashed var(--bd2);border-radius:var(--r)}
.empty-icon{font-size:2.2rem}
.empty-title{font-size:.85rem;font-weight:800;color:var(--m1)}
.empty-body{font-size:.68rem;color:var(--m2);max-width:200px;line-height:1.5}

/* ── MONEY ITEM ───────────────────────────────────────── */
.money-item{display:flex;align-items:center;gap:.45rem;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.money-item:last-child{border-bottom:none}

/* ── TOAST ────────────────────────────────────────────── */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:.42rem 1.2rem;border-radius:99px;font-size:.68rem;font-weight:800;z-index:200;animation:fu .18s ease;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.18)}
@keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── WEEKEND CARD ─────────────────────────────────────── */
.weekend-card{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:.5rem;box-shadow:var(--sh)}
.weekend-head{display:flex;justify-content:space-between;align-items:center;padding:.6rem .85rem;background:linear-gradient(135deg,var(--pnk-lt),#FDF2F8);border-bottom:1px solid var(--pnk-bd)}
.weekend-day-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem .85rem;border-bottom:1px solid var(--bd)}
.weekend-day-row:last-child{border-bottom:none}

hr{border:none;border-top:1px solid var(--bd);margin:.6rem 0}
.row{display:flex;align-items:center;gap:.5rem}
.f1{flex:1}
.mb{margin-bottom:.5rem}

@media(max-width:380px){.g3{grid-template-columns:1fr 1fr}.ph-title{font-size:1rem}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {createElement:h,useState,useEffect,useCallback,useRef,useMemo}=React;

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const ALL_TAGS=['rent','family','savings','vegetable','uber','credit','sbi','entertainment','other','furniture','untagged'];
const TAG_META={
  rent:         {icon:'🏠', label:'Rent'},
  family:       {icon:'👨‍👩‍👧', label:'Family'},
  savings:      {icon:'💰', label:'Savings'},
  vegetable:    {icon:'🥦', label:'Vegetable'},
  uber:         {icon:'🚗', label:'Uber'},
  credit:       {icon:'💳', label:'YES Credit'},
  sbi:          {icon:'💳', label:'SBI Credit'},
  entertainment:{icon:'🎉', label:'Entertainment'},
  other:        {icon:'🧾', label:'Other spends'},
  furniture:    {icon:'🪑', label:'Furniture Rent'},
  untagged:     {icon:'❓', label:'Untagged'},
};

const LS_SETTINGS='sa_s_v3';
const LS_TAG_MAP='sa_tm_v3';
const LS_MANUAL='sa_mn_v3';

function loadLS(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

// ── HELPERS ────────────────────────────────────────────────────────────────
function fmt(n){return '₹'+Math.abs(Math.round(n)).toLocaleString('en-IN')}
function fmtK(n){return n>=1000?'₹'+(n/1000).toFixed(1)+'k':'₹'+Math.round(n)}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}

function parseDate(str){const[d,m,y]=str.split('/');return new Date(+y,+m-1,+d)}
function isWeekend(date){const d=date.getDay();return d===0||d===6}
function getWeekOfMonth(date){
  const first=new Date(date.getFullYear(),date.getMonth(),1);
  return Math.ceil((date.getDate()+first.getDay())/7);
}

const HEAT_T=[100,250,500,800,1200,2000,3500,5000,10000];
function heatCls(n){const i=HEAT_T.findIndex(t=>n<t);return 'h'+(i===-1?9:i)}
function heatHex(n){
  const c=['#0D9488','#059669','#16A34A','#65A30D','#CA8A04','#D97706','#EA580C','#DC2626','#B91C1C','#991B1B'];
  const i=HEAT_T.findIndex(t=>n<t);return c[i===-1?9:i];
}

// ── AUTO-TAGGER ────────────────────────────────────────────────────────────
function autoTag(txn){
  const recv=(txn.receiver||'').toUpperCase();
  const[hh,mm]=txn.time.split(':').map(Number);
  const mins=hh*60+mm;
  const date=parseDate(txn.date);
  const dow=date.getDay(); // 0=Sun,6=Sat
  const we=dow===0||dow===6;
  const wd=dow>=1&&dow<=5;
  const amt=txn.amount;

  // Named receivers — highest priority
  if(recv.includes('ANKA')) return 'rent';
  if(recv.includes('UMAR')) return 'family';
  if(recv.includes('UBEY')) return 'savings';
  if(recv.includes('MOJO')) return 'furniture';
  if(recv.includes('SWIGGY')||recv.includes('ZOMATO')) return 'other';
  if(recv.includes('AMZN')||recv.includes('AMAZON')) return 'other';

  // Sunday 17:30–19:00 → vegetable
  if(dow===0&&mins>=17*60+30&&mins<=19*60) return 'vegetable';

  // Weekday 08:50–09:40 or 18:10–19:30 → uber
  if(wd&&((mins>=8*60+50&&mins<=9*60+40)||(mins>=18*60+10&&mins<=19*60+30))) return 'uber';

  // Weekend (not vegetable time) → entertainment
  if(we) return 'entertainment';

  // Weekday: <500 → other, >=500 → untagged
  if(wd&&amt<500) return 'other';

  return 'untagged';
}

// ── PARSER ─────────────────────────────────────────────────────────────────
function parseHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const rows=doc.querySelectorAll('table tr');
  const txns=[];let first=true;
  rows.forEach(row=>{
    if(first){first=false;return}
    const cells=Array.from(row.querySelectorAll('td,th')).map(c=>c.innerText.trim());
    if(cells.length<11)return;
    const[date,time,bank,,sender,receiver,ref,,amount,drCr,status]=cells;
    if(!date||drCr!=='DR'||status!=='SUCCESS')return;
    txns.push({date,time,bank,sender,receiver,ref,amount:parseFloat(amount)||0});
  });
  const seen=new Set(),out=[];
  for(const t of txns){if(!seen.has(t.ref)){seen.add(t.ref);out.push(t)}}
  return out;
}

// ── SMALL COMPONENTS ───────────────────────────────────────────────────────
function Toast({msg}){if(!msg)return null;return h('div',{className:'toast'},msg)}
function Bar({spend,budget}){
  const p=budget?Math.min(100,spend/budget*100):0;
  return h('div',{className:'bw'},h('div',{className:'bf',style:{width:p+'%',background:heatHex(spend)}}));
}

// ── UPLOAD ─────────────────────────────────────────────────────────────────
function UploadPage({onLoad,hasData}){
  const[drag,setDrag]=useState(false);
  const ref=useRef();
  function handleFile(file){
    if(!file)return;
    const r=new FileReader();
    r.onload=e=>onLoad(e.target.result);
    r.readAsText(file);
  }
  return h('div',{className:'page'},
    h('div',{className:'ph'},
      h('div',{className:'ph-title'},'💸 Spend Tracker'),
      h('div',{className:'ph-sub'},'YES Bank UPI')
    ),
    hasData&&h('div',{className:'note n-grn'},'✓ Saved tags remembered — upload merges new transactions'),
    h('div',{
      className:`upload-zone${drag?' drag':''}`,
      onClick:()=>ref.current.click(),
      onDragOver:e=>{e.preventDefault();setDrag(true)},
      onDragLeave:()=>setDrag(false),
      onDrop:e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}
    },
      h('input',{ref,type:'file',accept:'.html,.htm',onChange:e=>handleFile(e.target.files[0])}),
      h('div',{style:{fontSize:'2.5rem',marginBottom:'.5rem'}},'📂'),
      h('div',{style:{fontSize:'.95rem',fontWeight:900,marginBottom:'.2rem'}},'Drop your transaction HTML'),
      h('div',{style:{fontSize:'.68rem',color:'var(--m2)',marginBottom:'.75rem'}},'From YES Bank UPI history export'),

  const today=new Date();
  const salary=settings.salary||0;

  // All manual outflows
  const debtPaid  =(manual.debts||[]).reduce((a,d)=>a+d.amount,0);
  const savingsPaid=(manual.savings||[]).reduce((a,s)=>a+s.amount,0);
  const lentOut   =(manual.lent||[]).reduce((a,l)=>a+l.amount,0);
  const cashSpend =manual.cashSpend||0;
  const manualTotal=debtPaid+savingsPaid+lentOut+cashSpend;

  const txnTotal=txns.reduce((a,t)=>a+t.amount,0);
  const grandTotal=txnTotal+manualTotal;
  const balance=salary-grandTotal;

  // Time left
  const lastDay=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const daysLeft=Math.max(1,lastDay-today.getDate());
  const weeksLeft=Math.max(1,Math.ceil(daysLeft/7));
  const safeDay=balance>0?balance/daysLeft:0;
  const safeWeek=balance>0?balance/weeksLeft:0;

  // Category totals
  const byTag={};
  ALL_TAGS.forEach(t=>{byTag[t]={total:0,count:0}});
  txns.forEach(t=>{

  const yesCC=byTag['credit']?.total||0;

  const untaggedCnt=byTag['untagged']?.count||0;

      h('div',{className:'hero-amt'},fmt(balance)),

        h('div',{style:{textAlign:'right'}},h('div',{className:'hg-lbl'},daysLeft+'d · '+weeksLeft+'w'),h('div',{className:'hg-val'},today.toLocaleDateString('en-IN',{day:'numeric',month:'short'})))

    h('div',{className:'g3'},
      h('div',{className:'sc'},
        h('div',{className:'sc-lbl'},'UPI Spent'),
        h('div',{className:`sc-val ${heatCls(txnTotal)}`},fmtK(txnTotal)),

// ── TAG PAGE ────────────────────────────────────────────────────────────────
function TagPage({txns,onTagChange}){
  const[tab,setTab]=useState('untagged');
  const[search,setSearch]=useState('');

  const byTag={};
  ALL_TAGS.forEach(t=>{byTag[t]=0});
  txns.forEach(t=>{byTag[t.tag]=(byTag[t.tag]||0)+1});
  const untaggedCnt=byTag['untagged']||0;

  const filtered=useMemo(()=>{
    let list=tab==='all'?txns:txns.filter(t=>t.tag===tab);
    if(search)list=list.filter(t=>t.receiver.toLowerCase().includes(search.toLowerCase())||t.date.includes(search));
    return [...list].sort((a,b)=>b.amount-a.amount);
  },[txns,tab,search]);

  const tabs=['untagged','all',...ALL_TAGS.filter(t=>t!=='untagged'&&byTag[t]>0)].slice(0,7);

  return h('div',{className:'page'},
    h('div',{className:'ph'},
      h('div',{className:'ph-title'},'Tag'),
      h('div',{className:'ph-sub'},untaggedCnt+' untagged')
    ),
    untaggedCnt===0
      ?h('div',{className:'note n-grn'},'✓ All transactions tagged!')
      :h('div',{className:'note n-amb'},'⚠ '+untaggedCnt+' transactions need a tag — these are weekday spends ≥ ₹500'),

    h('div',{className:'tab-bar'},
      tabs.map(t=>h('button',{key:t,className:`tab${tab===t?' on':''}`,onClick:()=>setTab(t)},
        t==='all'?'All':t==='untagged'?`❓ ${untaggedCnt}`:TAG_META[t]?.label||t
      ))
    ),

    h('input',{type:'text',placeholder:'Search receiver or date…',value:search,onChange:e=>setSearch(e.target.value),style:{marginBottom:'.5rem',fontSize:'.72rem'}}),

    filtered.length===0
      ?h('div',{className:'empty'},h('div',{className:'empty-icon'},'🎉'),h('div',{className:'empty-title'},tab==='untagged'?'All tagged!':'Nothing here'),h('div',{className:'empty-body'},'No transactions in this filter.'))
      :h('div',{className:'txn-list'},
        filtered.map(txn=>
          h('div',{key:txn.ref,className:'txn-row'},
            h('div',{className:'txn-left'},
              h('div',{className:'txn-date'},txn.date+' · '+txn.time),
              h('div',{className:'txn-recv'},txn.receiver.replace(/x{3,}/gi,'…')),
              h('div',{style:{marginTop:3}},
                h('select',{className:'tag-sel',value:txn.tag,onChange:e=>onTagChange(txn.ref,e.target.value)},
                  ALL_TAGS.map(t=>h('option',{key:t,value:t},TAG_META[t].icon+' '+TAG_META[t].label))
                )
              )
            ),
            h('div',{className:'txn-right'},
              h('div',{className:`txn-amt ${heatCls(txn.amount)}`},fmt(txn.amount))
            )
          )
        )
      )
  );
}

// ── INSIGHTS PAGE ────────────────────────────────────────────────────────────
function InsightsPage({txns,settings,manual}){
  if(!txns.length)return h('div',{className:'page'},h('div',{className:'empty',style:{marginTop:'2rem'}},h('div',{className:'empty-icon'},'📊'),h('div',{className:'empty-title'},'No data yet'),h('div',{className:'empty-body'},'Upload a transaction file first.')));

  const today=new Date();
  const salary=settings.salary||0;
  const debtPaid=(manual.debts||[]).reduce((a,d)=>a+d.amount,0);
  const savingsPaid=(manual.savings||[]).reduce((a,s)=>a+s.amount,0);
  const lentOut=(manual.lent||[]).reduce((a,l)=>a+l.amount,0);
  const cashSpend=manual.cashSpend||0;
  const grandTotal=txns.reduce((a,t)=>a+t.amount,0)+debtPaid+savingsPaid+lentOut+cashSpend;
  const balance=salary-grandTotal;
  const lastDay=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const daysLeft=Math.max(1,lastDay-today.getDate());
  const weeksLeft=Math.max(1,Math.ceil(daysLeft/7));

  // YES credit
  const yesCCTxns=txns.filter(t=>t.tag==='credit');
  const yesCC=yesCCTxns.reduce((a,t)=>a+t.amount,0);

  // Weekend grouping by date and week
  const weekendTxns=txns.filter(t=>isWeekend(parseDate(t.date)));
  const weekdayTxns=txns.filter(t=>!isWeekend(parseDate(t.date)));

  // By week of month, weekend days
  const weekendByWeek={};
  weekendTxns.forEach(t=>{
    const d=parseDate(t.date);
    const wk='W'+getWeekOfMonth(d);
    const dayKey=t.date;
    if(!weekendByWeek[wk])weekendByWeek[wk]={total:0,days:{}};
    weekendByWeek[wk].total+=t.amount;
    if(!weekendByWeek[wk].days[dayKey])weekendByWeek[wk].days[dayKey]={total:0,date:d,txns:[]};
    weekendByWeek[wk].days[dayKey].total+=t.amount;
    weekendByWeek[wk].days[dayKey].txns.push(t);
  });

  const weekendWeeks=Object.entries(weekendByWeek).sort((a,b)=>a[0].localeCompare(b[0]));
  const weekdayTotal=weekdayTxns.reduce((a,t)=>a+t.amount,0);
  const weekendTotal=weekendTxns.reduce((a,t)=>a+t.amount,0);

  // Avg per day/week
  const activeDays=new Set(txns.map(t=>t.date)).size||1;
  const txnTotal=txns.reduce((a,t)=>a+t.amount,0);
  const avgDay=txnTotal/activeDays;

  const weekSet=new Set();
  txns.forEach(t=>{const d=parseDate(t.date);weekSet.add(d.getFullYear()+'-'+d.getMonth()+'-W'+getWeekOfMonth(d))});
  const avgWeek=txnTotal/(weekSet.size||1);

  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  return h('div',{className:'page'},
    h('div',{className:'ph'},
      h('div',{className:'ph-title'},'Insights'),
      h('div',{className:'ph-sub'},'Spending patterns')
    ),

    // Key metrics
    salary>0&&h('div',{className:'card mb'},
      h('div',{className:'ins-row'},
        h('span',{className:'ins-lbl'},'📅 Left to spend (daily)'),
        h('span',{className:`ins-val`,style:{color:balance/daysLeft>500?'var(--grn)':'var(--amb)'}},fmt(balance>0?balance/daysLeft:0))
      ),
      h('div',{className:'ins-row'},
        h('span',{className:'ins-lbl'},'📅 Left to spend (weekly)'),
        h('span',{className:`ins-val`,style:{color:balance/weeksLeft>2000?'var(--grn)':'var(--amb)'}},fmt(balance>0?balance/weeksLeft:0))
      ),
      h('div',{className:'ins-row'},
        h('span',{className:'ins-lbl'},'📊 Avg per day (actual)'),
        h('span',{className:`ins-val ${heatCls(avgDay)}`},fmt(avgDay))
      ),
      h('div',{className:'ins-row'},
        h('span',{className:'ins-lbl'},'📊 Avg per week (actual)'),
        h('span',{className:`ins-val ${heatCls(avgWeek)}`},fmt(avgWeek))
      )
    ),

    // YES Credit
    h('div',{className:'sh'},'YES Credit Card'),
    yesCC===0
      ?h('div',{className:'note n-teal'},'No transactions tagged as YES Credit yet')
      :h('div',{className:'card'},
        h('div',{className:'ins-row'},
          h('span',{className:'ins-lbl'},'Total YES CC Spent'),
          h('span',{className:`ins-val ${heatCls(yesCC)}`,style:{fontSize:'.9rem',fontWeight:900}},fmt(yesCC))
        ),
        h('div',{className:'ins-row'},
          h('span',{className:'ins-lbl'},'Transactions'),
          h('span',{className:'ins-val'},yesCCTxns.length+' txns')
        ),
        h('div',{className:'ins-row'},
          h('span',{className:'ins-lbl'},'Avg per transaction'),
          h('span',{className:`ins-val ${heatCls(yesCC/yesCCTxns.length)}`},fmt(yesCC/(yesCCTxns.length||1)))
        )
      ),

    // Weekend spend by week
    h('div',{className:'sh'},'Weekend Spend'),
    h('div',{className:'g2',style:{marginBottom:'.5rem'}},
      h('div',{className:'sc sc-accent',style:{borderTopColor:'var(--pnk)'}},
        h('div',{className:'sc-lbl'},'☀ Weekend Total'),
        h('div',{className:`sc-val ${heatCls(weekendTotal)}`},fmtK(weekendTotal))
      ),
      h('div',{className:'sc sc-accent',style:{borderTopColor:'var(--acc)'}},
        h('div',{className:'sc-lbl'},'💼 Weekday Total'),
        h('div',{className:`sc-val ${heatCls(weekdayTotal)}`},fmtK(weekdayTotal))
      )
    ),

    weekendWeeks.length===0
      ?h('div',{className:'note n-teal'},'No weekend transactions found')
      :h('div',null,
        weekendWeeks.map(([wk,data])=>
          h('div',{key:wk,className:'weekend-card'},
            h('div',{className:'weekend-head'},
              h('span',{style:{fontWeight:900,fontSize:'.8rem',color:'var(--pnk)'}},'🎉 '+wk+' Weekend'),
              h('span',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:'.88rem',color:heatHex(data.total)}},fmt(data.total))
            ),
            Object.entries(data.days).sort((a,b)=>a[0].localeCompare(b[0])).map(([dateStr,dayData])=>
              h('div',{key:dateStr,className:'weekend-day-row'},
                h('div',null,
                  h('div',{style:{fontSize:'.72rem',fontWeight:700}},dayNames[dayData.date.getDay()]+' '+dateStr),
                  h('div',{style:{fontSize:'.58rem',color:'var(--m2)',fontFamily:'var(--mono)',marginTop:1}},dayData.txns.length+' transactions')
                ),
                h('span',{style:{fontFamily:'var(--mono)',fontWeight:700,color:heatHex(dayData.total)}},fmt(dayData.total))
              )
            )
          )
        )
      )
  );
}

// ── MONEY PAGE ───────────────────────────────────────────────────────────────
function MoneyPage({manual,onManualChange,toast}){
  const[tab,setTab]=useState('debts');

  function addItem(key){
    const list=manual[key]||[];
    onManualChange({...manual,[key]:[...list,{label:'',amount:0,id:Date.now()}]});
  }
  function updateItem(key,id,field,val){
    onManualChange({...manual,[key]:(manual[key]||[]).map(i=>i.id===id?{...i,[field]:val}:i)});
  }
  function removeItem(key,id){
    onManualChange({...manual,[key]:(manual[key]||[]).filter(i=>i.id!==id)});
  }

  const sections={
    debts:  {icon:'💳',color:'var(--red)',  label:'Debt Repayments', hint:'Credit card bills, loans, EMIs'},

  };

  const sec=sections[tab];
  const list=manual[tab]||[];
  const total=list.reduce((a,i)=>a+i.amount,0);
  const cashSpend=manual.cashSpend||0;

  return h('div',{className:'page'},
    h('div',{className:'ph'},h('div',{className:'ph-title'},'Money Flows'),h('div',{className:'ph-sub'},'All deducted from balance')),

    h('div',{className:'tab-bar'},
      ['debts','savings','lent','cash'].map(t=>
        h('button',{key:t,className:`tab${tab===t?' on':''}`,onClick:()=>setTab(t)},

    tab!=='cash'?h('div',null,
      h('div',{className:'note',style:{background:`${sec.color}12`,borderColor:sec.color,color:sec.color}},sec.icon+' '+sec.hint),

              ),
              h('button',{className:'del-btn',onClick:()=>removeItem(tab,item.id)},'✕')
            )
          ),
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:'.5rem',borderTop:'1px solid var(--bd)',marginTop:'.2rem'}},
            h('span',{style:{fontSize:'.65rem',fontWeight:700,color:'var(--m1)'}},'Total'),
            h('span',{style:{fontFamily:'var(--mono)',fontWeight:900,fontSize:'.9rem',color:sec.color}},fmt(total))
          )
        ),
      h('button',{className:'btn btn-sec btn-sm',style:{marginBottom:'.5rem'},onClick:()=>addItem(tab)},'+ Add')
    ):h('div',null,
      h('div',{className:'note n-amb'},'💵 Cash purchases not in your bank history'),
      h('div',{className:'card'},
        h('label',null,'Total cash spent'),
        h('input',{type:'number',inputMode:'numeric',value:cashSpend||'',placeholder:'0',onChange:e=>onManualChange({...manual,cashSpend:parseFloat(e.target.value)||0})}),
        cashSpend>0&&h('div',{style:{marginTop:'.4rem',fontSize:'.65rem',fontFamily:'var(--mono)',color:'var(--amb)',fontWeight:700}},'−'+fmt(cashSpend)+' deducted from balance')
      )
    )
  );
}

// ── SETTINGS PAGE ────────────────────────────────────────────────────────────
function SettingsPage({settings,onSettingsChange,txnCount,toast}){
  const[loc,setLoc]=useState({...settings});
  function save(){onSettingsChange(loc);toast('Settings saved ✓')}

  return h('div',{className:'page'},
    h('div',{className:'ph'},h('div',{className:'ph-title'},'Settings'),h('div',{className:'ph-sub'},txnCount+' transactions loaded')),

    h('div',{className:'sh'},'Salary'),
    h('div',{className:'card'},
      h('div',{className:'mb'},
        h('label',null,'Monthly salary'),
        h('input',{type:'number',inputMode:'numeric',value:loc.salary||'',placeholder:'e.g. 102844',onChange:e=>setLoc({...loc,salary:parseFloat(e.target.value)||0})})
      ),
      h('div',null,
        h('label',null,'Salary credited on'),
        h('input',{type:'date',value:loc.salaryDate||'',onChange:e=>setLoc({...loc,salaryDate:e.target.value})}),
        h('div',{style:{fontSize:'.58rem',color:'var(--m2)',marginTop:4}},'Only transactions from this date onwards are counted')
      )
    ),

    h('button',{className:'btn btn-pri',style:{marginTop:'.3rem',marginBottom:'.5rem'},onClick:save},'✓ Save Settings'),

    h('div',{className:'sh'},'Tag Logic'),
    h('div',{className:'card'},
      [
        ['ANKA receiver','→ Rent','rent'],
        ['UMAR receiver','→ Family','family'],
        ['UBEY receiver','→ Savings','savings'],
        ['MOJO receiver','→ Furniture Rent','furniture'],
        ['Sunday 5:30–7 PM','→ Vegetable','vegetable'],
        ['Weekday 8:50–9:40 AM / 6:10–7:30 PM','→ Uber','uber'],
        ['Weekend (other times)','→ Entertainment','entertainment'],
        ['Weekday < ₹500','→ Other spends','other'],
        ['Weekday ≥ ₹500','→ Untagged (you decide)','untagged'],
      ].map(([rule,tag,cls],i,arr)=>
        h('div',{key:i,style:{display:'flex',alignItems:'center',gap:'.5rem',padding:'.28rem 0',borderBottom:i<arr.length-1?'1px solid var(--bd)':'none'}},
          h('span',{style:{fontSize:'.67rem',color:'var(--m1)',flex:1}},rule),
          h('span',{className:`tag tag-${cls}`,style:{flexShrink:0}},tag)
        )
      )
    ),

    h('div',{className:'sh'},'Data'),
    h('div',{className:'card'},
      h('div',{className:'ins-row'},h('span',{className:'ins-lbl'},'Transactions loaded'),h('span',{className:'ins-val'},txnCount)),
      h('div',{className:'ins-row'},h('span',{className:'ins-lbl'},'Tags auto-saved'),h('span',{className:'ins-val',style:{color:'var(--grn)'}},'✓ In browser'))
    ),

    h('div',{className:'sh',style:{color:'var(--red)'}},'Danger'),
    h('button',{className:'btn btn-red',onClick:()=>{
      if(confirm('Clear all saved tags and settings?')){
        localStorage.removeItem(LS_SETTINGS);
        localStorage.removeItem(LS_TAG_MAP);
        localStorage.removeItem(LS_MANUAL);
        window.location.reload();
      }
    }},'🗑 Clear all saved data')
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const[settings,setSettings]=useState(()=>loadLS(LS_SETTINGS,{salary:0,salaryDate:''}));
  const[tagMap,setTagMap]=useState(()=>loadLS(LS_TAG_MAP,{}));
  const[manual,setManual]=useState(()=>loadLS(LS_MANUAL,{debts:[],savings:[],lent:[],cashSpend:0}));
  const[rawTxns,setRawTxns]=useState([]);
  const[page,setPage]=useState('upload');
  const[toastMsg,setToastMsg]=useState('');
  const toastRef=useRef();

  function showToast(msg){
    setToastMsg(msg);
    if(toastRef.current)clearTimeout(toastRef.current);
    toastRef.current=setTimeout(()=>setToastMsg(''),2400);
  }

  useEffect(()=>{saveLS(LS_SETTINGS,settings)},[settings]);
  useEffect(()=>{saveLS(LS_TAG_MAP,tagMap)},[tagMap]);
  useEffect(()=>{saveLS(LS_MANUAL,manual)},[manual]);

  const txns=useMemo(()=>
    rawTxns.map(t=>({...t,tag:tagMap[t.ref]||t.autoTag}))
  ,[rawTxns,tagMap]);

  function handleLoad(html){
    const parsed=parseHTML(html);
    const cutoff=settings.salaryDate?new Date(settings.salaryDate):null;
    const filtered=parsed
      .filter(t=>!cutoff||parseDate(t.date)>=cutoff)
      .map(t=>({...t,autoTag:autoTag(t)}));
    setRawTxns(filtered);
    setPage('overview');
    const newCount=filtered.filter(t=>!tagMap[t.ref]).length;
    showToast(`${filtered.length} transactions · ${newCount} new`);
  }

  function handleTagChange(ref,tag){setTagMap(prev=>({...prev,[ref]:tag}))}

  const hasData=txns.length>0;
  const untaggedCnt=txns.filter(t=>t.tag==='untagged').length;

  const navItems=[
    {id:'upload',  label:'Upload'},
    {id:'overview',label:'Overview'},
    {id:'tag',     label:untaggedCnt>0?`Tag ${untaggedCnt}`:'Tag'},
    {id:'insights',label:'Insights'},
    {id:'money',   label:'Money'},
    {id:'settings',label:'Settings'},
  ];

  function navIcon(id){
    if(id==='upload')   return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'17 8 12 3 7 8'}),h('line',{x1:12,y1:3,x2:12,y2:15}));
    if(id==='overview') return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:3,y:3,width:7,height:7,rx:1}),h('rect',{x:14,y:3,width:7,height:7,rx:1}),h('rect',{x:3,y:14,width:7,height:7,rx:1}),h('rect',{x:14,y:14,width:7,height:7,rx:1}));
    if(id==='tag')      return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z'}),h('line',{x1:7,y1:7,x2:7.01,y2:7}));
    if(id==='insights') return h('svg',{viewBox:'0 0 24 24'},h('polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'}));
    if(id==='money')    return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:2,y:5,width:20,height:14,rx:2}),h('line',{x1:2,y1:10,x2:22,y2:10}));
    if(id==='settings') return h('svg',{viewBox:'0 0 24 24'},h('circle',{cx:12,cy:12,r:3}),h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'}));
  }

  const needsData=['overview','tag','insights'].includes(page)&&!hasData;

  return h('div',null,
    page==='upload'   &&h(UploadPage,  {onLoad:handleLoad,hasData}),
    page==='overview' &&(needsData?null:h(OverviewPage, {txns,settings,manual})),
    page==='tag'      &&(needsData?null:h(TagPage,      {txns,onTagChange:handleTagChange})),
    page==='insights' &&(needsData?null:h(InsightsPage, {txns,settings,manual})),
    page==='money'    &&h(MoneyPage,   {manual,onManualChange:setManual,toast:showToast}),
    page==='settings' &&h(SettingsPage,{settings,onSettingsChange:setSettings,txnCount:txns.length,toast:showToast}),

    needsData&&h('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(245,243,239,.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,backdropFilter:'blur(4px)'}},
      h('div',{className:'card',style:{maxWidth:'260px',textAlign:'center',padding:'1.5rem'}},
        h('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'📂'),
        h('div',{style:{fontWeight:900,marginBottom:'.35rem'}},'No transactions'),
        h('div',{style:{fontSize:'.7rem',color:'var(--m2)',marginBottom:'.75rem'}},'Upload your YES Bank transaction HTML first.'),
        h('button',{className:'btn btn-pri',onClick:()=>setPage('upload')},'Go to Upload')
      )
    ),

    h('nav',{className:'nav'},
      navItems.map(n=>
        h('button',{key:n.id,className:`nb${page===n.id?' on':''}`,onClick:()=>setPage(n.id)},
          navIcon(n.id),
          h('span',{style:{fontSize:'.43rem',fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase'}},n.label),
          h('span',{className:'nb-bar'})
        )
      )
    ),
    h(Toast,{msg:toastMsg})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
