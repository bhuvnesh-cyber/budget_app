<script>
'use strict';
const{createElement:h,useState,useEffect,useMemo,useRef}=React;

/* ══════════════════════════ STORAGE ══════════════════════════ */
const SK='budget_tracker_v1';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

/* ══════════════════════════ PALETTE ══════════════════════════ */
const C={
  bg:'#EEF0FC', card:'#FFFFFF', card2:'#F2F1FE',
  border:'#DDDBF7', border2:'#C0BCEE',
  text:'#1D1B3A', text2:'#5F5B9C', text3:'#7B76AE',
  red:'#E11D48', redlt:'#FFF1F2',
  green:'#059669', greenlt:'#ECFDF5',
  orange:'#D97706', orangelt:'#FFFBEB',
  indigo:'#4F46E5', indigolt:'#E8E5FC', purple:'#7C3AED', purplelt:'#EEEAFE',
  grad:'linear-gradient(135deg, #4F46E5 0%, #9333EA 100%)',
  chrome:'linear-gradient(180deg, #FFFFFF 0%, #FAF9FF 100%)',
  nav:'#FFFFFF',
  shadow:'0 2px 12px rgba(79,70,229,.12)',
  shadow2:'0 4px 20px rgba(147,51,234,.16)',
  shadowSm:'0 1px 3px rgba(79,70,229,.06)',
};

/* ══════════════════════════ CATEGORY TREE ══════════════════════════ */
const CATEGORIES=[
  {id:'fixed',name:'Fixed Expenses',icon:'\uD83C\uDFE0',color:'#EF5350',subs:[
    {id:'rent',name:'Rent',icon:'\uD83C\uDFE0'},
    {id:'milk',name:'Milk',icon:'\uD83E\uDD5B'},
    {id:'electricity',name:'Electricity',icon:'\u26A1'},
    {id:'furniture',name:'Furniture Bill',icon:'\uD83E\uDE91'},
    {id:'wifi',name:'WiFi',icon:'\uD83D\uDCF6'},
    {id:'maid',name:'Maid',icon:'\uD83E\uDDF9'},
    {id:'garbage',name:'Garbage',icon:'\uD83D\uDDD1\uFE0F'},
    {id:'schoolfees',name:'School Fees',icon:'\uD83C\uDF93'},
  ]},
  {id:'savings',name:'Savings',icon:'\uD83D\uDCB0',color:'#66BB6A',subs:[
    {id:'mf',name:'Mutual Fund',icon:'\uD83D\uDCC8'},
    {id:'rd',name:'RD',icon:'\uD83C\uDFE6'},
  ]},
  {id:'variable',name:'Variable Expenses',icon:'\uD83D\uDED2',color:'#7E57C2',subs:[
    {id:'vegetable',name:'Vegetable',icon:'\uD83E\uDD66'},
    {id:'entertainment',name:'Entertainment',icon:'\uD83C\uDFAC'},
    {id:'amazon',name:'Amazon',icon:'\uD83D\uDCE6'},
    {id:'food',name:'Food',icon:'\uD83C\uDF5C'},
    {id:'uber',name:'Uber',icon:'\uD83D\uDE97'},
    {id:'grocery',name:'Grocery',icon:'\uD83D\uDECD\uFE0F'},
    {id:'misc',name:'Misc',icon:'\uD83E\uDDFE'},
  ]},
  {id:'debts',name:'Debts',icon:'\uD83E\uDCB3',color:'#8D6E63',subs:[
    {id:'familydebt',name:'Family Debts',icon:'\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC67'},
    {id:'personaldebt',name:'Personal Debts',icon:'\uD83E\uDDFE'},
  ]},
  {id:'support',name:'Support',icon:'\uD83E\uDD1D',color:'#EC407A',subs:[
    {id:'family',name:'Family',icon:'\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC66'},
  ]},
];
const ALL_SUBS=CATEGORIES.flatMap(c=>c.subs.map(s=>({...s,catId:c.id,catName:c.name,catColor:c.color})));
const getSub=id=>ALL_SUBS.find(s=>s.id===id)||{name:id,icon:'\uD83D\uDCB8',catColor:C.purple,catId:'',catName:''};
const getCat=id=>CATEGORIES.find(c=>c.id===id)||{name:id,icon:'\uD83D\uDCB8',color:C.purple};
function categoriesFor(){return CATEGORIES}
function allSubsFor(){return ALL_SUBS}
function getSubFor(id){return getSub(id)}

const SOURCES=[
  {id:'debit',name:'Debit Account',short:'Debit',color:'#4F46E5'},
  {id:'sbi',  name:'SBI Credit Card',short:'SBI',  color:'#2563EB'},
  {id:'yes',  name:'YES Credit Card',short:'YES',  color:'#D97706'},
];
const getSrc=id=>SOURCES.find(s=>s.id===id)||SOURCES[0];
// The subcategory ids used most recently across ALL months (not just the one
// you're browsing), most-recent-first with duplicates collapsed — powers the
// "Recently Used" quick-pick chips on Categorize.
function recentSubIds(data,limit,exclude){
  const ex=exclude||[];
  const all=[];
  Object.keys(data.months).forEach(ym=>{
    (data.months[ym].transactions||[]).forEach(t=>all.push(t));
  });
  all.sort((a,b)=>b.date.localeCompare(a.date)||(b.id>a.id?1:-1));
  const seen=[];
  for(const t of all){
    if(ex.includes(t.subId))continue;
    if(!seen.includes(t.subId))seen.push(t.subId);
    if(seen.length>=limit)break;
  }
  return seen;
}
// The most recent transaction logged last month for each Fixed Expenses
// subcategory (Rent, WiFi, Milk, etc) that hasn't already been logged THIS
// month — these are the recurring bills a "Repeat from Last Month" chip can
// one-tap prefill (category, subcategory, amount, and source).
function lastMonthFixedEntries(data,month,md){
  const prevMd=getMonth(data,prevM(month));
  const fixedIds=CATEGORIES.find(c=>c.id==='fixed').subs.map(s=>s.id);
  const latest={};
  prevMd.transactions.forEach(t=>{
    if(!fixedIds.includes(t.subId))return;
    if(!latest[t.subId]||t.date>latest[t.subId].date)latest[t.subId]=t;
  });
  return Object.values(latest).filter(t=>subSpent(md,t.subId)<=0);
}

/* ══════════════════════════ HELPERS ══════════════════════════ */
const fmt=n=>'\u20B9'+Math.round((parseFloat(n)||0)*100)/100;
const fmt2=n=>{const v=parseFloat(n)||0;return '\u20B9'+v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmtC=n=>{const v=Math.round(parseFloat(n)||0);return (v<0?'\u2212':'')+'\u20B9'+Math.abs(v).toLocaleString('en-IN')};
const today=()=>new Date().toISOString().slice(0,10);
const curYm=()=>today().slice(0,7);
const prevM=m=>monthFromIndex(monthIndex(m)-1);
const nextM=m=>monthFromIndex(monthIndex(m)+1);
const monthLabel=m=>{const[y,mo]=m.split('-');const N=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return N[+mo-1]+' '+y};
const monthLabelShort=m=>{const[y,mo]=m.split('-');const N=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return N[+mo-1]+"'"+y.slice(2)};
const monthIndex=m=>{const[y,mo]=m.split('-').map(Number);return y*12+(mo-1)};
const monthFromIndex=idx=>{const y=Math.floor(idx/12),mo=(idx%12+12)%12+1;return y+'-'+String(mo).padStart(2,'0')};
const genId=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function zeroBudgets(){const b={};ALL_SUBS.forEach(s=>b[s.id]=0);return b}
function defaultMonth(){return{income:{salary:0,other:0,extras:[]},uncategorized:{debit:0,sbi:0,yes:0},budgets:{},transactions:[],balances:null,lastCalc:null,balanceLog:[]}}
function defaultData(){
  return{budgetNotes:{},cardLimits:{sbi:0,yes:0},cardInputMode:'remaining',months:{}};
}
// Reads a month's data, normalizing legacy shapes (uncategorized used to be a
// single number; it's now split per payment source; budgets used to be one
// global object shared by every month — now each month has its own, and any
// month without explicit data (past or future) simply starts at ₹0 for
// everything: income, every category, every subcategory).
function getMonth(data,ym){
  const md=data.months[ym];
  if(!md)return defaultMonth();
  let unc=md.uncategorized;
  if(typeof unc==='number')unc={debit:unc,sbi:0,yes:0};
  if(!unc)unc={debit:0,sbi:0,yes:0};
  return{...md,uncategorized:{debit:+unc.debit||0,sbi:+unc.sbi||0,yes:+unc.yes||0},budgets:md.budgets||{},
    balances:md.balances||null,lastCalc:md.lastCalc||null,balanceLog:md.balanceLog||[]};
}
// Returns a working clone of months[ym] (creating it from data if it doesn't
// exist yet in the working copy), inserts it into `months`, and returns the
// SAME object reference so callers can mutate its fields directly and have
// that reflected in `months` without re-assigning.
function cloneMonthEntry(data,months,ym){
  const existing=months[ym]||getMonth(data,ym);
  const clone={income:existing.income,uncategorized:{...existing.uncategorized},budgets:{...existing.budgets},transactions:[...existing.transactions],
    balances:existing.balances?{...existing.balances}:null,lastCalc:existing.lastCalc?{...existing.lastCalc}:null,balanceLog:[...(existing.balanceLog||[])]};
  months[ym]=clone;
  return clone;
}
function uncategorizedTotal(md){return(+md.uncategorized.debit||0)+(+md.uncategorized.sbi||0)+(+md.uncategorized.yes||0)}
function monthIncome(md){return (+md.income.salary||0)+(+md.income.other||0)+md.income.extras.reduce((s,e)=>s+(+e.amount||0),0)}
function subBudget(md,subId){return +md.budgets[subId]||0}
function catBudgetSum(md,catId){const cat=categoriesFor().find(c=>c.id===catId);return cat?cat.subs.reduce((s,sub)=>s+subBudget(md,sub.id),0):0}
function totalBudget(md){return allSubsFor().reduce((s,sub)=>s+subBudget(md,sub.id),0)}
function subSpent(md,subId){return md.transactions.filter(t=>t.subId===subId).reduce((s,t)=>s+t.amount,0)}
function catSpent(md,catId){return md.transactions.filter(t=>t.catId===catId).reduce((s,t)=>s+t.amount,0)}
function totalSpent(md){return md.transactions.reduce((s,t)=>s+t.amount,0)}
// True total money that has left the accounts this month: categorized
// transactions PLUS whatever is still sitting in the uncategorized buckets
// (that money has already been spent in real life, just not sorted yet).
function totalSpentAll(md){return totalSpent(md)+uncategorizedTotal(md)}
function statusFor(spent,budget){
  if(budget<=0)return spent>0?{label:'Over Budget',color:C.red,bg:C.redlt}:{label:'No Budget',color:C.text3,bg:C.card2};
  const pct=spent/budget*100;
  if(pct>100)return{label:'Over Budget',color:C.red,bg:C.redlt};
  if(pct>=80)return{label:'Near Budget',color:C.orange,bg:C.orangelt};
  return{label:'Under Budget',color:C.green,bg:C.greenlt};
}
// One place that decides how "money still available" is worded, so the total,
// each category, and each subcategory all read the same way.
function leftLabel(left){return left>=0?fmtC(left)+' left':fmtC(-left)+' over'}
function leftColor(left){return left>=0?C.green:C.red}
// How many days of the month are still ahead of you: the whole month for a
// future month, none for a month that's already finished, and today through
// month-end (today included) for the month you're actually living in.
const daysInMonth=ym=>{const[y,mo]=ym.split('-').map(Number);return new Date(y,mo,0).getDate()};
function daysLeftIn(ym){
  const total=daysInMonth(ym);
  if(ym>curYm())return total;
  if(ym<curYm())return 0;
  return Math.max(0,total-Number(today().slice(8,10))+1);
}
// Sundays (day-of-month numbers) that fall in the given month — this count is
// the number of weeks a variable-expense budget gets split across.
function sundaysInMonth(ym){
  const[y,mo]=ym.split('-').map(Number);
  const total=daysInMonth(ym);
  const out=[];
  for(let d=1;d<=total;d++){if(new Date(y,mo-1,d).getDay()===0)out.push(d)}
  return out;
}
// Splits the month into weeks that each END on a Sunday — Week 1 runs from
// day 1 through the first Sunday, Week 2 from the day after through the next
// Sunday, and so on. Any trailing days after the final Sunday are folded into
// the last week, so every day of the month belongs to exactly one week and
// the week count always matches the number of Sundays.
function weekRangesForMonth(ym){
  const total=daysInMonth(ym);
  const sundays=sundaysInMonth(ym);
  if(sundays.length===0)return[{week:1,start:1,end:total}];
  const ranges=[];
  let prevEnd=0;
  sundays.forEach((s,i)=>{ranges.push({week:i+1,start:prevEnd+1,end:s});prevEnd=s});
  if(prevEnd<total)ranges[ranges.length-1].end=total;
  return ranges;
}

/* ══════════════════════════ SMALL UI ══════════════════════════ */
function MonthBar({month,setMonth}){
  const isToday=month===curYm();
  const curIdx=monthIndex(curYm());
  const selIdx=monthIndex(month);
  const lo=Math.min(curIdx-5,selIdx-2);
  const hi=Math.max(curIdx+1,selIdx+2);
  const tabs=[];for(let i=lo;i<=hi;i++)tabs.push(monthFromIndex(i));
  const selRef=useRef(null);
  useEffect(()=>{selRef.current&&selRef.current.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})},[month]);

  return h('div',{style:{background:C.chrome,borderBottom:`1px solid ${C.border}`,boxShadow:C.shadow}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px 8px'}},
      h('button',{onClick:()=>setMonth(m=>prevM(m)),style:{background:C.card2,border:`1px solid ${C.border2}`,color:C.indigo,fontSize:20,cursor:'pointer',padding:'8px 18px',borderRadius:12,fontWeight:700}},'\u2039'),
      h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2}},
        h('span',{style:{color:C.text,fontWeight:800,fontSize:17}},monthLabel(month)),
        !isToday&&h('button',{onClick:()=>setMonth(curYm()),style:{border:'none',background:'none',color:C.indigo,fontSize:11,fontWeight:700,cursor:'pointer',padding:'2px 8px',textDecoration:'underline'}},'Jump to This Month')
      ),
      h('button',{onClick:()=>setMonth(m=>nextM(m)),style:{background:C.card2,border:`1px solid ${C.border2}`,color:C.indigo,fontSize:20,cursor:'pointer',padding:'8px 18px',borderRadius:12,fontWeight:700}},'\u203A')
    ),
    h('div',{style:{display:'flex',gap:6,overflowX:'auto',padding:'0 12px 12px'}},
      tabs.map(t=>{
        const sel=t===month;
        return h('button',{key:t,ref:sel?selRef:null,onClick:()=>setMonth(t),
          style:{flexShrink:0,padding:'7px 12px',borderRadius:99,border:sel?'none':`1.5px solid ${C.border}`,
            background:sel?C.grad:(t===curYm()?C.indigolt:C.card2),
            color:sel?'#fff':(t===curYm()?C.indigo:C.text2),
            fontWeight:sel?800:600,fontSize:12.5,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
          monthLabelShort(t));
      })
    )
  );
}
function Bar({pct,color}){
  const w=Math.max(0,Math.min(100,pct));
  return h('div',{style:{width:'100%',height:8,background:C.card2,borderRadius:99,overflow:'hidden'}},
    h('div',{style:{width:w+'%',height:'100%',background:color,borderRadius:99,transition:'width .3s'}})
  );
}
function Sheet({onClose,children}){
  return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:200,display:'flex',alignItems:'flex-end'},
    onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    h('div',{style:{width:'100%',maxHeight:'95dvh',overflowY:'auto'}},children)
  );
}
function SectionTitle({children}){
  return h('div',{style:{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:C.text3,margin:'20px 16px 9px',paddingTop:14,borderTop:`1px solid ${C.border}`}},children);
}
// Formats a raw numeric string with Indian comma grouping (e.g. "12000" ->
// "12,000") for DISPLAY only — the underlying value stays a plain number
// string so every existing +value cast keeps working unchanged.
function fmtInputIN(v){
  if(v===''||v===null||v===undefined)return '';
  const n=parseFloat(v);
  if(isNaN(n))return v;
  return n.toLocaleString('en-IN',{maximumFractionDigits:2});
}
// Amount input that shows comma-grouped digits when idle (₹12,000) but
// switches to the raw editable string the instant you tap in, so typing
// never fights a cursor jump caused by punctuation being inserted mid-edit.
function NumField({value,onChange,placeholder}){
  const[focused,setFocused]=useState(false);
  const display=focused?value:fmtInputIN(value);
  return h('input',{type:'text',inputMode:'decimal',value:display,
    onFocus:()=>setFocused(true),
    onBlur:()=>setFocused(false),
    onChange:e=>{
      let raw=e.target.value.replace(/[^0-9.]/g,'');
      const parts=raw.split('.');
      if(parts.length>2)raw=parts[0]+'.'+parts.slice(1).join('');
      onChange(raw);
    },
    placeholder:placeholder||'0',
    style:{width:'100%',padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,fontSize:15,fontFamily:'monospace',fontWeight:700,color:C.text,background:C.card2,outline:'none'}});
}
// Wraps a transaction row so dragging it left reveals a Delete action —
// the standard mobile swipe-to-delete pattern. Uses Pointer Events (covers
// touch AND mouse, so it also works while previewing on desktop). A small
// movement threshold means normal taps on the Edit button inside still work
// fine — we only "steal" the gesture once it's clearly a horizontal drag,
// and bail out immediately if the drag turns out to be a vertical scroll.
function SwipeRow({onDelete,children}){
  const[dx,setDx]=useState(0);
  const drag=useRef({active:false,swiping:false,startX:0,startY:0,startDx:0});
  function onDown(e){
    drag.current={active:true,swiping:false,startX:e.clientX,startY:e.clientY,startDx:dx};
  }
  function onMove(e){
    const d=drag.current;
    if(!d.active)return;
    const deltaX=e.clientX-d.startX, deltaY=e.clientY-d.startY;
    if(!d.swiping){
      if(Math.abs(deltaX)>10&&Math.abs(deltaX)>Math.abs(deltaY)*1.3){d.swiping=true}
      else if(Math.abs(deltaY)>10){d.active=false;return}
      else return;
    }
    setDx(Math.max(-160,Math.min(0,d.startDx+deltaX)));
  }
  function onUp(){
    const d=drag.current;
    if(!d.active){return}
    const wasSwiping=d.swiping;
    d.active=false;d.swiping=false;
    if(!wasSwiping)return;
    setDx(cur=>{
      if(cur<-120){onDelete();return 0}
      if(cur<-40)return -84;
      return 0;
    });
  }
  return h('div',{style:{position:'relative',overflow:'hidden'}},
    h('div',{style:{position:'absolute',inset:0,display:'flex',justifyContent:'flex-end'}},
      h('button',{onClick:onDelete,
        style:{width:84,border:'none',background:C.red,color:'#fff',fontWeight:700,fontSize:10.5,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3}},
        h('span',{style:{fontSize:16}},'\uD83D\uDDD1\uFE0F'),'Delete')
    ),
    h('div',{onPointerDown:onDown,onPointerMove:onMove,onPointerUp:onUp,onPointerLeave:onUp,
      style:{position:'relative',background:C.card,transform:`translateX(${dx}px)`,transition:drag.current.swiping?'none':'transform .25s',touchAction:'pan-y'}},
      children)
  );
}

/* ══════════════════════════ SAVE & BACKUP ══════════════════════════ */
// Everything still saves to browser storage instantly, exactly as before —
// that's the working copy. This section adds a real FILE you own: the bar at
// the top says whether that file matches your data, Save writes a fresh one
// to Downloads, and Import reads one back in after a wipe or a new phone.
const SAVE_HASH_KEY='bt_v1_saved_hash';
const SAVE_COUNT_KEY='bt_v1_edit_count';
const BACKUP_VERSION=1;

// Short fingerprint of the data, so "matches your last saved file" can be
// checked without keeping a second full copy of everything in storage.
function hashStr(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)}

function downloadJSON(filename,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},1000);
}

// ym omitted = every month in one file; ym given = that single month.
function makeBackup(data,ym){
  const payload=ym?{...data,months:{[ym]:getMonth(data,ym)}}:data;
  return{app:'budget-tracker',version:BACKUP_VERSION,exportedAt:new Date().toISOString(),scope:ym||'all',data:payload};
}

// Accepts a wrapped backup or a bare data object, so an older hand-saved file
// still imports. Months present in the file replace what's here; months absent
// from the file are left exactly as they are.
function mergeBackup(parsed,cur){
  const inc=parsed&&parsed.data&&parsed.data.months?parsed.data:(parsed&&parsed.months?parsed:null);
  if(!inc)throw new Error('This file is not a Budget Tracker backup.');
  const months={...cur.months};
  Object.keys(inc.months||{}).forEach(k=>{months[k]=inc.months[k]});
  return{
    merged:{
      budgetNotes:{...(cur.budgetNotes||{}),...(inc.budgetNotes||{})},
      cardLimits:{...(cur.cardLimits||{}),...(inc.cardLimits||{})},
      cardInputMode:inc.cardInputMode||cur.cardInputMode||'remaining',
      months
    },
    count:Object.keys(inc.months||{}).length
  };
}

function SaveBar({data,setData,month}){
  const json=useMemo(()=>JSON.stringify(data),[data]);
  const hash=useMemo(()=>hashStr(json),[json]);
  const[savedHash,setSavedHash]=useState(()=>lsGet(SAVE_HASH_KEY,null));
  const[edits,setEdits]=useState(()=>lsGet(SAVE_COUNT_KEY,0));
  const[open,setOpen]=useState(false);
  const[nudge,setNudge]=useState(false);
  const[toast,setToast]=useState(null);

  const dirty=savedHash!==hash;
  const fileRef=useRef(null);
  const prevHash=useRef(hash);
  const prevMonth=useRef(month);

  // Count each distinct change to the data, and keep the count across reloads
  // so "3 edits since your last save" survives closing the app.
  useEffect(()=>{
    if(prevHash.current===hash)return;
    prevHash.current=hash;
    setEdits(e=>{const n=e+1;lsSave(SAVE_COUNT_KEY,n);return n});
  },[hash]);

  // Switching months is where unsaved work tends to get forgotten, so the bar
  // turns red for a few seconds instead of silently staying amber.
  useEffect(()=>{
    if(prevMonth.current===month)return;
    prevMonth.current=month;
    if(!dirty)return;
    setNudge(true);
    const t=setTimeout(()=>setNudge(false),3000);
    return()=>clearTimeout(t);
  },[month,dirty]);

  useEffect(()=>{
    if(!dirty)return;
    const warn=e=>{e.preventDefault();e.returnValue=''};
    window.addEventListener('beforeunload',warn);
    return()=>window.removeEventListener('beforeunload',warn);
  },[dirty]);

  const flash=msg=>{setToast(msg);setTimeout(()=>setToast(null),2600)};

  function save(ym){
    try{
      const name=ym?'budget-'+ym+'.json':'budget-backup-'+today()+'.json';
      downloadJSON(name,makeBackup(data,ym));
      setOpen(false);
      if(ym){
        // A single-month file isn't a full backup, so it doesn't clear the
        // unsaved marker — only "save all" does that.
        flash('Saved '+monthLabel(ym)+' to Downloads');
      }else{
        lsSave(SAVE_HASH_KEY,hash);setSavedHash(hash);
        setEdits(0);lsSave(SAVE_COUNT_KEY,0);
        flash('Saved to Downloads');
      }
    }catch(err){
      flash('Couldn\u2019t save \u2014 check your browser\u2019s download permission');
    }
  }

  function importFile(e){
    const file=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const{merged,count}=mergeBackup(JSON.parse(reader.result),data);
        const ok=confirm('Import '+count+' month'+(count===1?'':'s')+' from this file?\n\nMonths in the file replace what you have now. Other months stay as they are.');
        if(!ok)return;
        setData(merged);
        setOpen(false);
        flash('Imported '+count+' month'+(count===1?'':'s'));
      }catch(err){
        flash(err.message||'Couldn\u2019t read that file');
      }
    };
    reader.onerror=()=>flash('Couldn\u2019t read that file');
    reader.readAsText(file);
  }

  const tone=dirty?(nudge?C.red:C.orange):C.green;
  const toneBg=dirty?(nudge?C.redlt:C.orangelt):C.greenlt;
  const status=!dirty?'Saved':(edits===0?'Not saved yet':'Unsaved \u00B7 '+edits+' edit'+(edits===1?'':'s'));

  const btn=(label,onClick,primary)=>h('button',{onClick,
    style:{padding:'7px 14px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontSize:12.5,fontWeight:800,whiteSpace:'nowrap',
      border:primary?'none':`1.5px solid ${C.border2}`,background:primary?C.grad:C.card2,color:primary?'#fff':C.text2}},label);

  return h('div',{style:{position:'relative',zIndex:60,flexShrink:0}},
    h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'9px 16px',background:C.chrome,borderBottom:`1px solid ${C.border}`,boxShadow:C.shadow}},
      h('span',{style:{width:9,height:9,borderRadius:99,background:tone,flexShrink:0,boxShadow:`0 0 0 4px ${toneBg}`}}),
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{style:{fontSize:12.5,fontWeight:800,color:tone}},status),
        h('div',{style:{fontSize:10.5,fontWeight:600,color:C.text3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
          nudge?'Save before you move on':(dirty?'Your backup file is behind':'Backup file is up to date'))
      ),
      dirty&&btn('Save',()=>save(null),true),
      btn(open?'\u00D7':'\u00B7\u00B7\u00B7',()=>setOpen(o=>!o),false)
    ),
    open&&h('div',{style:{display:'flex',flexDirection:'column',gap:8,padding:'12px 16px',background:C.card2,borderBottom:`1px solid ${C.border}`}},
      btn('Save '+monthLabel(month)+' only',()=>save(month),false),
      !dirty&&btn('Save all months again',()=>save(null),false),
      btn('Import a backup file\u2026',()=>fileRef.current&&fileRef.current.click(),false),
      h('div',{style:{fontSize:10.5,color:C.text3,fontWeight:600,lineHeight:1.5}},
        'Files go to your Downloads folder. Keep them somewhere that backs up \u2014 Drive, Files, or your computer.')
    ),
    h('input',{ref:fileRef,type:'file',accept:'application/json,.json',onChange:importFile,style:{display:'none'}}),
    toast&&h('div',{style:{position:'fixed',left:16,right:16,bottom:100,zIndex:300,padding:'12px 16px',borderRadius:14,
      background:C.text,color:'#fff',fontSize:12.5,fontWeight:700,textAlign:'center',boxShadow:C.shadow2}},toast)
  );
}

/* ══════════════════════════ WEEKLY INSIGHT (Variable Expenses only) ══════════════════════════ */
// For each Variable Expenses subcategory that has a budget or spend, splits
// its monthly budget evenly across the Sundays in the month (e.g. a ₹2800
// budget over 4 Sundays = ₹700/week) and shows actual spend against that
// per-week figure as a compact row of color-coded chips. Weeks run
// Sun-ending: W1 = day 1 through the first Sunday, etc, with any trailing
// days folded into the last week.
function WeeklyInsights({data,md,month,onQuickCategorize}){
  const cat=CATEGORIES.find(c=>c.id==='variable');
  const weekRanges=weekRangesForMonth(month);
  const numWeeks=weekRanges.length;

  const rows=cat.subs.map(sub=>{
    const budget=subBudget(md,sub.id);
    const spent=subSpent(md,sub.id);
    if(budget<=0&&spent<=0)return null;
    const weeklyBudget=numWeeks?budget/numWeeks:0;
    const weeks=weekRanges.map(r=>{
      const wSpent=md.transactions
        .filter(t=>t.subId===sub.id)
        .filter(t=>{const day=+t.date.slice(8,10);return day>=r.start&&day<=r.end})
        .reduce((s,t)=>s+t.amount,0);
      return{...r,spent:wSpent,budget:weeklyBudget,status:statusFor(wSpent,weeklyBudget)};
    });
    return{sub,budget,spent,weeklyBudget,weeks};
  }).filter(Boolean);

  if(rows.length===0)return null;

  return h(React.Fragment,null,
    h(SectionTitle,null,'Weekly Insight \u2014 Variable Expenses'),
    h('div',{style:{padding:'0 16px',display:'flex',flexDirection:'column',gap:10}},
      rows.map(r=>h('div',{key:r.sub.id,onClick:()=>onQuickCategorize&&onQuickCategorize(r.sub.id),style:{background:C.card,borderRadius:14,padding:'10px 12px',boxShadow:C.shadowSm,border:`1px solid ${C.border}`,cursor:onQuickCategorize?'pointer':undefined}},
        h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
          h('div',{style:{width:26,height:26,borderRadius:8,background:cat.color+'18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.95rem',flexShrink:0}},r.sub.icon),
          h('span',{style:{fontSize:12.5,fontWeight:700,color:C.text,flex:1}},r.sub.name),
          r.budget>0
            ?h('span',{style:{fontSize:10.5,color:C.text3,fontWeight:700,fontFamily:'monospace'}},fmtC(r.weeklyBudget)+'/wk')
            :h('span',{style:{fontSize:10,color:C.text3,fontWeight:700}},'no budget')
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:`repeat(${r.weeks.length},1fr)`,gap:5}},
          r.weeks.map(w=>h('div',{key:w.week,title:fmtC(w.spent)+(r.budget>0?' of '+fmtC(w.budget):''),
            style:{textAlign:'center',padding:'6px 2px 7px',borderRadius:9,background:w.status.bg,border:`1px solid ${w.status.color}22`}},
            h('div',{style:{fontSize:9,fontWeight:800,color:w.status.color,opacity:.75,letterSpacing:'.03em'}},'W'+w.week),
            h('div',{style:{fontSize:11.5,fontWeight:800,fontFamily:'monospace',color:w.status.color,lineHeight:1.35,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},
              w.spent>0?fmtC(w.spent).replace('\u20B9',''):'\u2013')
          ))
        )
      ))
    )
  );
}

/* ══════════════════════════ DASHBOARD ══════════════════════════ */
function Dashboard({data,month,setMonth,setPage,onQuickCategorize}){
  const md=getMonth(data,month);
  const income=monthIncome(md);
  const catSpentOnly=totalSpent(md); // what you've actually categorized as an expense
  const uncatTotal=uncategorizedTotal(md); // money spent but not yet sorted into a category
  const totalReal=catSpentOnly+uncatTotal; // true total that's left your accounts this month
  const savings=catSpent(md,'savings');
  const remaining=income-totalReal;
  const overspent=totalReal>income?totalReal-income:0;
  const budgetTot=totalBudget(md);
  const budgetLeft=budgetTot-catSpentOnly; // budget still available across all categories
  const budgetPct=budgetTot?catSpentOnly/budgetTot*100:0;
  const[watchFilter,setWatchFilter]=useState('all'); // all | over | near | under

  // Every category that has a budget or some spending, with its own budget,
  // spend, and what's left of it.
  const catRows=categoriesFor(data).map(c=>{
    const sp=catSpent(md,c.id),bd=catBudgetSum(md,c.id);
    return{id:c.id,name:c.name,icon:c.icon,color:c.color,v:sp,budget:bd,left:bd-sp};
  }).filter(r=>r.v>0||r.budget>0).sort((a,b)=>b.v-a.v);
  const catTotal=catRows.reduce((s,c)=>s+c.v,0);

  // Pace the Variable Expenses budget across the rest of the month: what's
  // left, spread over the days that are actually still ahead of you.
  const varBudget=catBudgetSum(md,'variable');
  const varSpent=catSpent(md,'variable');
  const varLeft=varBudget-varSpent;
  const daysLeft=daysLeftIn(month);
  const weeksLeft=daysLeft/7;
  const safeDay=daysLeft>0?Math.max(0,varLeft)/daysLeft:0;
  // With under a week to go, a full week's pace would overstate what's there,
  // so the weekly figure never promises more than the money that remains.
  const safeWeek=Math.min(Math.max(0,varLeft),safeDay*7);

  const srcSegs=SOURCES.map(s=>({v:md.transactions.filter(t=>t.source===s.id).reduce((a,t)=>a+t.amount,0),color:s.color,name:s.short}));

  // Every subcategory with a budget or spend, with full status info
  const allRows=allSubsFor(data).map(s=>{
    const b=subBudget(md,s.id),sp=subSpent(md,s.id);
    return{...s,budget:b,spent:sp,left:b-sp,status:statusFor(sp,b),pct:b?sp/b*100:(sp>0?101:0)};
  }).filter(r=>r.budget>0||r.spent>0)
    .sort((a,b)=>b.pct-a.pct);
  const overCount=allRows.filter(r=>r.status.label==='Over Budget').length;
  const nearCount=allRows.filter(r=>r.status.label==='Near Budget').length;
  const underCount=allRows.filter(r=>r.status.label==='Under Budget').length;
  const watchRows=allRows.filter(r=>
    watchFilter==='all'?true:
    watchFilter==='over'?r.status.label==='Over Budget':
    watchFilter==='near'?r.status.label==='Near Budget':
    r.status.label==='Under Budget'
  );

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h(MonthBar,{month,setMonth}),
    overspent>0.5 && h('div',{style:{margin:'12px 16px 0',padding:'14px 16px',borderRadius:16,background:C.redlt,border:`1.5px solid ${C.red}`,display:'flex',alignItems:'center',gap:12}},
      h('span',{style:{fontSize:'1.6rem'}},'\uD83D\uDD3A'),
      h('div',{style:{flex:1}},
        h('div',{style:{fontWeight:800,color:C.red,fontSize:14}},'Over Income This Month'),
        h('div',{style:{fontSize:12,color:C.text2}},'You\u2019ve spent more than you\u2019ve earned')
      ),
      h('span',{style:{fontFamily:'monospace',fontWeight:800,color:C.red,fontSize:16}},'+'+fmtC(overspent))
    ),
    uncatTotal>0.5 && h('div',{onClick:()=>{onQuickCategorize?onQuickCategorize(null):setPage('categorize')},style:{margin:'12px 16px 0',padding:'14px 16px',borderRadius:16,background:C.orangelt,border:`1.5px solid ${C.orange}`,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}},
      h('span',{style:{fontSize:'1.6rem'}},'\u26A0\uFE0F'),
      h('div',{style:{flex:1}},
        h('div',{style:{fontWeight:800,color:C.orange,fontSize:14}},'Uncategorized Spending'),
        h('div',{style:{fontSize:12,color:C.text2}},'Tap to categorize '+fmtC(uncatTotal))
      ),
      h('span',{style:{fontFamily:'monospace',fontWeight:800,color:C.orange,fontSize:16}},fmtC(uncatTotal))
    ),
    /* Summary cards */
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,padding:'14px 16px 4px'}},
      [['Income',income,C.green,'\uD83D\uDCB0'],['Expenses',catSpentOnly,C.red,'\uD83D\uDCB8'],
       ['Savings',savings,C.purple,'\uD83D\uDCC8'],['Remaining',remaining,remaining>=0?C.green:C.red,'\uD83E\uDE99']].map(([l,v,col,ic])=>
        h('div',{key:l,style:{background:C.card,borderRadius:16,padding:'14px',boxShadow:C.shadow,border:`1px solid ${C.border}`}},
          h('div',{style:{fontSize:18,marginBottom:4}},ic),
          h('div',{style:{fontSize:11,color:C.text3,fontWeight:600,marginBottom:2}},l),
          h('div',{style:{fontFamily:'monospace',fontWeight:800,color:col,fontSize:16}},fmtC(v)),
          l==='Expenses'&&uncatTotal>0.5&&h('div',{style:{fontSize:10,color:C.orange,fontWeight:700,marginTop:2}},'+ '+fmtC(uncatTotal)+' uncategorized'),
          l==='Remaining'&&uncatTotal>0.5&&h('div',{style:{fontSize:10,color:C.text3,fontWeight:600,marginTop:2}},'accounts for uncategorized too')
        )
      )
    ),
    /* Budget overview bar — now also shows what's left of the total budget */
    h('div',{style:{margin:'10px 16px',padding:'14px 16px',background:C.card,borderRadius:16,boxShadow:C.shadow,border:`1px solid ${C.border}`}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
        h('span',{style:{fontSize:13,fontWeight:700,color:C.text}},'Total Budget Used'),
        h('span',{style:{fontSize:13,fontWeight:700,color:C.text2,fontFamily:'monospace'}},fmtC(catSpentOnly)+' / '+fmtC(budgetTot))
      ),
      h(Bar,{pct:budgetPct,color:statusFor(catSpentOnly,budgetTot).color}),
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}},
        h('span',{style:{fontSize:11.5,fontWeight:700,color:C.text3}},budgetTot>0?Math.round(budgetPct)+'% used':'No budget set yet'),
        budgetTot>0&&h('span',{style:{fontSize:13.5,fontWeight:800,fontFamily:'monospace',color:leftColor(budgetLeft)}},
          budgetLeft>=0?fmtC(budgetLeft)+' left to spend':fmtC(-budgetLeft)+' over budget')
      )
    ),
    /* Safe to spend — paces what's left of Variable Expenses over the days ahead */
    h('div',{style:{margin:'10px 16px',padding:'14px 16px',background:C.card,borderRadius:16,boxShadow:C.shadow,border:`1px solid ${C.border}`,borderLeft:`4px solid ${varBudget>0?leftColor(varLeft):C.border2}`}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
        h('span',{style:{fontSize:16}},'\uD83D\uDED2'),
        h('span',{style:{fontSize:13,fontWeight:700,color:C.text,flex:1}},'Safe to Spend'),
        h('span',{style:{fontSize:10,fontWeight:700,color:C.text3,letterSpacing:'.05em'}},'VARIABLE EXPENSES')
      ),
      varBudget<=0&&h('div',{style:{fontSize:12.5,color:C.text2}},'Set a Variable Expenses budget in Settings and this will pace it across the days left in the month.'),
      varBudget>0&&h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:6}},
        h('span',{style:{color:C.text2,fontFamily:'monospace',fontWeight:600}},fmtC(varSpent)+' of '+fmtC(varBudget)),
        h('span',{style:{fontFamily:'monospace',fontWeight:800,color:leftColor(varLeft)}},leftLabel(varLeft))
      ),
      varBudget>0&&h(Bar,{pct:varSpent/varBudget*100,color:statusFor(varSpent,varBudget).color}),
      varBudget>0&&varLeft>0&&daysLeft>0&&h('div',{style:{display:'flex',gap:10,marginTop:11}},
        [[daysLeft>=7?'PER WEEK':'LEFT THIS WEEK',safeWeek],['PER DAY',safeDay]].map(([l,v])=>
          h('div',{key:l,style:{flex:1,textAlign:'center',padding:'9px 6px',borderRadius:14,background:C.greenlt}},
            h('div',{style:{fontSize:10,color:C.green,fontWeight:700,letterSpacing:'.06em'}},l),
            h('div',{style:{fontSize:19,fontWeight:800,color:C.green,fontFamily:'monospace'}},fmtC(v))
          ))
      ),
      varBudget>0&&varLeft>0&&daysLeft>0&&h('div',{style:{fontSize:11.5,color:C.text3,fontWeight:600,marginTop:7,textAlign:'center'}},
        daysLeft+(daysLeft===1?' day':' days')+' left'+(daysLeft>=7?' \u00B7 about '+(Math.round(weeksLeft*10)/10)+' weeks to cover':' in '+monthLabel(month))),
      varBudget>0&&varLeft>0&&daysLeft>0&&uncatTotal>0.5&&h('div',{style:{fontSize:11,color:C.orange,fontWeight:600,marginTop:5,textAlign:'center'}},
        'Categorize the '+fmtC(uncatTotal)+' pending first \u2014 some of it may be variable spending.'),
      varBudget>0&&varLeft<=0&&h('div',{style:{marginTop:10,padding:'10px 12px',borderRadius:12,background:C.redlt,fontSize:12.5,color:C.red,fontWeight:700}},
        varLeft===0?'Budget fully used \u2014 nothing left for the rest of the month.':fmtC(-varLeft)+' past the variable budget with '+daysLeft+(daysLeft===1?' day':' days')+' to go.'),
      varBudget>0&&varLeft>0&&daysLeft===0&&h('div',{style:{marginTop:10,padding:'10px 12px',borderRadius:12,background:C.card2,fontSize:12.5,color:C.text2,fontWeight:600}},
        monthLabel(month)+' is finished \u2014 '+fmtC(varLeft)+' of this budget went unspent.')
    ),
    /* Category breakdown — horizontal bars + remaining budget per category */
    h(SectionTitle,null,'Spending by Category'),
    catRows.length>0&&h('div',{style:{display:'flex',justifyContent:'center',gap:14,padding:'0 16px 12px'}},
      h('div',{style:{flex:1,textAlign:'center',padding:'8px 6px',borderRadius:14,background:C.card2}},
        h('div',{style:{fontSize:10.5,color:C.text3,fontWeight:700,letterSpacing:'.06em'}},'SPENT'),
        h('div',{style:{fontSize:19,fontWeight:800,color:C.text,fontFamily:'monospace'}},fmtC(catTotal))
      ),
      h('div',{style:{flex:1,textAlign:'center',padding:'8px 6px',borderRadius:14,background:budgetLeft>=0?C.greenlt:C.redlt}},
        h('div',{style:{fontSize:10.5,color:leftColor(budgetLeft),fontWeight:700,letterSpacing:'.06em'}},budgetLeft>=0?'BUDGET LEFT':'OVER BUDGET'),
        h('div',{style:{fontSize:19,fontWeight:800,color:leftColor(budgetLeft),fontFamily:'monospace'}},fmtC(Math.abs(budgetLeft)))
      )
    ),
    catRows.length===0&&h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',padding:'32px 20px',color:C.text3}},
      h('div',{style:{fontSize:'2.2rem',marginBottom:8}},'\uD83E\uDDFE'),
      h('div',{style:{fontWeight:700,color:C.text2,fontSize:14}},'No categorized spending yet'),
      h('div',{style:{fontSize:11.5,marginTop:3}},'Add an expense to see it broken down here')
    ),
    catRows.length>0&&h('div',{style:{padding:'0 16px'}},
      catRows.map(s=>h('div',{key:s.id,style:{marginBottom:14}},
        h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:5}},
          h('div',{style:{width:24,height:24,borderRadius:8,background:s.color+'18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.8rem',flexShrink:0}},s.icon),
          h('span',{style:{fontSize:13,color:C.text,fontWeight:600,flex:1}},s.name),
          h('span',{style:{fontSize:12,color:C.text3,fontWeight:700,marginRight:8}},(catTotal?Math.round(s.v/catTotal*100):0)+'%'),
          h('span',{style:{fontSize:13,color:C.text,fontWeight:800,fontFamily:'monospace'}},fmtC(s.v))
        ),
        h(Bar,{pct:catTotal?s.v/catTotal*100:0,color:s.color}),
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:5}},
          h('span',{style:{fontSize:11.5,color:C.text3,fontWeight:600,fontFamily:'monospace'}},
            s.budget>0?fmtC(s.v)+' of '+fmtC(s.budget)+' budget':'No budget set'),
          s.budget>0&&h('span',{style:{fontSize:12,fontWeight:800,fontFamily:'monospace',color:leftColor(s.left)}},leftLabel(s.left))
        )
      ))
    ),
    /* Weekly Insight — Variable Expenses only */
    h(WeeklyInsights,{data,md,month,onQuickCategorize}),
    /* Payment source split */
    h(SectionTitle,null,'Payment Source Split'),
    h('div',{style:{padding:'0 16px'}},
      srcSegs.map(s=>h('div',{key:s.name,style:{marginBottom:10}},
        h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
          h('span',{style:{fontSize:13,color:C.text2,fontWeight:600}},s.name),
          h('span',{style:{fontSize:13,color:C.text,fontWeight:700,fontFamily:'monospace'}},fmtC(s.v))
        ),
        h(Bar,{pct:catSpentOnly?s.v/catSpentOnly*100:0,color:s.color})
      ))
    ),
    /* Budget Watch — cooler, filterable, shows everything */
    allRows.length>0&&h(SectionTitle,null,'Budget Watch'),
    allRows.length>0&&h('div',{style:{padding:'0 16px 6px',fontSize:10.5,color:C.text3,fontWeight:600,marginTop:-4}},'Tap a row to log an expense against it'),
    allRows.length>0&&h('div',{style:{padding:'0 16px 10px'}},
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:2}},
        [['all','All',allRows.length,C.indigo],['over','\uD83D\uDD34 Over',overCount,C.red],['near','\uD83D\uDFE0 Near',nearCount,C.orange],['under','\uD83D\uDFE2 Under',underCount,C.green]].map(([key,label,count,col])=>
          h('button',{key,onClick:()=>setWatchFilter(key),
            style:{flexShrink:0,padding:'7px 13px',borderRadius:99,border:`1.5px solid ${watchFilter===key?col:C.border}`,background:watchFilter===key?col+'18':C.card2,color:watchFilter===key?col:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
            label+' ('+count+')')
        )
      )
    ),
    allRows.length>0&&h('div',{style:{padding:'0 16px'}},
      watchRows.length===0&&h('div',{style:{textAlign:'center',padding:'24px 0',color:C.text3,fontSize:13,fontWeight:600}},'Nothing in this bucket \uD83C\uDF89'),
      watchRows.map(r=>{
        const pctLabel=r.budget?Math.round(r.pct)+'%':(r.spent>0?'\u2014':'0%');
        return h('div',{key:r.id,onClick:()=>onQuickCategorize&&onQuickCategorize(r.id),style:{display:'flex',alignItems:'center',gap:9,background:C.card,borderRadius:12,padding:'8px 11px',marginBottom:6,boxShadow:C.shadowSm,border:`1px solid ${C.border}`,borderLeft:`3px solid ${r.status.color}`,cursor:onQuickCategorize?'pointer':undefined}},
          h('div',{style:{width:28,height:28,borderRadius:9,background:r.status.color+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.95rem',flexShrink:0}},r.icon),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8,marginBottom:3}},
              h('span',{style:{fontSize:12.5,fontWeight:700,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.name),
              h('span',{style:{fontSize:11,fontWeight:800,color:r.status.color,flexShrink:0}},pctLabel)
            ),
            h(Bar,{pct:r.budget?r.pct:100,color:r.status.color})
          ),
          h('div',{style:{textAlign:'right',flexShrink:0,minWidth:58}},
            h('div',{style:{fontSize:11,fontWeight:800,fontFamily:'monospace',color:C.text}},fmtC(r.spent)),
            h('div',{style:{fontSize:9,fontWeight:700,fontFamily:'monospace',color:r.budget>0?leftColor(r.left):C.text3}},
              r.budget>0?(r.left>=0?fmtC(r.left)+' left':fmtC(-r.left)+' over'):'no budget')
          )
        );
      })
    )
  );
}

/* ══════════════════════════ BALANCES PAGE ══════════════════════════ */
function BalancesPage({data,month,onSave,onModeChange,onDeleteLog,onAdjustBuckets,onResetBalances}){
  const curMd=getMonth(data,month);
  const[showAdjust,setShowAdjust]=useState(false);
  const[adjDebit,setAdjDebit]=useState(String(curMd.uncategorized.debit));
  const[adjSbi,setAdjSbi]=useState(String(curMd.uncategorized.sbi));
  const[adjYes,setAdjYes]=useState(String(curMd.uncategorized.yes));
  const[adjSaved,setAdjSaved]=useState(false);
  function saveAdjust(){
    onAdjustBuckets({debit:adjDebit,sbi:adjSbi,yes:adjYes});
    setAdjSaved(true);setTimeout(()=>setAdjSaved(false),1500);
  }
  // Balances, calculations, and the update log all live on THIS month only —
  // switching to another month never reads or writes another month's balance.
  const bal=curMd.balances;
  const md=curMd;
  const incomeTotal=monthIncome(md);
  const baseline=bal||{debit:incomeTotal,sbi:0,yes:0};
  const mode=data.cardInputMode||'remaining'; // 'remaining' | 'outstanding'
  const isRemaining=mode==='remaining';

  // Card fields are always edited in the CURRENT display mode. Convert stored
  // outstanding -> remaining for display when needed.
  const sbiLimit=+data.cardLimits.sbi||0, yesLimit=+data.cardLimits.yes||0;
  const initSbiDisplay=bal?(isRemaining?(sbiLimit-bal.sbi):bal.sbi):'';
  const initYesDisplay=bal?(isRemaining?(yesLimit-bal.yes):bal.yes):'';

  const[debit,setDebit]=useState(bal?String(bal.debit):'');
  const[sbiDisp,setSbiDisp]=useState(bal?String(initSbiDisplay):'');
  const[yesDisp,setYesDisp]=useState(bal?String(initYesDisplay):'');

  // Reload the input fields (and the adjust-buckets fields) whenever the
  // browsed month changes, so August never shows leftover text typed while
  // looking at July.
  useEffect(()=>{
    const m=getMonth(data,month);
    const b=m.balances;
    const inc=monthIncome(m);
    const bl=b||{debit:inc,sbi:0,yes:0};
    const curMode=data.cardInputMode||'remaining';
    const isRem=curMode==='remaining';
    setDebit(b?String(b.debit):'');
    setSbiDisp(b?String(isRem?(sbiLimit-b.sbi):b.sbi):'');
    setYesDisp(b?String(isRem?(yesLimit-b.yes):b.yes):'');
    setAdjDebit(String(m.uncategorized.debit));
    setAdjSbi(String(m.uncategorized.sbi));
    setAdjYes(String(m.uncategorized.yes));
  },[month]);

  function switchMode(newMode){
    if(newMode===mode)return;
    // convert whatever is currently typed into the new mode so numbers don't jump
    const curSbiOutstanding=isRemaining?(sbiLimit-(+sbiDisp||0)):(+sbiDisp||0);
    const curYesOutstanding=isRemaining?(yesLimit-(+yesDisp||0)):(+yesDisp||0);
    if(newMode==='remaining'){
      setSbiDisp(sbiLimit?String(sbiLimit-curSbiOutstanding):'');
      setYesDisp(yesLimit?String(yesLimit-curYesOutstanding):'');
    }else{
      setSbiDisp(String(curSbiOutstanding));
      setYesDisp(String(curYesOutstanding));
    }
    onModeChange(newMode);
  }

  // Resolve what each field actually means: if the user left it blank, that
  // means "no change" (keep the last known value) — NOT "zero remaining /
  // fully maxed out". These are used for both the save and the live preview.
  function resolveDebit(){return debit===''?baseline.debit:(+debit||0)}
  function resolveSbi(){return sbiDisp===''?baseline.sbi:(isRemaining?(sbiLimit-(+sbiDisp||0)):(+sbiDisp||0))}
  function resolveYes(){return yesDisp===''?baseline.yes:(isRemaining?(yesLimit-(+yesDisp||0)):(+yesDisp||0))}

  function save(){
    const nD=resolveDebit();
    const nS=resolveSbi();
    const nY=resolveYes();
    const debitSpend=baseline.debit-nD;
    const sbiSpend=nS-baseline.sbi;
    const yesSpend=nY-baseline.yes;
    const totalNew=debitSpend+sbiSpend+yesSpend;
    onSave({debit:nD,sbi:nS,yes:nY},totalNew,{debitSpend,sbiSpend,yesSpend,totalNew,usedIncomeBaseline:!bal,at:new Date().toISOString()});
  }

  const nSPreview=resolveSbi();
  const nYPreview=resolveYes();
  const sbiPct=sbiLimit?nSPreview/sbiLimit*100:0;
  const yesPct=yesLimit?nYPreview/yesLimit*100:0;
  const calc=curMd.lastCalc;

  const modeBtn=(val,label)=>h('button',{onClick:()=>switchMode(val),
    style:{flex:1,padding:'8px',borderRadius:9,border:`1.5px solid ${mode===val?C.indigo:C.border}`,background:mode===val?C.indigolt:C.card2,color:mode===val?C.indigo:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},label);

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 4px'}},
      h('div',{style:{fontSize:20,fontWeight:800,color:C.text}},'Update Balances \u2014 '+monthLabel(month)),
      h('div',{style:{fontSize:13,color:C.text2,marginTop:2}},'New spending is calculated automatically from the change since your last update, and is added to '+monthLabel(month)+'\u2019s uncategorized pool.')
    ),
    !bal&&h('div',{style:{margin:'12px 16px 0',padding:'12px 14px',borderRadius:12,background:C.orangelt,border:`1px solid ${C.orange}`,fontSize:12.5,color:C.orange,fontWeight:600}},
      '\u26A0\uFE0F No previous balance saved yet. We\u2019ll assume your Debit account started this month at your total income ('+fmtC(incomeTotal)+') and both cards started at '+fmtC(0)+' outstanding, then calculate today\u2019s spend from that.'
    ),
    bal&&h('div',{style:{margin:'12px 16px 0',padding:'10px 14px',borderRadius:12,background:C.card2,fontSize:12,color:C.text2}},
      'Last saved: Debit '+fmtC(bal.debit)+' \u00B7 SBI Outstanding '+fmtC(bal.sbi)+' \u00B7 YES Outstanding '+fmtC(bal.yes)
    ),
    h('div',{style:{margin:'8px 16px 0',fontSize:11.5,color:C.text3}},'\uD83D\uDCA1 Leave any field blank to keep it unchanged \u2014 blank does NOT mean zero.'),
    h('div',{style:{padding:'16px'}},
      h('div',{style:{marginBottom:16}},
        h('div',{style:{fontSize:13,fontWeight:700,color:C.text,marginBottom:6}},'Debit Account Balance'),
        h(NumField,{value:debit,onChange:setDebit})
      ),
      h('div',{style:{display:'flex',gap:8,marginBottom:14}},modeBtn('remaining','Enter Remaining Limit'),modeBtn('outstanding','Enter Outstanding')),
      [['SBI Card',sbiDisp,setSbiDisp,sbiLimit],['YES Card',yesDisp,setYesDisp,yesLimit]].map(([label,val,setter,limit])=>
        h('div',{key:label,style:{marginBottom:16}},
          h('div',{style:{fontSize:13,fontWeight:700,color:C.text,marginBottom:6}},label+' \u2014 '+(isRemaining?'Remaining Available':'Outstanding Used')+(limit?'':' (set limit in Settings)')),
          h(NumField,{value:val,onChange:setter})
        )
      ),
      sbiLimit>0&&h('div',{style:{marginBottom:10}},
        h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,color:C.text2,marginBottom:4}},
          h('span',null,'SBI Used'),h('span',null,Math.round(sbiPct)+'% of '+fmtC(sbiLimit)+' ('+fmtC(nSPreview)+' outstanding)')),
        h(Bar,{pct:sbiPct,color:sbiPct>90?C.red:sbiPct>70?C.orange:C.green})
      ),
      yesLimit>0&&h('div',{style:{marginBottom:16}},
        h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,color:C.text2,marginBottom:4}},
          h('span',null,'YES Used'),h('span',null,Math.round(yesPct)+'% of '+fmtC(yesLimit)+' ('+fmtC(nYPreview)+' outstanding)')),
        h(Bar,{pct:yesPct,color:yesPct>90?C.red:yesPct>70?C.orange:C.green})
      ),
      h('button',{onClick:save,style:{width:'100%',padding:'15px',borderRadius:14,border:'none',background:C.grad,color:'#fff',fontWeight:800,fontSize:16,cursor:'pointer',fontFamily:'inherit'}},'Save Balances')
    ),
    calc&&h('div',{style:{margin:'0 16px 16px',padding:'14px',borderRadius:14,background:C.card,border:`1px solid ${C.border}`,boxShadow:C.shadow}},
      h('div',{style:{fontWeight:800,color:C.text,marginBottom:8,fontSize:14}},'Last Calculation'),
      calc.usedIncomeBaseline&&h('div',{style:{fontSize:11.5,color:C.text3,marginBottom:8}},'(Calculated using income as the starting Debit baseline)'),
      [['Debit Spend',calc.debitSpend],['SBI Spend',calc.sbiSpend],['YES Spend',calc.yesSpend]].map(([l,v])=>
        h('div',{key:l,style:{display:'flex',justifyContent:'space-between',fontSize:13,color:C.text2,padding:'3px 0'}},h('span',null,l),h('span',{style:{fontFamily:'monospace',fontWeight:700,color:C.text}},fmtC(v)))
      ),
      h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:800,color:calc.totalNew>0?C.orange:C.text2,borderTop:`1px solid ${C.border}`,marginTop:6,paddingTop:8}},
        h('span',null,'Added to Uncategorized'),h('span',{style:{fontFamily:'monospace'}},fmtC(calc.totalNew))
      ),
      calc.totalNew===0&&h('div',{style:{fontSize:11.5,color:C.text3,marginTop:6}},'No change detected \u2014 balances matched your last save exactly.')
    ),
    h('div',{style:{margin:'0 16px 16px'}},
      h('button',{onClick:()=>setShowAdjust(v=>!v),style:{width:'100%',padding:'12px',borderRadius:12,border:`1.5px dashed ${C.border2}`,background:'transparent',color:C.text2,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}},
        (showAdjust?'\u25BE ':'\u25B8 ')+'Manually Adjust Uncategorized Buckets'
      ),
      showAdjust&&h('div',{style:{marginTop:8,padding:'14px',borderRadius:14,background:C.card,border:`1px solid ${C.border}`,boxShadow:C.shadow}},
        h('div',{style:{fontSize:12,color:C.text2,marginBottom:12}},'Use this to correct '+monthLabel(month)+'\u2019s Debit / SBI / YES uncategorized totals directly \u2014 handy after moving to per-card tracking, or to match your real statements.'),
        [['Debit',adjDebit,setAdjDebit],['SBI',adjSbi,setAdjSbi],['YES',adjYes,setAdjYes]].map(([label,val,setter])=>
          h('div',{key:label,style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}},
            h('span',{style:{fontSize:13,fontWeight:700,color:C.text,width:50}},label),
            h('div',{style:{flex:1}},h(NumField,{value:val,onChange:setter}))
          )
        ),
        h('div',{style:{display:'flex',gap:8}},
          h('button',{onClick:()=>{setAdjDebit('0');setAdjSbi('0');setAdjYes('0')},style:{padding:'12px 14px',borderRadius:12,border:`1.5px solid ${C.border2}`,background:C.card2,color:C.text2,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}},'Fill \u20B90'),
          h('button',{onClick:saveAdjust,style:{flex:1,padding:'12px',borderRadius:12,border:'none',background:adjSaved?C.green:C.indigo,color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer',fontFamily:'inherit'}},adjSaved?'\u2713 Adjusted':'Save Adjustment')
        )
      )
    ),
    h('div',{style:{margin:'0 16px 16px'}},
      h('button',{onClick:()=>{if(confirm('Reset your saved Debit/SBI/YES balances? Your next Balances save will start fresh (using income as the baseline again). This month\u2019s uncategorized totals and transaction history are NOT affected.'))onResetBalances()},
        style:{width:'100%',padding:'12px',borderRadius:12,border:`1.5px solid ${C.orange}`,background:C.orangelt,color:C.orange,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}},'Reset Saved Balances / Start Fresh')
    ),
    h(SectionTitle,null,'Balance Update History \u2014 '+monthLabel(month)),
    h('div',{style:{padding:'0 16px'}},
      (curMd.balanceLog.length===0)&&h('div',{style:{fontSize:12.5,color:C.text3,padding:'4px 0 12px'}},'No balance updates logged for '+monthLabel(month)+' yet.'),
      curMd.balanceLog.length>0&&h('div',{style:{background:C.card,borderRadius:14,overflow:'hidden',boxShadow:C.shadow,border:`1px solid ${C.border}`}},
        curMd.balanceLog.slice().reverse().map((e,i,arr)=>{
          const isLatest=i===0;
          const dt=new Date(e.at);
          const dtLabel=isNaN(dt)?e.ym:dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
          return h('div',{key:e.id,style:{padding:'12px 14px',borderBottom:i<arr.length-1?`1px solid ${C.border}`:'none'}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}},
              h('div',{style:{flex:1,minWidth:0}},
                h('div',{style:{fontSize:12.5,fontWeight:700,color:C.text,display:'flex',alignItems:'center',gap:6}},
                  dtLabel,
                  isLatest&&h('span',{style:{fontSize:10,fontWeight:800,color:C.indigo,background:C.indigolt,padding:'2px 6px',borderRadius:6}},'CURRENT'),
                  e.imported&&h('span',{style:{fontSize:10,fontWeight:800,color:C.text3,background:C.card2,padding:'2px 6px',borderRadius:6}},'IMPORTED')
                ),
                h('div',{style:{fontSize:11.5,color:C.text3,marginTop:2}},'Debit '+fmtC(e.debit)+' \u00B7 SBI '+fmtC(e.sbi)+' \u00B7 YES '+fmtC(e.yes)),
                h('div',{style:{fontSize:11.5,color:e.totalNew>0?C.orange:C.text2,marginTop:2,fontWeight:700}},'Spend added: '+fmtC(e.totalNew))
              ),
              h('button',{onClick:()=>{
                  const msg=isLatest
                    ?'Delete this update? This will UNDO it \u2014 it subtracts '+fmtC(e.totalNew)+' back out of '+monthLabel(month)+'\u2019s uncategorized total and restores '+monthLabel(month)+'\u2019s previous balances.'
                    :'Delete this log entry? It\u2019s an older record, so removing it only tidies up your history \u2014 it won\u2019t change any current totals.';
                  if(confirm(msg))onDeleteLog(e.id);
                },
                style:{border:'none',background:C.redlt,color:C.red,borderRadius:9,width:32,height:32,fontSize:15,cursor:'pointer',fontWeight:700,flexShrink:0}},'\uD83D\uDDD1\uFE0F')
            )
          );
        })
      )
    )
  );
}

/* ══════════════════════════ CATEGORIZE PAGE ══════════════════════════ */
function CategorizePage({data,month,prefillSubId,onAddTxn,onEditTxn,onDeleteTxn,onResetUncategorized}){
  const md=getMonth(data,month);
  const buckets=md.uncategorized;
  const total=uncategorizedTotal(md);
  const prefillSub=prefillSubId?getSubFor(prefillSubId,data):null;
  const[amount,setAmount]=useState('');
  const[catId,setCatId]=useState(prefillSub?prefillSub.catId:'');
  const[subId,setSubId]=useState(prefillSubId||'');
  const[source,setSource]=useState('debit');
  const[desc,setDesc]=useState('');
  const[date,setDate]=useState(month===curYm()?today():month+'-01');
  const[err,setErr]=useState('');
  const[errField,setErrField]=useState(null); // 'amount' | 'cat' | 'sub' | null
  const[editing,setEditing]=useState(null); // {ym,txn}

  const amountWrapRef=useRef(null);
  const catRowRef=useRef(null);
  const subGridRef=useRef(null);

  const cat=categoriesFor(data).find(c=>c.id===catId);
  const availForSource=buckets[source]||0;
  // What's left of the chosen subcategory's budget, so you can see the impact
  // of this expense before you file it.
  const subLeft=subId?subBudget(md,subId)-subSpent(md,subId):null;

  // Scrolls to and briefly highlights whichever field caused a validation
  // error, instead of leaving the person to hunt for a small red line of text.
  function flagField(field,ref){
    setErrField(field);
    ref.current&&ref.current.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>setErrField(f=>f===field?null:f),1600);
  }
  const ringStyle=on=>on?{boxShadow:`0 0 0 3px ${C.red}33`,borderRadius:14}:null;

  function save(){
    const amt=+amount;
    if(!amt||amt<=0){setErr('Enter a valid amount');flagField('amount',amountWrapRef);return}
    if(!subId){
      setErr('Pick a category & subcategory');
      if(!catId)flagField('cat',catRowRef);else flagField('sub',subGridRef);
      return;
    }
    if(amt>availForSource+0.01){setErr('Amount exceeds '+getSrc(source).short+'\u2019s uncategorized balance ('+fmtC(availForSource)+')');flagField('amount',amountWrapRef);return}
    onAddTxn({id:genId(),date,amount:amt,catId,subId,source,desc:desc.trim()});
    setAmount('');setCatId('');setSubId('');setDesc('');setErr('');setErrField(null);
  }

  function pickSub(sub){setCatId(sub.catId);setSubId(sub.id)}

  const recent=md.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.id>a.id?1:-1)).slice(0,8);
  const repeatEntries=lastMonthFixedEntries(data,month,md);
  const recentIds=recentSubIds(data,5,repeatEntries.map(t=>t.subId));

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 0'}},
      h('div',{style:{fontSize:12,fontWeight:700,color:C.text3,marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}},'Categorizing for '+monthLabel(month)),
      h('div',{style:{padding:'16px 18px',borderRadius:18,background:total>0.5?C.orangelt:C.greenlt,border:`1.5px solid ${total>0.5?C.orange:C.green}`,textAlign:'center'}},
        h('div',{style:{fontSize:12,fontWeight:700,color:total>0.5?C.orange:C.green,textTransform:'uppercase',letterSpacing:'.06em'}},'Uncategorized Remaining'),
        h('div',{style:{fontSize:32,fontWeight:900,color:total>0.5?C.orange:C.green,fontFamily:'monospace',marginTop:4}},fmtC(total)),
        h('div',{style:{display:'flex',justifyContent:'center',gap:14,marginTop:10}},
          SOURCES.map(s=>h('div',{key:s.id,style:{textAlign:'center'}},
            h('div',{style:{fontSize:10,fontWeight:700,color:C.text3,textTransform:'uppercase'}},s.short),
            h('div',{style:{fontSize:14,fontWeight:800,color:s.color,fontFamily:'monospace'}},fmtC(buckets[s.id]||0))
          ))
        )
      ),
      total>0.5&&h('button',{onClick:()=>{if(confirm('Reset all uncategorized amounts (Debit/SBI/YES) to \u20B90 for '+monthLabel(month)+'? Already-categorized expenses are NOT affected \u2014 this just clears the pending pool.'))onResetUncategorized()},
        style:{width:'100%',marginTop:10,padding:'9px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:'transparent',color:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},'Reset Uncategorized to \u20B90')
    ),
    /* Repeat from Last Month — recurring fixed bills, one tap prefills category, sub AND amount */
    repeatEntries.length>0&&h(SectionTitle,null,'Repeat from Last Month'),
    repeatEntries.length>0&&h('div',{style:{padding:'0 16px'}},
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},
        repeatEntries.map(t=>{
          const sub=getSubFor(t.subId,data);
          return h('button',{key:t.subId,onClick:()=>{pickSub(sub);setAmount(String(t.amount));setSource(t.source)},
            style:{flexShrink:0,display:'flex',flexDirection:'column',alignItems:'flex-start',gap:2,padding:'8px 12px',borderRadius:12,border:`1.5px solid ${C.border2}`,background:C.card,cursor:'pointer',fontFamily:'inherit',boxShadow:C.shadowSm}},
            h('span',{style:{fontSize:11.5,fontWeight:700,color:C.text,whiteSpace:'nowrap'}},sub.icon+' '+sub.name),
            h('span',{style:{fontSize:11,fontWeight:800,fontFamily:'monospace',color:C.indigo}},fmtC(t.amount))
          );
        })
      )
    ),
    /* Recently Used — one tap just picks the category/subcategory */
    recentIds.length>0&&h(SectionTitle,null,'Recently Used'),
    recentIds.length>0&&h('div',{style:{padding:'0 16px'}},
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},
        recentIds.map(id=>{
          const sub=getSubFor(id,data);
          return h('button',{key:id,onClick:()=>pickSub(sub),
            style:{flexShrink:0,display:'flex',alignItems:'center',gap:6,padding:'8px 12px',borderRadius:99,border:`1.5px solid ${subId===id?sub.catColor:C.border}`,background:subId===id?sub.catColor+'18':C.card2,color:subId===id?sub.catColor:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
            sub.icon+' '+sub.name);
        })
      )
    ),
    h(SectionTitle,null,'Add Expense'),
    h('div',{style:{padding:'0 16px'}},
      h('div',{ref:amountWrapRef,style:{marginBottom:6,transition:'box-shadow .2s',...ringStyle(errField==='amount')}},h(NumField,{value:amount,onChange:setAmount,placeholder:'Amount'})),
      h('div',{style:{fontSize:11.5,color:C.text3,marginBottom:12}},'Max from '+getSrc(source).short+': '+fmtC(availForSource)),
      h('div',{ref:catRowRef,style:{marginBottom:12,transition:'box-shadow .2s',padding:errField==='cat'?4:0,...ringStyle(errField==='cat')}},
        h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},

/* ══════════════════════════ HISTORY PAGE ══════════════════════════ */
function EditTxnSheet({data,ym,txn,onSave,onClose}){
  const[amount,setAmount]=useState(String(txn.amount));
  const[catId,setCatId]=useState(txn.catId);
  const[subId,setSubId]=useState(txn.subId);
  const[source,setSource]=useState(txn.source);
  const[desc,setDesc]=useState(txn.desc||'');
  const[date,setDate]=useState(txn.date);
  const[err,setErr]=useState('');
  const[errField,setErrField]=useState(null);

  const amountWrapRef=useRef(null);
  const catRowRef=useRef(null);
  const subGridRef=useRef(null);

  const cat=categoriesFor(data).find(c=>c.id===catId);
  const originYm=txn.originYm||ym;
  const originMd=getMonth(data,originYm);
  // Available for the currently-selected source, as if this transaction's old
  // amount were already given back (since editing may keep or change source).
  const availForSource=(originMd.uncategorized[source]||0)+(source===txn.source?txn.amount:0);

  function flagField(field,ref){
    setErrField(field);
    ref.current&&ref.current.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(()=>setErrField(f=>f===field?null:f),1600);
  }
  const ringStyle=on=>on?{boxShadow:`0 0 0 3px ${C.red}33`,borderRadius:14}:null;

  function save(){
    const amt=+amount;
    if(!amt||amt<=0){setErr('Enter a valid amount');flagField('amount',amountWrapRef);return}
    if(!subId){
      setErr('Pick a category & subcategory');
      if(!catId)flagField('cat',catRowRef);else flagField('sub',subGridRef);
      return;
    }
    if(amt>availForSource+0.01){setErr('Amount exceeds '+getSrc(source).short+'\u2019s available balance ('+fmtC(availForSource)+')');flagField('amount',amountWrapRef);return}
    onSave({amount:amt,catId,subId,source,desc:desc.trim(),date});
    onClose();
  }

  return h('div',{style:{background:C.card,borderRadius:'24px 24px 0 0',maxHeight:'92dvh',overflowY:'auto'}},
    h('div',{style:{display:'flex',justifyContent:'center',padding:'12px 0 0'}},
      h('div',{style:{width:40,height:4,borderRadius:99,background:C.border2}})
    ),
    h('div',{style:{padding:'14px 20px 0',fontSize:17,fontWeight:800,color:C.text}},'Edit Expense'),
    h('div',{ref:amountWrapRef,style:{padding:'12px 20px 0',transition:'box-shadow .2s',...ringStyle(errField==='amount')}},h(NumField,{value:amount,onChange:setAmount,placeholder:'Amount'})),
    h('div',{style:{padding:'6px 20px 12px',fontSize:11.5,color:C.text3}},'Max from '+getSrc(source).short+': '+fmtC(availForSource)),
    h('div',{ref:catRowRef,style:{padding:'0 20px 12px',transition:'box-shadow .2s',...ringStyle(errField==='cat')}},
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},
        CATEGORIES.map(c=>h('button',{key:c.id,onClick:()=>{setCatId(c.id);if(c.id!==catId)setSubId('')},
          style:{flexShrink:0,padding:'8px 12px',borderRadius:10,border:`1.5px solid ${catId===c.id?c.color:C.border}`,background:catId===c.id?c.color+'18':C.card2,color:catId===c.id?c.color:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
          c.icon+' '+c.name))
      )
    ),
    cat&&h('div',{ref:subGridRef,style:{padding:'0 20px 12px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,transition:'box-shadow .2s',...ringStyle(errField==='sub')}},
      cat.subs.map(s=>{
        const sBudget=subBudget(originMd,s.id);
        const sStatus=sBudget>0?statusFor(subSpent(originMd,s.id),sBudget):null;
        return h('button',{key:s.id,onClick:()=>setSubId(s.id),
          style:{position:'relative',display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'9px 4px',borderRadius:12,border:`1.5px solid ${subId===s.id?cat.color:C.border}`,background:subId===s.id?cat.color+'18':C.card2,cursor:'pointer',fontFamily:'inherit'}},
          sStatus&&h('span',{style:{position:'absolute',top:5,right:5,width:8,height:8,borderRadius:99,background:sStatus.color,border:'1.5px solid #fff'}}),
          h('span',{style:{fontSize:'1.15rem'}},s.icon),
          h('span',{style:{fontSize:10,fontWeight:700,color:subId===s.id?cat.color:C.text2,textAlign:'center',lineHeight:1.2}},s.name)
        );
      })
    ),
    h('div',{style:{display:'flex',gap:8,padding:'0 20px 12px'}},
      SOURCES.map(s=>h('button',{key:s.id,onClick:()=>setSource(s.id),
        style:{flex:1,padding:'9px',borderRadius:10,border:`1.5px solid ${source===s.id?s.color:C.border}`,background:source===s.id?s.color+'18':C.card2,color:source===s.id?s.color:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},s.short))
    ),
    h('div',{style:{padding:'0 20px 12px'}},
      h('div',{style:{display:'flex',gap:8}},
        h('input',{type:'date',value:date,onChange:e=>setDate(e.target.value),style:{flex:1,padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'inherit',outline:'none'}}),
        date!==today()&&h('button',{onClick:()=>setDate(today()),style:{padding:'0 16px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,color:C.indigo,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},'Today')
      )
    ),
    h('div',{style:{padding:'0 20px 12px'}},
      h('input',{value:desc,onChange:e=>setDesc(e.target.value),placeholder:'\uD83D\uDCDD Description (optional)',
        style:{width:'100%',padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:14,color:C.text,fontFamily:'inherit',outline:'none'}})
    ),
    err&&h('div',{style:{color:C.red,fontSize:12,fontWeight:600,padding:'0 20px 10px'}},err),
    h('div',{style:{display:'flex',gap:10,padding:'0 20px',paddingBottom:'calc(16px + env(safe-area-inset-bottom,0px))'}},
      h('button',{onClick:onClose,style:{flex:1,padding:'14px',borderRadius:14,border:`1.5px solid ${C.border2}`,background:C.card2,color:C.text2,fontWeight:700,fontSize:15,cursor:'pointer',fontFamily:'inherit'}},'Cancel'),
      h('button',{onClick:save,style:{flex:2,padding:'14px',borderRadius:14,border:'none',background:C.grad,color:'#fff',fontWeight:800,fontSize:15,cursor:'pointer',fontFamily:'inherit'}},'Save Changes')
    )
  );
}

function HistoryPage({data,month,onEditTxn,onDeleteTxn}){
  const[filterCat,setFilterCat]=useState('all');
  const[filterSrc,setFilterSrc]=useState('all');
  const[search,setSearch]=useState('');
  const[editing,setEditing]=useState(null); // {ym,txn}

  // History is locked to the month you're browsing on Home — it only ever
  // shows that month's transactions, so switching months never leaks another
  // month's history in. Change the month from Home to see a different one.
  let txns=(data.months[month]?data.months[month].transactions:[]).map(t=>({...t,ym:month}));
  txns=txns.filter(t=>
    (filterCat==='all'||t.catId===filterCat)&&
    (filterSrc==='all'||t.source===filterSrc)&&
    (!search||((getSubFor(t.subId,data).name+' '+(t.desc||'')).toLowerCase().includes(search.toLowerCase())))
  ).sort((a,b)=>b.date.localeCompare(a.date)||(b.id>a.id?1:-1));

  const total=txns.reduce((s,t)=>s+t.amount,0);

  const selStyle={padding:'8px 10px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:12,color:C.text,fontFamily:'inherit',outline:'none'};

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 8px'}},
      h('div',{style:{fontSize:20,fontWeight:800,color:C.text,marginBottom:2}},'Transaction History'),
      h('div',{style:{fontSize:12.5,color:C.text3,marginBottom:10}},monthLabel(month)+' \u2014 switch months from Home to see a different one'),
      h('input',{value:search,onChange:e=>setSearch(e.target.value),placeholder:'\uD83D\uDD0D Search description or category',
        style:{width:'100%',padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'inherit',outline:'none',marginBottom:10}}),
      h('div',{style:{display:'flex',gap:8,overflowX:'auto'}},
        h('select',{value:filterCat,onChange:e=>setFilterCat(e.target.value),style:selStyle},
          h('option',{value:'all'},'All Categories'),
          CATEGORIES.map(c=>h('option',{key:c.id,value:c.id},c.name))
        ),
        h('select',{value:filterSrc,onChange:e=>setFilterSrc(e.target.value),style:selStyle},
          h('option',{value:'all'},'All Sources'),
          SOURCES.map(s=>h('option',{key:s.id,value:s.id},s.short))
        )
      )
    ),
    h('div',{style:{padding:'0 16px 8px',fontSize:13,color:C.text2,fontWeight:600}},txns.length+' transactions \u00B7 Total '+fmtC(total)),
    txns.length===0&&h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',padding:'60px 20px',color:C.text3}},
      h('div',{style:{fontSize:'3rem',marginBottom:12}},'\uD83D\uDCCB'),
      h('div',{style:{fontWeight:700,color:C.text2,fontSize:16}},'No transactions found')
    ),
    txns.length>0&&h('div',{style:{padding:'0 16px'}},
      h('div',{style:{background:C.card,borderRadius:14,overflow:'hidden',boxShadow:C.shadow,border:`1px solid ${C.border}`}},
        txns.map((t,i)=>{
          const sub=getSubFor(t.subId,data),src=getSrc(t.source);
          return h(SwipeRow,{key:t.id,onDelete:()=>{if(confirm('Delete this expense? '+fmtC(t.amount)+' will be added back to '+getSrc(t.source).short+'\u2019s uncategorized balance for '+monthLabel(t.originYm||t.ym)+'.'))onDeleteTxn(t.ym,t)}},
            h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'11px 14px',borderBottom:i<txns.length-1?`1px solid ${C.border}`:'none'}},
              h('div',{style:{width:36,height:36,borderRadius:11,background:sub.catColor+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.05rem',flexShrink:0}},sub.icon),
              h('div',{style:{flex:1,minWidth:0}},
                h('div',{style:{fontSize:13,fontWeight:700,color:C.text}},sub.name),
                h('div',{style:{fontSize:11,color:C.text3}},t.date+' \u00B7 '+src.short+(t.desc?' \u00B7 '+t.desc:''))
              ),
              h('span',{style:{fontFamily:'monospace',fontWeight:800,color:C.red,fontSize:13,marginRight:2}},'\u2212'+fmt(t.amount)),
              h('button',{onClick:()=>setEditing({ym:t.ym,txn:t}),style:{border:'none',background:C.card2,color:C.text2,borderRadius:9,width:30,height:30,fontSize:13,cursor:'pointer',flexShrink:0}},'\u270F\uFE0F')
            )
          );
        })

      h('div',{style:{fontSize:10.5,color:C.text3,fontWeight:600,textAlign:'center',marginTop:6}},'\u2190 Swipe a row to delete')
    ),
    editing&&h(Sheet,{onClose:()=>setEditing(null)},
      h(EditTxnSheet,{data,ym:editing.ym,txn:editing.txn,onClose:()=>setEditing(null),
