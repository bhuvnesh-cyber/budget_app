<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Spend Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0D1117;
  --s1: #161B22;
  --s2: #1C2230;
  --s3: #212736;
  --bd: #2D3548;
  --bd2: #3D4A61;
  --tx: #E6EDF3;
  --m1: #8B949E;
  --m2: #555F6D;
  --acc: #3FB950;
  --acc2: #238636;
  --red: #F85149;
  --amb: #D29922;
  --blu: #58A6FF;
  --pur: #BC8CFF;
  --pnk: #FF7B72;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
  --r: 12px;
  --rs: 8px;
  --nav-h: 60px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: var(--sans); overflow-x: hidden; font-size: 14px; }
#root { display: flex; flex-direction: column; min-height: 100%; }

/* NAV */
.nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-b)); background: rgba(22,27,34,.97); backdrop-filter: blur(20px); border-top: 1px solid var(--bd); display: flex; align-items: stretch; z-index: 100; padding-bottom: var(--safe-b); }
.nb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--m2); font-family: var(--sans); font-size: .5rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: color .15s; padding: 0 2px; }
.nb.on { color: var(--acc); }
.nb svg { width: 20px; height: 20px; stroke-width: 1.8; fill: none; stroke: currentColor; }
.nb-dot { width: 16px; height: 2px; border-radius: 99px; background: var(--acc); margin-top: 1px; display: none; }
.nb.on .nb-dot { display: block; }

.page { flex: 1; padding: .75rem 1rem calc(var(--nav-h) + var(--safe-b) + 1rem); max-width: 520px; margin: 0 auto; width: 100%; }

/* CARDS */
.card { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); padding: .85rem 1rem; margin-bottom: .5rem; }
.card-title { font-size: .55rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--m1); margin-bottom: .6rem; display: flex; align-items: center; gap: .5rem; }
.card-title::after { content: ''; flex: 1; height: 1px; background: var(--bd); }

/* UPLOAD */
.upload-zone { border: 2px dashed var(--bd2); border-radius: var(--r); padding: 2rem 1rem; text-align: center; cursor: pointer; transition: all .2s; background: var(--s2); }
.upload-zone:hover, .upload-zone.drag { border-color: var(--acc); background: rgba(63,185,80,.06); }
.upload-zone input { display: none; }
.upload-icon { font-size: 2.2rem; margin-bottom: .5rem; }
.upload-title { font-size: .9rem; font-weight: 700; color: var(--tx); margin-bottom: .3rem; }
.upload-sub { font-size: .7rem; color: var(--m1); }
.upload-btn { display: inline-block; margin-top: .75rem; padding: .45rem 1.1rem; background: linear-gradient(135deg, #238636, #3FB950); color: #fff; border-radius: 99px; font-size: .72rem; font-weight: 700; cursor: pointer; }

/* STATS GRID */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-bottom: .45rem; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; margin-bottom: .45rem; }
.stat-card { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); padding: .7rem .85rem; }
.stat-lbl { font-size: .5rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--m1); margin-bottom: .3rem; }
.stat-val { font-family: var(--mono); font-size: 1.2rem; font-weight: 700; line-height: 1; }
.stat-sub { font-size: .6rem; color: var(--m2); margin-top: .25rem; font-family: var(--mono); }

/* HEAT COLOR based on amount */
.heat-0  { color: #3FB950; } /* <200 */
.heat-1  { color: #56C45A; }
.heat-2  { color: #8DC63F; }
.heat-3  { color: #B5C828; }
.heat-4  { color: #D4C520; }
.heat-5  { color: #D29922; } /* ~1000 */
.heat-6  { color: #D07B22; }
.heat-7  { color: #CC5F22; }
.heat-8  { color: #D04B30; }
.heat-9  { color: #F85149; } /* >3000 */

/* TRANSACTION ROWS */
.txn-list { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); overflow: hidden; margin-bottom: .5rem; }
.txn-row { display: flex; align-items: center; gap: .5rem; padding: .6rem .85rem; border-bottom: 1px solid var(--bd); transition: background .1s; }
.txn-row:last-child { border-bottom: none; }
.txn-row:hover { background: var(--s2); }
.txn-left { flex: 1; min-width: 0; }
.txn-date { font-size: .55rem; color: var(--m2); font-family: var(--mono); margin-bottom: 2px; }
.txn-receiver { font-size: .75rem; font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-note { font-size: .6rem; color: var(--m1); margin-top: 1px; }
.txn-right { text-align: right; flex-shrink: 0; }
.txn-amt { font-family: var(--mono); font-weight: 700; font-size: .85rem; }
.txn-tag { margin-top: 3px; }

/* TAG PILL */
.tag-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px; font-size: .52rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border: 1px solid; }
.tag-rent     { background: rgba(88,166,255,.12); border-color: rgba(88,166,255,.3); color: #58A6FF; }
.tag-family   { background: rgba(188,140,255,.12); border-color: rgba(188,140,255,.3); color: #BC8CFF; }
.tag-savings  { background: rgba(63,185,80,.12); border-color: rgba(63,185,80,.3); color: #3FB950; }
.tag-vegetable{ background: rgba(86,196,90,.15); border-color: rgba(86,196,90,.3); color: #56C45A; }
.tag-uber     { background: rgba(248,81,73,.12); border-color: rgba(248,81,73,.3); color: #F85149; }
.tag-credit   { background: rgba(210,153,34,.12); border-color: rgba(210,153,34,.3); color: #D29922; }
.tag-sbi      { background: rgba(88,166,255,.1); border-color: rgba(88,166,255,.25); color: #79b8ff; }
.tag-cash     { background: rgba(63,185,80,.08); border-color: rgba(63,185,80,.2); color: #7ee787; }
.tag-untagged { background: rgba(139,148,158,.1); border-color: rgba(139,148,158,.25); color: #8B949E; }

/* TAG SELECTOR */
.tag-select { background: var(--s3); border: 1px solid var(--bd2); border-radius: var(--rs); color: var(--tx); font-size: .65rem; font-family: var(--sans); padding: 3px 6px; outline: none; cursor: pointer; }
.tag-select option { background: var(--s2); }

/* BARS */
.bar-wrap { background: var(--s3); border-radius: 99px; height: 3px; margin-top: 5px; overflow: hidden; }
.bar-fill { height: 3px; border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

/* CATEGORY TOTALS */
.cat-row { display: flex; align-items: center; gap: .5rem; padding: .55rem 0; border-bottom: 1px solid var(--bd); }
.cat-row:last-child { border-bottom: none; }
.cat-icon { font-size: 1rem; width: 28px; text-align: center; flex-shrink: 0; }
.cat-name { flex: 1; font-size: .78rem; font-weight: 600; }
.cat-count { font-size: .58rem; color: var(--m2); font-family: var(--mono); }
.cat-amt { font-family: var(--mono); font-weight: 700; font-size: .88rem; }

/* INSIGHTS */
.ins-row { display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid var(--bd); }
.ins-row:last-child { border-bottom: none; }
.ins-lbl { font-size: .72rem; color: var(--m1); font-weight: 500; }
.ins-val { font-family: var(--mono); font-weight: 700; font-size: .8rem; }

/* NOTE */
.note { display: flex; align-items: center; gap: 8px; padding: .45rem .8rem; border-radius: var(--rs); font-size: .68rem; font-weight: 600; margin-bottom: .5rem; border-left: 3px solid; }
.note-green { background: rgba(63,185,80,.08); border-color: #3FB950; color: #3FB950; }
.note-blue  { background: rgba(88,166,255,.08); border-color: #58A6FF; color: #58A6FF; }
.note-amb   { background: rgba(210,153,34,.08); border-color: #D29922; color: #D29922; }

/* INPUT */
input[type=number] { background: var(--s2); border: 1.5px solid var(--bd); color: var(--tx); border-radius: var(--rs); font-family: var(--mono); font-size: .85rem; font-weight: 500; padding: .5rem .75rem; outline: none; width: 100%; -moz-appearance: textfield; transition: border-color .15s; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
input:focus { border-color: var(--acc); }

/* BTN */
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: .65rem 1rem; border-radius: var(--rs); border: none; cursor: pointer; font-family: var(--sans); font-weight: 700; font-size: .8rem; transition: all .12s; width: 100%; margin-bottom: .5rem; }
.btn-pri { background: linear-gradient(135deg, #238636, #3FB950); color: #fff; }
.btn-sec { background: var(--s2); border: 1px solid var(--bd); color: var(--m1); }

/* WEEK BADGE */
.week-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 99px; font-size: .52rem; font-weight: 700; background: rgba(88,166,255,.12); border: 1px solid rgba(88,166,255,.25); color: #58A6FF; }

/* HEADER */
.page-header { padding: .75rem 0 .6rem; display: flex; align-items: baseline; justify-content: space-between; }
.page-title { font-size: 1.05rem; font-weight: 800; }
.page-sub { font-size: .58rem; color: var(--m2); font-family: var(--mono); }

/* SECTION HEAD */
.sh { font-size: .52rem; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); font-weight: 800; margin: 1.2rem 0 .55rem; display: flex; align-items: center; gap: .5rem; }
.sh::after { content: ''; flex: 1; height: 1px; background: var(--bd); }

/* EMPTY */
.empty { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; text-align: center; gap: .5rem; background: var(--s1); border: 1px dashed var(--bd2); border-radius: var(--r); }
.empty-icon { font-size: 2rem; }
.empty-title { font-size: .85rem; font-weight: 700; color: var(--m1); }
.empty-body { font-size: .68rem; color: var(--m2); max-width: 200px; line-height: 1.5; }

/* HERO BALANCE */
.hero-bal { border-radius: var(--r); padding: 1rem; margin-bottom: .5rem; background: linear-gradient(135deg, rgba(63,185,80,.12), rgba(35,134,54,.08)); border: 1px solid rgba(63,185,80,.25); }
.hero-lbl { font-size: .52rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #3FB950; margin-bottom: .25rem; }
.hero-amt { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: #3FB950; line-height: 1; }
.hero-sub { font-size: .62rem; color: rgba(63,185,80,.7); margin-top: .3rem; font-family: var(--mono); }

/* TAB BAR */
.tab-bar { display: flex; background: var(--s2); border-radius: 10px; padding: 3px; margin-bottom: .75rem; gap: 2px; border: 1px solid var(--bd); }
.tab { flex: 1; padding: .35rem .4rem; border: none; border-radius: 7px; cursor: pointer; font-family: var(--sans); font-size: .55rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--m2); background: transparent; transition: all .15s; }
.tab.on { color: var(--acc); background: var(--s3); }

.toast { position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 10px); left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#238636,#3FB950); color: #fff; padding: .45rem 1.2rem; border-radius: 99px; font-size: .7rem; font-weight: 700; z-index: 200; animation: fu .18s ease; white-space: nowrap; }
@keyframes fu { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

.chip { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 99px; font-size: .5rem; font-weight: 700; font-family: var(--mono); }
.chip-w { background: rgba(88,166,255,.15); color: #58A6FF; }
.chip-we { background: rgba(210,153,34,.15); color: #D29922; }

/* BALANCE PREDICTION WATERFALL */
.wf-row { display: flex; justify-content: space-between; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--bd); }
.wf-row:last-child { border-bottom: none; }
.wf-lbl { font-size: .7rem; color: var(--m1); }
.wf-val { font-family: var(--mono); font-size: .75rem; font-weight: 600; }

.big-num { font-family: var(--mono); font-weight: 700; }

@media (max-width: 380px) {
  .g3 { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { createElement: h, useState, useEffect, useCallback, useRef, useMemo } = React;

// ── CONSTANTS ────────────────────────────────────────────────────
const ALL_TAGS = ['rent','family','savings','vegetable','uber','credit','sbi','cash','untagged'];
const TAG_LABELS = { rent:'🏠 Rent', family:'👨‍👩‍👧 Family', savings:'💰 Savings', vegetable:'🥦 Vegetable', uber:'🚗 Uber', credit:'💳 Credit', sbi:'💳 SBI', cash:'💵 Cash', untagged:'❓ Untagged' };
const TAG_COLORS = { rent:'#58A6FF', family:'#BC8CFF', savings:'#3FB950', vegetable:'#56C45A', uber:'#F85149', credit:'#D29922', sbi:'#79b8ff', cash:'#7ee787', untagged:'#8B949E' };

const SALARY = 102844;

// ── HELPERS ──────────────────────────────────────────────────────
function fmt(n) { return '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN'); }
function fmtK(n) { return n >= 1000 ? '₹' + (n/1000).toFixed(1) + 'k' : '₹' + Math.round(n); }

function heatClass(amt) {
  if (amt < 100) return 'heat-0';
  if (amt < 200) return 'heat-1';
  if (amt < 400) return 'heat-2';
  if (amt < 600) return 'heat-3';
  if (amt < 800) return 'heat-4';
  if (amt < 1200) return 'heat-5';
  if (amt < 2000) return 'heat-6';
  if (amt < 3000) return 'heat-7';
  if (amt < 5000) return 'heat-8';
  return 'heat-9';
}

function heatColor(amt) {
  const classes = ['#3FB950','#56C45A','#8DC63F','#B5C828','#D4C520','#D29922','#D07B22','#CC5F22','#D04B30','#F85149'];
  if (amt < 100) return classes[0];
  if (amt < 200) return classes[1];
  if (amt < 400) return classes[2];
  if (amt < 600) return classes[3];
  if (amt < 800) return classes[4];
  if (amt < 1200) return classes[5];
  if (amt < 2000) return classes[6];
  if (amt < 3000) return classes[7];
  if (amt < 5000) return classes[8];
  return classes[9];
}

function parseDate(str) {
  // DD/MM/YYYY
  const [d, m, y] = str.split('/');
  return new Date(+y, +m - 1, +d);
}

function getWeekNumber(date) {
  const d = new Date(date);
  const firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
  return Math.ceil((d.getDate() + firstDay.getDay()) / 7);
}

function isWeekend(date) {
  const day = date.getDay(); // 0=Sun, 6=Sat
  return day === 0 || day === 6;
}

// Auto-tagger
function autoTag(txn) {
  const recv = (txn.receiver || '').toUpperCase();
  const date = parseDate(txn.date);
  const [hStr, mStr] = txn.time.split(':');
  const hour = parseInt(hStr);
  const min = parseInt(mStr);
  const totalMin = hour * 60 + min;
  const day = date.getDay(); // 0=Sun

  // ANKA → rent
  if (recv.includes('ANKA')) return 'rent';
  // UMAR → family
  if (recv.includes('UMAR')) return 'family';
  // UBEY → savings
  if (recv.includes('UBEY')) return 'savings';
  // Sunday 5:30–7pm → vegetable
  if (day === 0 && totalMin >= 17*60+30 && totalMin <= 19*60) return 'vegetable';
  // Weekdays 8:50–9:40am or 6:10–7:30pm → uber
  const isWeekday = day >= 1 && day <= 5;
  if (isWeekday && ((totalMin >= 8*60+50 && totalMin <= 9*60+40) || (totalMin >= 18*60+10 && totalMin <= 19*60+30))) return 'uber';

  return 'untagged';
}

// ── PARSER ───────────────────────────────────────────────────────
function parseHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const rows = doc.querySelectorAll('table tr');
  const txns = [];
  let first = true;
  rows.forEach(row => {
    if (first) { first = false; return; }
    const cells = row.querySelectorAll('td,th');
    if (cells.length < 11) return;
    const cols = Array.from(cells).map(c => c.innerText.trim());
    const [date, time, bank, acct, sender, receiver, ref, payCollect, amount, drCr, status] = cols;
    if (!date || drCr !== 'DR' || status !== 'SUCCESS') return;
    txns.push({ date, time, bank, acct, sender, receiver, ref, payCollect, amount: parseFloat(amount)||0, drCr, status });
  });

  // Dedup by ref
  const seen = new Set();
  const deduped = [];
  for (const t of txns) {
    if (!seen.has(t.ref)) { seen.add(t.ref); deduped.push(t); }
  }

  // Add id, auto-tag
  return deduped.map((t, i) => ({ ...t, id: i, tag: autoTag(t) }));
}

// ── COMPONENTS ───────────────────────────────────────────────────
function Toast({ msg }) {
  if (!msg) return null;
  return h('div', { className: 'toast' }, msg);
}

function TagPill({ tag, onClick }) {
  return h('span', { className: `tag-pill tag-${tag}`, onClick }, TAG_LABELS[tag] || tag);
}

function TagSelect({ value, onChange }) {
  return h('select', {
    className: 'tag-select',
    value,
    onChange: e => onChange(e.target.value)
  }, ALL_TAGS.map(t => h('option', { key: t, value: t }, TAG_LABELS[t])));
}

// ── UPLOAD PAGE ───────────────────────────────────────────────────
function UploadPage({ onLoad }) {
  const [drag, setDrag] = useState(false);
  const inputRef = useRef();

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const txns = parseHTML(e.target.result);
      onLoad(txns);
    };
    reader.readAsText(file);
  }

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', { className: 'page-title' }, 'Spend Analyzer'),
      h('div', { className: 'page-sub' }, 'Upload your transaction history')
    ),
    h('div', {
      className: `upload-zone${drag ? ' drag' : ''}`,
      onClick: () => inputRef.current.click(),
      onDragOver: e => { e.preventDefault(); setDrag(true); },
      onDragLeave: () => setDrag(false),
      onDrop: e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }
    },
      h('input', { ref: inputRef, type: 'file', accept: '.html,.htm', onChange: e => handleFile(e.target.files[0]) }),
      h('div', { className: 'upload-icon' }, '📂'),
      h('div', { className: 'upload-title' }, 'Drop your transaction HTML'),
      h('div', { className: 'upload-sub' }, 'Same format as TransactionHistory from YES Bank UPI'),
      h('span', { className: 'upload-btn' }, 'Choose File')
    ),
    h('div', { className: 'sh', style: { marginTop: '1.5rem' } }, 'What happens'),
    h('div', { className: 'card' },
      ['Duplicates are removed automatically', 'ANKA → Rent, UMAR → Family, UBEY → Savings', 'Sunday 5:30–7pm → Vegetable', 'Weekday morning/evening → Uber', 'You manually tag anything left as Untagged'].map((t, i) =>
        h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: '.5rem', padding: '.35rem 0', borderBottom: i < 4 ? '1px solid var(--bd)' : 'none' } },
          h('span', { style: { color: '#3FB950', fontSize: '.75rem' } }, '✓'),
          h('span', { style: { fontSize: '.72rem', color: 'var(--m1)' } }, t)
        )
      )
    )
  );
}

// ── OVERVIEW PAGE ─────────────────────────────────────────────────
function OverviewPage({ txns, cashSpend, salary }) {
  const total = txns.reduce((a, t) => a + t.amount, 0);
  const byTag = {};
  ALL_TAGS.forEach(tag => { byTag[tag] = { total: 0, count: 0 }; });
  txns.forEach(t => {
    byTag[t.tag].total += t.amount;
    byTag[t.tag].count++;
  });

  const creditSpent = (byTag['credit']?.total || 0) + (byTag['sbi']?.total || 0);
  const cashTotal = (byTag['cash']?.total || 0) + cashSpend;
  const untagged = byTag['untagged']?.total || 0;

  // Week breakdown
  const weekMap = {};
  txns.forEach(t => {
    const date = parseDate(t.date);
    const wn = getWeekNumber(date);
    const we = isWeekend(date);
    const key = `W${wn}`;
    if (!weekMap[key]) weekMap[key] = { weekday: 0, weekend: 0, total: 0 };
    if (we) weekMap[key].weekend += t.amount;
    else weekMap[key].weekday += t.amount;
    weekMap[key].total += t.amount;
  });
  const weeks = Object.entries(weekMap).sort((a, b) => a[0].localeCompare(b[0]));

  const days = new Set(txns.map(t => t.date)).size || 1;
  const avgPerDay = total / days;
  const avgPerWeek = weeks.length ? total / weeks.length : 0;

  // Balance prediction
  const predictedBalance = salary - total - cashSpend;

// ── TAG PAGE ──────────────────────────────────────────────────────
function TagPage({ txns, onTagChange }) {
  const [tab, setTab] = useState('untagged');
  const [search, setSearch] = useState('');

  const untagged = txns.filter(t => t.tag === 'untagged');
  const filtered = tab === 'untagged'
    ? untagged
    : txns.filter(t => t.tag === tab);

  const searched = search
    ? filtered.filter(t => t.receiver.toLowerCase().includes(search.toLowerCase()) || t.date.includes(search))
    : filtered;

  const byTag = {};
  ALL_TAGS.forEach(tag => { byTag[tag] = txns.filter(t => t.tag === tag).length; });

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Tag'),
        h('div', { className: 'page-sub' }, untagged.length + ' untagged left')
      )
    ),

    untagged.length === 0
      ? h('div', { className: 'note note-green' }, '✓ All transactions tagged!')
      : h('div', { className: 'note note-amb' }, '⚠ ' + untagged.length + ' transactions need tagging'),

    // Quick filter tabs
    h('div', { className: 'tab-bar' },
      ['untagged', 'all'].concat(ALL_TAGS.filter(t => t !== 'untagged' && byTag[t] > 0)).slice(0, 6).map(t =>
        h('button', { key: t, className: `tab${tab === t ? ' on' : ''}`, onClick: () => setTab(t) },
          t === 'all' ? 'All' : t === 'untagged' ? `❓ ${byTag.untagged}` : t
        )
      )
    ),

    // Search
    h('input', {
      type: 'text',
      placeholder: 'Search receiver or date…',
      value: search,
      onChange: e => setSearch(e.target.value),
      style: { background: 'var(--s2)', border: '1px solid var(--bd)', color: 'var(--tx)', borderRadius: 'var(--rs)', padding: '.45rem .75rem', fontSize: '.72rem', width: '100%', marginBottom: '.5rem', outline: 'none', fontFamily: 'var(--sans)' }
    }),

    searched.length === 0
      ? h('div', { className: 'empty' },
          h('div', { className: 'empty-icon' }, '🎉'),
          h('div', { className: 'empty-title' }, tab === 'untagged' ? 'All tagged!' : 'None here'),
          h('div', { className: 'empty-body' }, tab === 'untagged' ? 'Every transaction has been tagged.' : 'No transactions in this category.')
        )
      : h('div', { className: 'txn-list' },
        searched.map(txn =>
          h('div', { key: txn.id, className: 'txn-row' },
            h('div', { className: 'txn-left' },
              h('div', { className: 'txn-date' }, txn.date + ' ' + txn.time),
              h('div', { className: 'txn-receiver' }, txn.receiver.replace(/x+/gi, '…')),
              h('div', { className: 'txn-tag' },
                h(TagSelect, { value: txn.tag, onChange: tag => onTagChange(txn.id, tag) })
              )
            ),
            h('div', { className: 'txn-right' },
              h('div', { className: `txn-amt ${heatClass(txn.amount)}` }, fmt(txn.amount))
            )
          )
        )
      )
  );
}

// ── INSIGHTS PAGE ─────────────────────────────────────────────────
function InsightsPage({ txns }) {
  const total = txns.reduce((a, t) => a + t.amount, 0);

  // Days of week breakdown
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const byDow = Array(7).fill(0);
  const byDowCount = Array(7).fill(0);
  txns.forEach(t => {
    const d = parseDate(t.date).getDay();
    byDow[d] += t.amount;
    byDowCount[d]++;
  });
  const maxDow = Math.max(...byDow) || 1;

  // Hour breakdown
  const byHour = Array(24).fill(0);
  txns.forEach(t => {
    const h = parseInt(t.time.split(':')[0]);
    byHour[h] += t.amount;
  });
  const maxHour = Math.max(...byHour) || 1;
  const peakHour = byHour.indexOf(maxHour);

  // Top receivers
  const recvMap = {};
  txns.forEach(t => {
    const key = t.receiver.replace(/x+/gi, '…');
    recvMap[key] = (recvMap[key] || 0) + t.amount;
  });
  const topReceivers = Object.entries(recvMap).sort((a, b) => b[1] - a[1]).slice(0, 7);

  // Weekend vs weekday
  let weekendTotal = 0, weekdayTotal = 0, weekendCount = 0, weekdayCount = 0;
  txns.forEach(t => {
    const d = parseDate(t.date);
    if (isWeekend(d)) { weekendTotal += t.amount; weekendCount++; }
    else { weekdayTotal += t.amount; weekdayCount++; }
  });

  const days = new Set(txns.map(t => t.date)).size || 1;
  const weekDays = new Set(txns.filter(t => !isWeekend(parseDate(t.date))).map(t => t.date)).size || 1;
  const weekendDays = new Set(txns.filter(t => isWeekend(parseDate(t.date))).map(t => t.date)).size || 1;

  // Biggest single day
  const dayMap = {};
  txns.forEach(t => { dayMap[t.date] = (dayMap[t.date] || 0) + t.amount; });
  const biggestDay = Object.entries(dayMap).sort((a, b) => b[1] - a[1])[0];

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Insights'),
        h('div', { className: 'page-sub' }, 'Patterns & analytics')
      )
    ),

    // Weekend vs weekday
    h('div', { className: 'sh' }, 'Weekend vs Weekday'),
    h('div', { className: 'g2' },
      h('div', { className: 'stat-card', style: { borderTop: '2px solid #D29922' } },
        h('div', { className: 'stat-lbl' }, '☀ Weekend'),
        h('div', { className: `stat-val ${heatClass(weekendTotal)}` }, fmtK(weekendTotal)),
        h('div', { className: 'stat-sub' }, fmt(weekendTotal/weekendDays) + '/day')
      ),
      h('div', { className: 'stat-card', style: { borderTop: '2px solid #58A6FF' } },
        h('div', { className: 'stat-lbl' }, '💼 Weekday'),
        h('div', { className: `stat-val ${heatClass(weekdayTotal)}` }, fmtK(weekdayTotal)),
        h('div', { className: 'stat-sub' }, fmt(weekdayTotal/weekDays) + '/day')
      )
    ),

    h('div', { className: 'card' },
      h('div', { className: 'ins-row' },
        h('span', { className: 'ins-lbl' }, '📅 Total days'),
        h('span', { className: 'ins-val' }, days + ' days')
      ),
      h('div', { className: 'ins-row' },
        h('span', { className: 'ins-lbl' }, '📊 Avg per day'),
        h('span', { className: `ins-val ${heatClass(total/days)}` }, fmt(total/days))
      ),
      h('div', { className: 'ins-row' },
        h('span', { className: 'ins-lbl' }, '🔥 Biggest day'),
        biggestDay ? h('span', { className: `ins-val ${heatClass(biggestDay[1])}` }, biggestDay[0] + ' · ' + fmt(biggestDay[1])) : h('span', { className: 'ins-val' }, '—')
      ),
      h('div', { className: 'ins-row' },
        h('span', { className: 'ins-lbl' }, '⏰ Peak hour'),
        h('span', { className: 'ins-val', style: { color: '#BC8CFF' } }, peakHour + ':00 – ' + (peakHour+1) + ':00')
      ),
      h('div', { className: 'ins-row' },
        h('span', { className: 'ins-lbl' }, '💸 Total transactions'),
        h('span', { className: 'ins-val' }, txns.length)
      )
    ),

    // Day of week heatmap
    h('div', { className: 'sh' }, 'Spend by Day of Week'),
    h('div', { className: 'card' },
      byDow.map((amt, i) =>
        h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: '.6rem', padding: '.35rem 0', borderBottom: i < 6 ? '1px solid var(--bd)' : 'none' } },
          h('span', { style: { width: '28px', fontSize: '.65rem', color: 'var(--m1)', fontWeight: 700 } }, dayNames[i]),
          h('div', { style: { flex: 1, background: 'var(--s3)', borderRadius: '99px', height: '6px', overflow: 'hidden' } },
            h('div', { style: { width: (amt / maxDow * 100) + '%', height: '6px', background: heatColor(amt / (byDowCount[i]||1)), borderRadius: '99px', transition: 'width .5s' } })
          ),
          h('span', { style: { fontFamily: 'var(--mono)', fontSize: '.65rem', fontWeight: 700, color: heatColor(amt / (byDowCount[i]||1)), minWidth: '48px', textAlign: 'right' } }, amt > 0 ? fmtK(amt) : '—')
        )
      )
    ),

    // Top receivers
    h('div', { className: 'sh' }, 'Top Receivers'),
    h('div', { className: 'txn-list' },
      topReceivers.map(([recv, amt], i) =>
        h('div', { key: i, className: 'txn-row' },
          h('div', { className: 'txn-left' },
            h('div', { className: 'txn-receiver' }, recv),
            h('div', { className: 'bar-wrap' },
              h('div', { className: 'bar-fill', style: { width: Math.min(100, amt/topReceivers[0][1]*100) + '%', background: heatColor(amt) } })
            )
          ),
          h('div', { className: `txn-amt ${heatClass(amt)}` }, fmt(amt))
        )
      )
    )
  );
}

// ── APP ───────────────────────────────────────────────────────────
function App() {
  const [txns, setTxns] = useState([]);
  const [page, setPage] = useState('upload');
  const [toast, setToast] = useState('');
  const [cashSpend, setCashSpend] = useState(0);
  const toastTimer = useRef();
  const SALARY = 102844;

  function showToast(msg) {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2200);
  }

  function handleLoad(parsedTxns) {
    setTxns(parsedTxns);
    setPage('overview');
    showToast(`Loaded ${parsedTxns.length} transactions ✓`);
  }

  function handleTagChange(id, tag) {
    setTxns(prev => prev.map(t => t.id === id ? { ...t, tag } : t));
  }

  const hasData = txns.length > 0;
  const untaggedCount = txns.filter(t => t.tag === 'untagged').length;

  const navItems = [
    { id: 'upload',   label: 'Upload',   icon: '📂' },
    { id: 'overview', label: 'Overview', icon: '📊' },
    { id: 'tag',      label: untaggedCount > 0 ? `Tag (${untaggedCount})` : 'Tag', icon: '🏷️' },
    { id: 'insights', label: 'Insights', icon: '💡' },
    { id: 'cash',     label: 'Cash',     icon: '💵' },
  ];

  function navIcon(id) {
    if (id === 'upload') return h('svg', { viewBox: '0 0 24 24' }, h('path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }), h('polyline', { points: '17 8 12 3 7 8' }), h('line', { x1: 12, y1: 3, x2: 12, y2: 15 }));
    if (id === 'overview') return h('svg', { viewBox: '0 0 24 24' }, h('rect', { x: 3, y: 3, width: 7, height: 7, rx: 1 }), h('rect', { x: 14, y: 3, width: 7, height: 7, rx: 1 }), h('rect', { x: 3, y: 14, width: 7, height: 7, rx: 1 }), h('rect', { x: 14, y: 14, width: 7, height: 7, rx: 1 }));
    if (id === 'tag') return h('svg', { viewBox: '0 0 24 24' }, h('path', { d: 'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z' }), h('line', { x1: 7, y1: 7, x2: 7.01, y2: 7 }));
    if (id === 'insights') return h('svg', { viewBox: '0 0 24 24' }, h('polyline', { points: '22 12 18 12 15 21 9 3 6 12 2 12' }));
    if (id === 'cash') return h('svg', { viewBox: '0 0 24 24' }, h('rect', { x: 2, y: 5, width: 20, height: 14, rx: 2 }), h('line', { x1: 2, y1: 10, x2: 22, y2: 10 }));
  }

  return h('div', null,
    page === 'upload'   && h(UploadPage, { onLoad: handleLoad }),
    page === 'overview' && h(OverviewPage, { txns, cashSpend, salary: SALARY }),
    page === 'tag'      && h(TagPage, { txns, onTagChange: handleTagChange }),
    page === 'insights' && h(InsightsPage, { txns }),
    page === 'cash'     && h(CashPage, { cashSpend, onCashChange: setCashSpend, salary: SALARY, txns }),

    // If no data and not on upload, show prompt
    !hasData && page !== 'upload' && h('div', { style: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(13,17,23,.9)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50 } },
      h('div', { className: 'card', style: { maxWidth: '280px', textAlign: 'center', margin: '1rem' } },
        h('div', { style: { fontSize: '2rem', marginBottom: '.5rem' } }, '📂'),
        h('div', { style: { fontWeight: 700, marginBottom: '.5rem' } }, 'No data yet'),
        h('div', { style: { fontSize: '.72rem', color: 'var(--m2)', marginBottom: '.75rem' } }, 'Upload your transaction HTML first'),
        h('button', { className: 'btn btn-pri', onClick: () => setPage('upload') }, 'Go to Upload')
      )
    ),

    h('nav', { className: 'nav' },
      navItems.map(n =>
        h('button', { key: n.id, className: `nb${page === n.id ? ' on' : ''}`, onClick: () => setPage(n.id) },
          navIcon(n.id),
          h('span', { style: { fontSize: '.48rem', fontWeight: 700 } }, n.label),
          h('span', { className: 'nb-dot' })
        )
      )
    ),
    h(Toast, { msg: toast })
  );
}
