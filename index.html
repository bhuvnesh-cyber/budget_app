<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Spend Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F0ECFF;--s0:#FFFFFF;--s1:#EAE4FF;--s2:#DDD6FF;
  --bd:#CAC0F0;--bd2:#B0A4E0;
  --tx:#1A0A3C;--m1:#4A3A72;--m2:#8C7EAE;
  --p1:#6D28D9;--p2:#7C3AED;--p3:#8B5CF6;--p4:#A78BFA;--p5:#EDE9FE;--p-dk:#4C1D95;
  --rose:#E11D48;--rose-lt:#FFF1F2;--rose-bd:#FECDD3;
  --grn:#059669;--grn-lt:#ECFDF5;--grn-bd:#A7F3D0;
  --amb:#B45309;--amb-lt:#FFFBEB;--amb-bd:#FDE68A;
  --sky:#0369A1;--sky-lt:#F0F9FF;--sky-bd:#BAE6FD;
  --pnk:#BE185D;--pnk-lt:#FDF2F8;--pnk-bd:#FBCFE8;
  --org:#C2410C;--org-lt:#FFF7ED;--org-bd:#FED7AA;
  --teal:#0F766E;--teal-lt:#F0FDFA;--teal-bd:#99F6E4;
  --mono:'JetBrains Mono',monospace;--sans:'Plus Jakarta Sans',sans-serif;
  --r:16px;--rs:10px;--nav-h:66px;--safe-b:env(safe-area-inset-bottom,0px);
  --sh:0 2px 10px rgba(109,40,217,.09),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 8px 32px rgba(109,40,217,.2),0 2px 8px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow-x:hidden;font-size:16px;line-height:1.5}
#root{display:flex;flex-direction:column;min-height:100%}
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:rgba(255,255,255,.98);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:2px solid var(--bd);display:flex;align-items:stretch;z-index:100;padding-bottom:var(--safe-b);box-shadow:0 -4px 28px rgba(109,40,217,.12)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--m2);font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:color .15s;padding:0}
.nb.on{color:var(--p2)}.nb svg{width:23px;height:23px;stroke-width:1.8;fill:none;stroke:currentColor}
.nb-pip{width:20px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p3));display:none;margin-top:1px}.nb.on .nb-pip{display:block}
.page{flex:1;padding:.6rem 1rem calc(var(--nav-h) + var(--safe-b) + 1.2rem);max-width:540px;margin:0 auto;width:100%}
.card{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:.55rem;box-shadow:var(--sh)}
.ph{padding:.75rem 0 .6rem;display:flex;align-items:baseline;justify-content:space-between}
.ph-title{font-size:1.45rem;font-weight:900;color:var(--tx);letter-spacing:-.03em}
.ph-sub{font-size:12px;color:var(--m2);font-family:var(--mono)}
.sh{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--p2);font-weight:900;margin:1.2rem 0 .55rem;display:flex;align-items:center;gap:.55rem}
.sh::after{content:'';flex:1;height:1.5px;background:linear-gradient(90deg,var(--bd),transparent)}
.hero{border-radius:var(--r);padding:1.25rem;margin-bottom:.55rem;border:1.5px solid;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;opacity:.1;background:currentColor;pointer-events:none}
.hero-lbl{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.22rem;opacity:.75}
.hero-amt{font-family:var(--mono);font-size:2.8rem;font-weight:700;line-height:1;letter-spacing:-.04em;margin-bottom:.35rem}
.hero-sub{font-size:12px;font-family:var(--mono);opacity:.75}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.55rem;margin-top:.8rem;padding-top:.65rem;border-top:1px solid currentColor;opacity:.9}
.hg-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.72;margin-bottom:.2rem;font-weight:800}
.hg-val{font-family:var(--mono);font-weight:700;font-size:1rem}
.hero-ok{background:linear-gradient(140deg,#ECFDF5,#D1FAE5);border-color:var(--grn-bd);color:#065F46}
.hero-warn{background:linear-gradient(140deg,#FFFBEB,#FEF3C7);border-color:var(--amb-bd);color:#78350F}
.hero-bad{background:linear-gradient(140deg,#FFF1F2,#FFE4E6);border-color:var(--rose-bd);color:#9F1239}
.hero-pur{background:linear-gradient(140deg,#F5F3FF,#EDE9FE);border-color:var(--p4);color:var(--p-dk)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.sc{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);padding:.8rem 1rem;box-shadow:var(--sh)}
.sc-lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--m2);margin-bottom:.28rem}
.sc-val{font-family:var(--mono);font-size:1.3rem;font-weight:700;line-height:1}
.sc-sub{font-size:11px;color:var(--m2);margin-top:.2rem;font-family:var(--mono)}
.sc-top{border-top:3px solid}
.h0{color:#6D28D9}.h1{color:#7C3AED}.h2{color:#059669}.h3{color:#0D9488}
.h4{color:#B45309}.h5{color:#D97706}.h6{color:#C2410C}.h7{color:#DC2626}
.h8{color:#B91C1C}.h9{color:#991B1B}
.bw{background:var(--s1);border-radius:99px;height:5px;margin-top:6px;overflow:hidden}
.bf{height:5px;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.note{display:flex;align-items:flex-start;gap:8px;padding:.55rem .9rem;border-radius:var(--rs);font-size:13px;font-weight:700;margin-bottom:.5rem;border-left:3.5px solid;line-height:1.4}
.n-pur{background:var(--p5);border-color:var(--p2);color:var(--p-dk)}
.n-grn{background:var(--grn-lt);border-color:var(--grn);color:#065F46}
.n-amb{background:var(--amb-lt);border-color:var(--amb);color:#78350F}
.n-red{background:var(--rose-lt);border-color:var(--rose);color:#9F1239}
.n-teal{background:var(--teal-lt);border-color:var(--teal);color:var(--teal)}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.04em;border:1.5px solid;white-space:nowrap}
.tag-rent{background:#EEF2FF;border-color:#C7D2FE;color:#3730A3}
.tag-electricity{background:var(--amb-lt);border-color:var(--amb-bd);color:var(--amb)}
.tag-family{background:var(--p5);border-color:var(--p4);color:var(--p-dk)}
.tag-savings{background:var(--grn-lt);border-color:var(--grn-bd);color:#065F46}
.tag-vegetable{background:#F0FDF4;border-color:#BBF7D0;color:#15803D}
.tag-uber{background:var(--rose-lt);border-color:var(--rose-bd);color:var(--rose)}
.tag-yescc{background:var(--amb-lt);border-color:var(--amb-bd);color:var(--amb)}
.tag-recharge{background:var(--sky-lt);border-color:var(--sky-bd);color:var(--sky)}
.tag-entertainment{background:var(--pnk-lt);border-color:var(--pnk-bd);color:var(--pnk)}
.tag-milk{background:var(--teal-lt);border-color:var(--teal-bd);color:var(--teal)}
.tag-petrol{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.tag-wifi{background:var(--sky-lt);border-color:var(--sky-bd);color:var(--sky)}
.tag-movies{background:var(--pnk-lt);border-color:var(--pnk-bd);color:var(--pnk)}
.tag-dining{background:var(--org-lt);border-color:var(--org-bd);color:var(--org)}
.tag-grocery{background:#F0FDF4;border-color:#86EFAC;color:#15803D}
.tag-amazon{background:var(--amb-lt);border-color:var(--amb-bd);color:var(--amb)}
.tag-other{background:var(--s1);border-color:var(--bd2);color:var(--m1)}
.tag-furniture{background:var(--org-lt);border-color:var(--org-bd);color:var(--org)}
.tag-bills{background:#F5F3FF;border-color:#DDD6FE;color:#5B21B6}
.tag-untagged{background:var(--s2);border-color:var(--bd2);color:var(--m2)}
input,select,textarea{width:100%;background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);border-radius:var(--rs);font-family:var(--sans);font-size:15px;font-weight:600;padding:.55rem .85rem;outline:none;transition:border-color .15s,box-shadow .15s;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--p3);box-shadow:0 0 0 3px rgba(139,92,246,.15);background:var(--s0)}
input::placeholder{color:var(--m2)}
label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--m1);display:block;margin-bottom:5px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:.7rem 1.1rem;border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--sans);font-weight:800;font-size:15px;transition:all .12s;width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-pri{background:linear-gradient(135deg,var(--p-dk),var(--p2));color:#fff;box-shadow:0 4px 16px rgba(109,40,217,.35)}
.btn-sec{background:var(--s0);border:1.5px solid var(--bd);color:var(--m1)}
.btn-red{background:var(--rose-lt);border:1.5px solid var(--rose-bd);color:var(--rose)}
.btn-sm{padding:.35rem .8rem;font-size:13px;width:auto}
.del-btn{background:none;border:none;color:var(--m2);cursor:pointer;padding:5px 7px;border-radius:7px;font-size:16px;transition:color .1s;flex-shrink:0}
.del-btn:hover{color:var(--rose)}
.upload-zone{border:2px dashed var(--bd2);border-radius:var(--r);padding:2.5rem 1.2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--s0)}
.upload-zone.drag,.upload-zone:hover{border-color:var(--p3);background:var(--p5)}
.upload-zone input{display:none}
.txn-list{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:.55rem;box-shadow:var(--sh)}
.txn-row{display:flex;align-items:flex-start;gap:.55rem;padding:.7rem 1rem;border-bottom:1px solid var(--bd);transition:background .1s}
.txn-row:last-child{border-bottom:none}.txn-row:hover{background:var(--s1)}
.txn-left{flex:1;min-width:0}
.txn-date{font-size:11px;color:var(--m2);font-family:var(--mono);margin-bottom:2px}
.txn-recv{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:4px}
.txn-sub{font-size:11px;color:var(--m2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amt{font-family:var(--mono);font-weight:700;font-size:15px}
.tag-sel{background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);border-radius:99px;font-family:var(--sans);font-size:11px;font-weight:800;padding:3px 10px;outline:none;cursor:pointer;width:auto}
.tag-sel:focus{border-color:var(--p3)}
.wf-row{display:flex;justify-content:space-between;align-items:center;padding:.48rem 0;border-bottom:1px solid var(--bd)}
.wf-row:last-child{border-bottom:none}
.wf-lbl{font-size:13px;color:var(--m1);font-weight:500}.wf-val{font-family:var(--mono);font-weight:700;font-size:13px}
.cat-row{display:flex;align-items:center;gap:.55rem;padding:.52rem 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-icon{font-size:1rem;width:26px;text-align:center;flex-shrink:0}
.cat-name{font-size:14px;font-weight:700}.cat-cnt{font-size:11px;color:var(--m2);font-family:var(--mono)}
.cat-amt{font-family:var(--mono);font-weight:700;font-size:14px}
.tab-bar{display:flex;background:var(--s1);border-radius:11px;padding:3px;margin-bottom:.7rem;gap:2px;border:1.5px solid var(--bd)}
.tab{flex:1;padding:.32rem .25rem;border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--m2);background:transparent;transition:all .15s;white-space:nowrap}
.tab.on{color:var(--p2);background:var(--s0);box-shadow:var(--sh)}
.ins-row{display:flex;justify-content:space-between;align-items:center;padding:.48rem 0;border-bottom:1px solid var(--bd)}
.ins-row:last-child{border-bottom:none}
.ins-lbl{font-size:13px;color:var(--m1);font-weight:500}.ins-val{font-family:var(--mono);font-weight:700;font-size:14px}
.empty{display:flex;flex-direction:column;align-items:center;padding:2.5rem 1rem;text-align:center;gap:.5rem;background:var(--s0);border:1.5px dashed var(--bd2);border-radius:var(--r)}
.empty-icon{font-size:2.5rem}.empty-title{font-size:1rem;font-weight:800;color:var(--m1)}
.empty-body{font-size:13px;color:var(--m2);max-width:230px;line-height:1.5}
.money-item{display:flex;align-items:center;gap:.5rem;padding:.52rem 0;border-bottom:1px solid var(--bd)}
.money-item:last-child{border-bottom:none}
.wknd-card{background:var(--s0);border:1.5px solid var(--pnk-bd);border-radius:var(--r);overflow:hidden;margin-bottom:.55rem;box-shadow:var(--sh)}
.wknd-head{display:flex;justify-content:space-between;align-items:center;padding:.65rem 1rem;background:linear-gradient(135deg,var(--pnk-lt),#FCE7F3);border-bottom:1px solid var(--pnk-bd)}
.wknd-day{display:flex;justify-content:space-between;align-items:center;padding:.45rem 1rem;border-bottom:1px solid var(--bd)}
.wknd-day:last-child{border-bottom:none}
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--p-dk),var(--p2));color:#fff;padding:.45rem 1.3rem;border-radius:99px;font-size:13px;font-weight:800;z-index:200;animation:fu .18s ease;white-space:nowrap;box-shadow:0 4px 24px rgba(109,40,217,.4)}
@keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.welcome-card{background:linear-gradient(135deg,var(--p1),var(--p3));border-radius:var(--r);color:#fff;padding:1.2rem;margin-bottom:.7rem;box-shadow:var(--sh2);position:relative;overflow:hidden}
.welcome-card::after{content:'💸';position:absolute;right:.75rem;top:50%;transform:translateY(-50%);font-size:3rem;opacity:.18}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;background:var(--p5);color:var(--p2);border:1px solid var(--p4);margin-left:5px}
hr{border:none;border-top:1px solid var(--bd);margin:.6rem 0}
.row{display:flex;align-items:center;gap:.5rem}.f1{flex:1}.mb{margin-bottom:.55rem}
@media(max-width:380px){.g3{grid-template-columns:1fr 1fr}.ph-title{font-size:1.2rem}}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const{createElement:h,useState,useEffect,useRef,useMemo,useCallback}=React;

// ── STORAGE ───────────────────────────────────────────────────────────────
const LS={RAW:'sa_raw_v6',TAGS:'sa_tags_v6',SET:'sa_set_v6',MAN:'sa_man_v6'};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

// ── TAGS ──────────────────────────────────────────────────────────────────
const TAGS=['rent','electricity','family','savings','milk','vegetable','uber','yescc',
            'recharge','entertainment','petrol','wifi','movies','dining','grocery',
            'amazon','furniture','bills','other','untagged'];
const TM={
  rent:         {icon:'🏠',label:'Rent'},
  electricity:  {icon:'⚡',label:'Electricity'},
  family:       {icon:'👨‍👩‍👧',label:'Family'},
  savings:      {icon:'💰',label:'Savings'},
  milk:         {icon:'🥛',label:'Milk / Provi'},
  vegetable:    {icon:'🥦',label:'Vegetable'},
  uber:         {icon:'🚗',label:'Uber'},
  yescc:        {icon:'💳',label:'YES CC'},
  recharge:     {icon:'📱',label:'Recharge'},
  entertainment:{icon:'🎉',label:'Mall / Fun'},
  petrol:       {icon:'⛽',label:'Petrol'},
  wifi:         {icon:'📶',label:'WiFi / Internet'},
  movies:       {icon:'🎬',label:'Movies'},
  dining:       {icon:'🌯',label:'Dining Out'},
  grocery:      {icon:'🛒',label:'Grocery'},
  amazon:       {icon:'📦',label:'Amazon'},
  furniture:    {icon:'🪑',label:'Furniture Rent'},
  bills:        {icon:'📋',label:'Bills'},
  other:        {icon:'🧾',label:'Other'},
  untagged:     {icon:'❓',label:'Untagged'},
};

const HEAT_T=[100,250,500,900,1500,2500,4000,6000,12000];
const HEAT_C=['#6D28D9','#7C3AED','#059669','#0D9488','#B45309','#D97706','#C2410C','#DC2626','#B91C1C','#991B1B'];
const heatCls=n=>{const i=HEAT_T.findIndex(t=>n<t);return'h'+(i<0?9:i)};
const heatHex=n=>{const i=HEAT_T.findIndex(t=>n<t);return HEAT_C[i<0?9:i]};

const fmt=n=>'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const fmtK=n=>n>=1000?'₹'+(n/1000).toFixed(1)+'k':'₹'+Math.round(n);
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;

function parseDate(s){
  // DD-Mon-YYYY → Date
  const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const m=s.match(/(\d{2})-([A-Za-z]{3})-(\d{4})/);
  if(m) return new Date(+m[3],MONTHS[m[2]],+m[1]);
  // YYYY-MM-DD
  const m2=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return new Date(+m2[1],+m2[2]-1,+m2[3]);
  return new Date(s);
}
function dateToStr(d){
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function isWeekend(d){const w=d.getDay();return w===0||w===6}
function weekOfMonth(d){const f=new Date(d.getFullYear(),d.getMonth(),1);return Math.ceil((d.getDate()+f.getDay())/7)}

// ── PDF PARSER ────────────────────────────────────────────────────────────
// Parses YES Bank statement PDF text extracted by pdf.js
function parsePDFText(fullText){
  const lines=fullText.split('\n').map(l=>l.trim()).filter(Boolean);
  const DATE_RE=/^(\d{2}-[A-Za-z]{3}-\d{4})\s+\d{2}-[A-Za-z]{3}-\d{4}\s+(\S+)\s+(.*?)\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})$/;
  const SKIP=['Customer Id','Primary Holder','Transaction Date','Page ','Running','Nominee','Opening Balance','*Please','Mandatory','Closing','OD Limit','Have you','To redeem','ATW/','AFD/','R-','Primary Account','Account Variant','Nominee Details'];

  const txns=[];
  let prevBalance=null;
  let salaryDate=null;
  let salaryAmount=0;
  let atmCash=0;

  // Find salary credit (NEFT from employer)
  for(let i=0;i<lines.length;i++){
    if(lines[i].includes('NEFT Cr') && (lines[i].includes('DVARA')||lines[i+1]?.includes('DVARA'))){
      // Next line has the transaction row
      for(let j=i;j<Math.min(i+3,lines.length);j++){
        const m=DATE_RE.exec(lines[j]);
        if(m){
          const bal=parseFloat(m[5].replace(',',''));
          const prevBal=j>0?null:null;
          // This is a credit - amount is in the bigger column
          const amt=parseFloat(m[4].replace(',',''));
          salaryAmount=amt>10000?amt:salaryAmount;
          salaryDate=m[1];
          break;
        }
      }
    }
    // ATM withdrawal
    if(lines[i].match(/ATD:|ATM WITHDRAWAL|615409554420/)){
      for(let j=Math.max(0,i-1);j<Math.min(i+3,lines.length);j++){
        const m=DATE_RE.exec(lines[j]);
        if(m){atmCash+=parseFloat(m[4].replace(',',''));break;}
      }
    }
  }

  for(let i=0;i<lines.length;i++){
    const m=DATE_RE.exec(lines[i]);
    if(!m) continue;

    const dateStr=m[1];
    const ref=m[2];
    const descMid=m[3].trim();
    const amt=parseFloat(m[4].replace(',',''));
    const balance=parseFloat(m[5].replace(',',''));

    // Collect surrounding desc lines
    const descParts=[lines[i-1]||'',descMid];
    for(let j=i+1;j<lines.length&&j<i+4;j++){
      const nl=lines[j];
      if(DATE_RE.exec(nl)) break;
      if(SKIP.some(s=>nl.startsWith(s))) break;
      descParts.push(nl);
    }
    const desc=descParts.join(' ');

    // DR or CR by balance movement
    let isDebit=true;
    if(prevBalance!==null){
      isDebit=balance<prevBalance-0.01; // debit if balance went down
    } else {
      isDebit=ref.includes('OUT');
    }
    prevBalance=balance;

    if(!isDebit) continue; // skip credits (salary, cashback, refunds)

    // Extract payee VPA
    const toM=desc.match(/To:(\S+?)(?:\/|\s|$)/);
    const toVpa=toM?toM[1].replace(/\/$/,''):'';

    // UPI ref number
    const upiM=desc.match(/UPI\/\s*(\d{9,})/);
    const upiRef=upiM?upiM[1]:ref;

    // Merchant name extraction
    let merchant='';
    const payToM=desc.match(/Pay (?:To|to)\s+([A-Z][A-Za-z\s]+?)(?:\s+UPI|\s*\||\s*$)/);
    if(payToM) merchant=payToM[1].trim();
    else if(desc.includes('May Rent')||desc.includes('May rent')) merchant='Rent';
    else if(desc.includes('DVARA')) merchant='Salary Credit';
    else if(desc.includes('BHIMCASHBACK')) merchant='BHIM Cashback';
    else if(desc.match(/ATD:|ATM/)) merchant='ATM Cash';
    else if(desc.includes('Wab site')||desc.includes('Web site')) merchant='Freelance';
    else if(desc.includes('BharatPe Merchant')) merchant='BharatPe';

    // Clean display name from VPA
    let displayName=merchant;
    if(!displayName){
      if(toVpa.includes('rentomojo')) displayName='RentoMojo';
      else if(toVpa.includes('hathway')) displayName='Hathway WiFi';
      else if(toVpa.includes('districtmovie')) displayName='District (Movies)';
      else if(toVpa.includes('indianoilcorp')) displayName='Indian Oil';
      else if(toVpa.includes('uberindia')) displayName='Uber';
      else if(toVpa.includes('pronto')) displayName='Pronto (Milk)';
      else if(toVpa.includes('bhimrecharge')||toVpa.includes('@icici')) displayName='Recharge';
      else if(toVpa.includes('sbicardp')) displayName='SBI Card Bill';
      else if(toVpa.includes('jayakylas')) displayName='ANKA (Rent/Electricity)';
      else if(toVpa.includes('anup91924')||toVpa.includes('oksbi')) displayName='UBEY (Savings)';
      else if(toVpa.includes('9996542702')||toVpa.includes('pthdfc')) displayName='UMAR (Family)';
      else if(toVpa.includes('P9Farms')) displayName='P9 Farms';
      else if(toVpa.includes('AMZN')||toVpa.includes('amazon')) displayName='Amazon';
      else if(toVpa.includes('cocacola')) displayName='Coca-Cola';
      else if(toVpa.includes('rareandbasics')) displayName='Rare & Basics';
      else if(toVpa.includes('ibkPOS')||toVpa.includes('ibk')) displayName='POS Purchase';
      else if(toVpa.includes('ctet')) displayName='CTET (Exam)';
      else if(toVpa.includes('kotak811')) displayName='UMAR (Kotak)';
      else if(toVpa.includes('@slc')) displayName='Slice Merchant';
      else if(toVpa.includes('paytm')) displayName='Paytm';
      else if(toVpa.includes('@ybl')||toVpa.includes('@axl')||toVpa.includes('@oksbi')) displayName=toVpa.split('@')[1]?.toUpperCase()||'UPI';
      else if(toVpa) displayName=toVpa.split('@')[0].replace(/[^a-zA-Z0-9]/g,' ').trim().substring(0,25)||toVpa.substring(0,20);
    }

    txns.push({
      date:dateStr,
      ref:upiRef,
      rawRef:ref,
      toVpa,
      displayName:displayName||toVpa.substring(0,25)||'Unknown',
      description:desc.substring(0,150),
      amount:amt,
      balance,
      autoTag:autoTagPDF({toVpa,displayName,desc,amount:amt,dateStr}),
    });
  }

  return{txns,salaryDate,salaryAmount,atmCash};
}

// ── AUTO-TAGGER ───────────────────────────────────────────────────────────
function autoTagPDF({toVpa,displayName,desc,amount,dateStr}){
  const vpa=(toVpa||'').toLowerCase();
  const dsp=(displayName||'').toUpperCase();
  const de=(desc||'').toUpperCase();
  const d=parseDate(dateStr);
  const dow=d.getDay();
  const we=dow===0||dow===6;
  const wd=dow>=1&&dow<=5;
  const[hh,mm]=(dateStr.match(/T(\d{2}):(\d{2})/)||['','00','00']).slice(1).map(Number);
  const mins=hh*60+mm;

  // YES CC — these come from the UPI HTML file, PDF is savings account only
  if(vpa.includes('yescc')||de.includes('YES BANK CREDIT')) return 'yescc';

  // Rent — ANKA/jayakylas — 15000 exactly = rent, else electricity
  if(vpa.includes('jayakylas')||dsp.includes('ANKA')) return amount===15000?'rent':'electricity';

  // Family — UMAR (father) — multiple VPAs
  if(vpa.includes('9996542702')||vpa.includes('pthdfc')||dsp.includes('UMAR')) return 'family';
  if(vpa.includes('kotak811')&&de.includes('UMAR')) return 'family';

  // Savings — UBEY
  if(vpa.includes('anup91924')||vpa.includes('oksbi')&&amount>=5000) return 'savings';
  if(dsp.includes('UBEY')) return 'savings';

  // Furniture rent — RentoMojo
  if(vpa.includes('rentomojo')) return 'furniture';

  // Milk — Q154692158@ybl (rpet), bokre@ybl, Pronto
  if(vpa.includes('q154692158')||vpa.includes('bokre@ybl')||vpa.includes('pronto')) return 'milk';

  // SBI CC bill payment
  if(vpa.includes('sbicardp')) return 'bills';

  // YES CC bill payment (Funds Trf)
  if(de.includes('FUNDS TRF TO XX0056')||de.includes('CC000100')) return 'bills';

  // Petrol — Indian Oil
  if(vpa.includes('indianoil')) return 'petrol';

  // WiFi — Hathway
  if(vpa.includes('hathway')) return 'wifi';

  // Movies — District
  if(vpa.includes('districtmovie')) return 'movies';

  // Dining — Burrito, restaurants
  if(dsp.includes('BURRITO')||de.includes('BURRITO RESTAURANT')) return 'dining';

  // Grocery / Farms
  if(vpa.includes('p9farms')||vpa.includes('P9FarmsPrivate')) return 'grocery';

  // Amazon
  if(vpa.includes('amzn')||vpa.includes('amazon')||vpa.includes('@rapl')) return 'amazon';

  // Recharge — bhimrecharge@icici, rxairtel
  if(vpa.includes('bhimrecharge')||vpa.includes('rxairtel')||de.includes('BHIMRECHARGE')) return 'recharge';

  // Uber — uberindia VPA
  if(vpa.includes('uberindia')) return 'uber';

  // CTET exam fee
  if(vpa.includes('ctet')||de.includes('CTET')) return 'bills';

  // Kotak IMPS transfer (salary sent to Kotak?) — untagged
  if(de.includes('KOTAK MAHINDRA BANK')&&amount>=5000) return 'untagged';

  // Weekend → entertainment
  if(we) return 'entertainment';

  // Weekday time-based uber
  if(wd&&((mins>=8*60+50&&mins<=9*60+40)||(mins>=18*60+10&&mins<=19*60+30))) return 'uber';

  // Weekday <500 → other
  if(wd&&amount<500) return 'other';

  return 'untagged';
}

// ── ALSO HANDLE BHIM HTML ─────────────────────────────────────────────────
function parseBHIMHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const rows=doc.querySelectorAll('table tr');
  const txns=[];let first=true;
  rows.forEach(row=>{
    if(first){first=false;return}
    const cells=Array.from(row.querySelectorAll('td,th')).map(c=>c.innerText.trim());
    if(cells.length<11)return;
    const[date,time,bank,,sender,receiver,ref,,amount,drCr,status]=cells;
    if(!date||drCr!=='DR'||status!=='SUCCESS')return;
    const isYesCC=bank.toUpperCase().includes('CREDIT CARD');
    const vpam=receiver.match(/^([^(]+)/);
    const toVpa=vpam?vpam[1].trim():'';
    const pm=receiver.match(/\(([^)]+)\)/);
    const nameInParens=pm?pm[1].replace(/x+/gi,'').trim():'';
    const displayName=nameInParens.length>=2?nameInParens:(toVpa.split('@')[0]||'?');
    const dateDD=date; // DD/MM/YYYY
    // Convert to DD-Mon-YYYY for consistency
    const[dd,mm2,yyyy]=date.split('/');
    const MONS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr=`${dd}-${MONS[parseInt(mm2)]}-${yyyy}`;
    const autoT=autoTagBHIM({toVpa,isYesCC,receiver,amount:parseFloat(amount)||0,dateStr,time});
    txns.push({
      date:dateStr,ref,toVpa,displayName,description:receiver,
      amount:parseFloat(amount)||0,
      autoTag:isYesCC?'yescc':autoT,
      fromBHIM:true,
    });
  });
  const seen=new Set(),out=[];
  for(const t of txns){if(!seen.has(t.ref)){seen.add(t.ref);out.push(t)}}
  return{txns:out,salaryDate:null,salaryAmount:0,atmCash:0};
}

function autoTagBHIM({toVpa,isYesCC,receiver,amount,dateStr,time}){
  if(isYesCC) return 'yescc';
  const recv=(receiver||'').toUpperCase();
  const vpa=(toVpa||'').toLowerCase();
  const d=parseDate(dateStr);
  const dow=d.getDay();
  const we=dow===0||dow===6;
  const wd=dow>=1&&dow<=5;
  const[hh,mm]=(time||'').split(':').map(Number);
  const mins=hh*60+mm;
  if(recv.includes('ANKA')||vpa.includes('jayakylas')) return amount===15000?'rent':'electricity';
  if(recv.includes('UMAR')) return 'family';
  if(recv.includes('UBEY')||vpa.includes('anup91924')) return 'savings';
  if(recv.includes('MOJO')||vpa.includes('rentomojo')) return 'furniture';
  if(vpa.includes('q154692158')||vpa.includes('bokre@ybl')||recv.includes('PRONTO')||vpa.includes('pronto')) return 'milk';
  if(vpa.includes('bhimrecharge')||vpa.includes('@icici')&&(recv.includes('JIO')||recv.includes('AIRTEL'))|| vpa.includes('rxairtel')) return 'recharge';
  if(vpa.includes('hathway')) return 'wifi';
  if(vpa.includes('districtmovie')) return 'movies';
  if(vpa.includes('indianoil')) return 'petrol';
  if(recv.includes('BURRITO')||vpa.includes('BURRITO')) return 'dining';
  if(vpa.includes('amzn')||vpa.includes('amazon')||vpa.includes('@rapl')) return 'amazon';
  if(vpa.includes('ctet')||vpa.includes('sbicardp')) return 'bills';
  if(vpa.includes('uberindia')||vpa.includes('rxairtel')) return 'uber';
  if(dow===0&&mins>=17*60+30&&mins<=19*60) return 'vegetable';
  if(wd&&((mins>=8*60+50&&mins<=9*60+40)||(mins>=18*60+10&&mins<=19*60+30))) return 'uber';
  if(we) return 'entertainment';
  if(wd&&amount<500) return 'other';
  return 'untagged';
}

// ── PDF.JS LOADER ─────────────────────────────────────────────────────────
async function extractPDFText(file){
  // Load pdf.js from CDN
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=res;s.onerror=rej;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    // Sort items by y then x for proper reading order
    const items=[...content.items].sort((a,b)=>{
      const dy=Math.round(b.transform[5])-Math.round(a.transform[5]);
      return dy!==0?dy:a.transform[4]-b.transform[4];
    });
    // Group into lines by y coordinate
    const lines={};
    items.forEach(item=>{
      const y=Math.round(item.transform[5]);
      if(!lines[y]) lines[y]=[];
      lines[y].push({x:item.transform[4],text:item.str});
    });
    Object.keys(lines).sort((a,b)=>b-a).forEach(y=>{
      const lineText=lines[y].sort((a,b)=>a.x-b.x).map(i=>i.text).join(' ');
      if(lineText.trim()) text+=lineText+'\n';
    });
  }
  return text;
}

    if(!file)return;
    setLoading(true);setError('');
    try{
      if(file.name.endsWith('.pdf')||file.type==='application/pdf'){
        const text=await extractPDFText(file);
        const result=parsePDFText(text);
        onLoad(result,'pdf');
      } else {
        const text=await file.text();
        const result=parseBHIMHTML(text);
        onLoad(result,'html');

      h('div',{className:'ins-row'},h('span',{className:'ins-lbl'},'📊 Avg / week'),h('span',{className:`ins-val ${heatCls(avgWeek)}`},fmt(avgWeek)))

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const[settings,setSettings]=useState(()=>lsGet(LS.SET,{salary:0,cashInHand:0,sbiSpent:0,atmCash:0,salaryDate:''}));
  const[tagMap,setTagMap]=useState(()=>lsGet(LS.TAGS,{}));
  const[manual,setManual]=useState(()=>lsGet(LS.MAN,{debts:[],savings:[],lent:[],cashSpend:0}));
  const[rawTxns,setRawTxns]=useState(()=>lsGet(LS.RAW,[]));
  const[autoSalary,setAutoSalary]=useState({amount:0,date:''});
  const[page,setPage]=useState(()=>lsGet(LS.RAW,[]).length>0?'overview':'upload');
  const[toastMsg,setToastMsg]=useState('');
  const toastRef=useRef();
  function toast(msg){setToastMsg(msg);if(toastRef.current)clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToastMsg(''),2500)}

  useEffect(()=>{lsSet(LS.SET,settings)},[settings]);
  useEffect(()=>{lsSet(LS.TAGS,tagMap)},[tagMap]);
  useEffect(()=>{lsSet(LS.MAN,manual)},[manual]);
  useEffect(()=>{lsSet(LS.RAW,rawTxns)},[rawTxns]);

  // Determine salary date cutoff
  const cutoff=useMemo(()=>{
    if(settings.salaryDate)return new Date(settings.salaryDate);
    if(autoSalary.date){const d=parseDate(autoSalary.date);return d;}
    return null;
  },[settings.salaryDate,autoSalary.date]);

  const txns=useMemo(()=>
    rawTxns
      .filter(t=>!cutoff||parseDate(t.date)>=cutoff)
      .map(t=>({...t,tag:tagMap[t.ref]||(t.autoTag||'untagged')}))
  ,[rawTxns,tagMap,cutoff]);

  function handleLoad({txns:newTxns,salaryDate,salaryAmount,atmCash},format){
    // Auto-fill salary if detected
    if(salaryAmount>0){
      setAutoSalary({amount:salaryAmount,date:salaryDate||''});
      setSettings(prev=>({...prev,
        salary:prev.salary||salaryAmount,
        atmCash:prev.atmCash||atmCash||0,
        salaryDate:prev.salaryDate||'',
      }));
    }
    // Merge: keep existing refs, add new
    const existingRefs=new Set(rawTxns.map(t=>t.ref));
    const incoming=newTxns.map(t=>({...t,autoTag:t.autoTag||'untagged'}));
    const newOnes=incoming.filter(t=>!existingRefs.has(t.ref));
    const reTagged=rawTxns.map(t=>({...t})); // keep existing
    const merged=[...reTagged,...newOnes];
    setRawTxns(merged);
    setPage('overview');
    toast(`${merged.length} total · ${newOnes.length} new · ${format.toUpperCase()} ✓`);
  }

  function handleTagChange(ref,tag){setTagMap(prev=>({...prev,[ref]:tag}))}

  const hasData=rawTxns.length>0;
  const untagCnt=txns.filter(t=>t.tag==='untagged').length;

  const NAV=[{id:'upload',l:'Upload'},{id:'overview',l:'Overview'},{id:'tag',l:untagCnt>0?`Tag ${untagCnt}`:'Tag'},{id:'insights',l:'Insights'},{id:'money',l:'Money'},{id:'settings',l:'Settings'}];

  function navIcon(id){
    if(id==='upload')   return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'17 8 12 3 7 8'}),h('line',{x1:12,y1:3,x2:12,y2:15}));
    if(id==='overview') return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:3,y:3,width:7,height:7,rx:1}),h('rect',{x:14,y:3,width:7,height:7,rx:1}),h('rect',{x:3,y:14,width:7,height:7,rx:1}),h('rect',{x:14,y:14,width:7,height:7,rx:1}));
    if(id==='tag')      return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z'}),h('line',{x1:7,y1:7,x2:7.01,y2:7}));
    if(id==='insights') return h('svg',{viewBox:'0 0 24 24'},h('polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'}));
    if(id==='money')    return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:2,y:5,width:20,height:14,rx:2}),h('line',{x1:2,y1:10,x2:22,y2:10}));
    if(id==='settings') return h('svg',{viewBox:'0 0 24 24'},h('circle',{cx:12,cy:12,r:3}),h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'}));
  }

  const needsData=['overview','tag','insights'].includes(page)&&!hasData;
  return h('div',null,
    page==='upload'   &&h(UploadPage,  {onLoad:handleLoad,hasSaved:hasData}),
    page==='overview' &&(needsData?null:h(OverviewPage,{txns,settings,manual})),
    page==='tag'      &&(needsData?null:h(TagPage,{txns,onTagChange:handleTagChange})),
    page==='insights' &&(needsData?null:h(InsightsPage,{txns,settings,manual})),
    page==='money'    &&h(MoneyPage,{manual,onManualChange:setManual}),
    page==='settings' &&h(SettingsPage,{settings,onSave:setSettings,txnCount:txns.length,autoSalary,toast}),
    needsData&&h('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(240,236,255,.93)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,backdropFilter:'blur(6px)'}},
      h('div',{className:'card',style:{maxWidth:'290px',textAlign:'center',padding:'1.75rem',border:'2px solid var(--p4)'}},
        h('div',{style:{fontSize:'2.5rem',marginBottom:'.6rem'}},'📄'),
        h('div',{style:{fontWeight:900,fontSize:'1.1rem',marginBottom:'.4rem'}},'No transactions yet'),
        h('div',{style:{fontSize:'13px',color:'var(--m2)',marginBottom:'.85rem',lineHeight:1.5}},'Upload your YES Bank PDF statement or BHIM HTML export to get started.'),
        h('button',{className:'btn btn-pri',onClick:()=>setPage('upload')},'Go to Upload')
      )
    ),
    h('nav',{className:'nav'},
      NAV.map(n=>h('button',{key:n.id,className:`nb${page===n.id?' on':''}`,onClick:()=>setPage(n.id)},
        navIcon(n.id),
        h('span',{style:{fontSize:'10px',fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase'}},n.l),
        h('span',{className:'nb-pip'})
      ))
    ),
    h(Toast,{msg:toastMsg})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
