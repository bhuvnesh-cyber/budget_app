/* ══════════════════════════ SETTINGS PAGE ══════════════════════════ */
function SettingsPage({data,month,onUpdate,onResetIncomeAndBudgets,onResetEverything}){
  const md=getMonth(data,month);
  const[salary,setSalary]=useState(String(md.income.salary||''));
  const[other,setOther]=useState(String(md.income.other||''));
  const[extras,setExtras]=useState(md.income.extras||[]);
  const[sbiLimit,setSbiLimit]=useState(String(data.cardLimits.sbi||''));
  const[yesLimit,setYesLimit]=useState(String(data.cardLimits.yes||''));
  const[budgets,setBudgets]=useState({...md.budgets});
  const[saved,setSaved]=useState(false);

  // Whenever the selected month changes, reload the fields from that month's
  // own data instead of continuing to show the previous month's values.
  useEffect(()=>{
    const m=getMonth(data,month);
    setSalary(String(m.income.salary||''));
    setOther(String(m.income.other||''));
    setExtras(m.income.extras||[]);
    setBudgets({...m.budgets});
  },[month]);

  function addExtra(){setExtras(e=>[...e,{id:genId(),name:'',amount:''}])}
  function updExtra(id,field,val){setExtras(e=>e.map(x=>x.id===id?{...x,[field]:val}:x))}
  function delExtra(id){setExtras(e=>e.filter(x=>x.id!==id))}

  // Pulls the previous month's income & budget numbers into these fields so
  // they can be reviewed and tweaked instead of retyped from scratch — this
  // does NOT save automatically, "Save Settings" below still applies it.
  const prevYm=prevM(month);
  const prevMd=getMonth(data,prevYm);
  const prevHasData=monthIncome(prevMd)>0||totalBudget(prevMd)>0;
  function copyFromPrevious(){
    setSalary(String(prevMd.income.salary||''));
    setOther(String(prevMd.income.other||''));
    setExtras(prevMd.income.extras.map(e=>({...e})));
    setBudgets({...prevMd.budgets});
  }

  function saveAll(){
    onUpdate({
      cardLimits:{sbi:+sbiLimit||0,yes:+yesLimit||0},
      budgets:Object.fromEntries(Object.entries(budgets).map(([k,v])=>[k,+v||0])),
      monthIncome:{salary:+salary||0,other:+other||0,extras:extras.map(e=>({...e,amount:+e.amount||0}))},
    });
    setSaved(true);setTimeout(()=>setSaved(false),1800);
  }

  function handleResetIncomeBudgets(){
    if(!confirm('Reset '+monthLabel(month)+'\u2019s salary/income and ALL category budgets to \u20B90? This can\u2019t be undone.'))return;
    onResetIncomeAndBudgets();
    setSalary('');setOther('');setExtras([]);
    const zeroed={};allSubsFor(data).forEach(s=>zeroed[s.id]=0);
    setBudgets(zeroed);
  }
  function handleResetEverything(){
    if(!confirm('This wipes EVERYTHING \u2014 income, budgets, card limits, balances, uncategorized amounts, and all transaction history \u2014 back to a blank app. This cannot be undone. Continue?'))return;
    onResetEverything();
    setSalary('');setOther('');setExtras([]);
    setSbiLimit('');setYesLimit('');
    const zeroed={};allSubsFor(data).forEach(s=>zeroed[s.id]=0);
    setBudgets(zeroed);
  }

  // Live totals while you type, so you can see how much of your income the
  // budget you're setting actually uses.
  const budgetTotalTyped=allSubsFor(data).reduce((s,sub)=>s+(+budgets[sub.id]||0),0);
  const incomeTyped=(+salary||0)+(+other||0)+extras.reduce((s,e)=>s+(+e.amount||0),0);
  const unbudgeted=incomeTyped-budgetTotalTyped;

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 0'}},
      h('div',{style:{fontSize:20,fontWeight:800,color:C.text}},'Settings'),
      h('div',{style:{fontSize:12.5,color:C.text3,marginTop:2}},'Editing income & budgets for '+monthLabel(month)+'. Switch months from Home to edit a different month.'),
      prevHasData&&h('button',{onClick:()=>{if(confirm('Copy income and every category budget from '+monthLabel(prevYm)+' into '+monthLabel(month)+'\u2019s form below? Nothing is saved until you tap Save Settings, so you can review or tweak first.'))copyFromPrevious()},
        style:{width:'100%',marginTop:10,padding:'10px',borderRadius:10,border:`1.5px dashed ${C.border2}`,background:C.indigolt,color:C.indigo,fontWeight:700,fontSize:12.5,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:6}},
        '\u21BB Copy Income & Budgets from '+monthLabel(prevYm))
    ),
    h(SectionTitle,null,'Income \u2014 '+monthLabel(month)),
    h('div',{style:{padding:'0 16px'}},
      h('div',{style:{marginBottom:10}},h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'Monthly Salary'),h(NumField,{value:salary,onChange:setSalary})),
      h('div',{style:{marginBottom:10}},h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'Other Income'),h(NumField,{value:other,onChange:setOther})),
      extras.map(e=>h('div',{key:e.id,style:{display:'flex',gap:8,marginBottom:8,alignItems:'center'}},
        h('input',{value:e.name,onChange:ev=>updExtra(e.id,'name',ev.target.value),placeholder:'Description',style:{flex:1.3,padding:'9px 10px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'inherit',outline:'none'}}),
        h('input',{type:'number',value:e.amount,onChange:ev=>updExtra(e.id,'amount',ev.target.value),placeholder:'Amount',style:{flex:1,padding:'9px 10px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'monospace',outline:'none'}}),
        h('button',{onClick:()=>delExtra(e.id),style:{border:'none',background:C.redlt,color:C.red,borderRadius:9,width:32,height:32,fontSize:16,cursor:'pointer',fontWeight:700}},'\u00D7')
      )),
      h('button',{onClick:addExtra,style:{width:'100%',padding:'10px',borderRadius:10,border:`1.5px dashed ${C.border2}`,background:'transparent',color:C.indigo,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',marginBottom:6}},'+ Add Income Source')
    ),
    h(SectionTitle,null,'Credit Card Limits'),
    h('div',{style:{padding:'0 16px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
      h('div',null,h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'SBI Limit'),h(NumField,{value:sbiLimit,onChange:setSbiLimit})),
      h('div',null,h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'YES Limit'),h(NumField,{value:yesLimit,onChange:setYesLimit}))
    ),
    h(SectionTitle,null,'Category Budgets \u2014 '+monthLabel(month)),
    h('div',{style:{padding:'0 16px 12px'}},
      h('div',{style:{padding:'12px 14px',borderRadius:14,background:C.card,boxShadow:C.shadow,border:`1px solid ${C.border}`}},
        h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}},
          h('span',{style:{color:C.text2,fontWeight:700}},'Budgeted'),
          h('span',{style:{color:C.text,fontWeight:800,fontFamily:'monospace'}},fmtC(budgetTotalTyped)+' of '+fmtC(incomeTyped))
        ),
        h(Bar,{pct:incomeTyped?budgetTotalTyped/incomeTyped*100:0,color:unbudgeted>=0?C.indigo:C.red}),
        h('div',{style:{fontSize:11.5,fontWeight:800,fontFamily:'monospace',color:leftColor(unbudgeted),marginTop:6}},
          unbudgeted>=0?fmtC(unbudgeted)+' of income not budgeted yet':fmtC(-unbudgeted)+' budgeted beyond income')
      )
    ),
    h('div',{style:{padding:'0 16px'}},
      categoriesFor(data).map(cat=>{
        const catSum=cat.subs.reduce((s,sub)=>s+(+budgets[sub.id]||0),0);
        return h('div',{key:cat.id,style:{marginBottom:14,background:C.card,borderRadius:14,padding:'12px 14px',boxShadow:C.shadow,border:`1px solid ${C.border}`}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
            h('div',{style:{fontWeight:800,color:C.text,fontSize:14}},cat.icon+' '+cat.name),
            h('div',{style:{fontFamily:'monospace',fontWeight:700,color:cat.color,fontSize:13}},fmtC(catSum))
          ),
          cat.subs.map(sub=>h('div',{key:sub.id,style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
            h('span',{style:{fontSize:13,color:C.text2,flex:1}},sub.icon+' '+sub.name),
            h('input',{type:'number',value:budgets[sub.id]??0,onChange:e=>setBudgets(b=>({...b,[sub.id]:e.target.value})),
              style:{width:100,padding:'7px 9px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,fontFamily:'monospace',fontWeight:700,color:C.text,textAlign:'right',outline:'none'}})
          ))
        );
      })
    ),
    h('div',{style:{padding:'8px 16px 20px'}},
      h('button',{onClick:saveAll,style:{width:'100%',padding:'15px',borderRadius:14,border:'none',background:saved?C.green:C.grad,color:'#fff',fontWeight:800,fontSize:16,cursor:'pointer',fontFamily:'inherit',transition:'background .2s'}},saved?'\u2713 Saved':'Save Settings')
    ),
    h(SectionTitle,null,'Danger Zone'),
    h('div',{style:{padding:'0 16px 24px'}},
      h('button',{onClick:handleResetIncomeBudgets,style:{width:'100%',padding:'13px',borderRadius:12,border:`1.5px solid ${C.orange}`,background:C.orangelt,color:C.orange,fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginBottom:10}},'Reset Salary & Budgets to \u20B90'),
      h('div',{style:{fontSize:11.5,color:C.text3,marginBottom:16}},'Zeroes out '+monthLabel(month)+'\u2019s income and every category/subcategory budget. Card limits, balances, and transaction history are untouched.'),
      h('button',{onClick:handleResetEverything,style:{width:'100%',padding:'13px',borderRadius:12,border:`1.5px solid ${C.red}`,background:C.redlt,color:C.red,fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginBottom:10}},'Factory Reset \u2014 Wipe Everything'),
      h('div',{style:{fontSize:11.5,color:C.text3}},'Clears income, budgets, card limits, balances, uncategorized amounts, and all transaction history. Use only if you want to start completely over.')
    )
  );
}

/* ══════════════════════════ APP ══════════════════════════ */
function App(){
  const[data,setData]=useState(()=>{
    const d=lsGet(SK,null);
    if(!d)return defaultData();
    const merged={...defaultData(),...d};
    delete merged.budgets; // legacy global budgets — migrated into per-month below
    const legacyBudgets=d.budgets||null;
    merged.months={...merged.months};
    if(legacyBudgets){
      // Old versions had one shared budget for every month. Carry that
      // forward into each month that already has data (so historical Budget
      // Watch stays accurate) and into the current month, so nothing
      // resets to zero the moment this update lands. Any OTHER month
      // (past or future) you haven't touched still starts blank at ₹0.
      Object.keys(merged.months).forEach(ym=>{
        merged.months[ym]={...merged.months[ym],budgets:merged.months[ym].budgets||{...legacyBudgets}};
      });
      const curYmNow=curYm();
      if(!merged.months[curYmNow]){
        merged.months[curYmNow]={...defaultMonth(),budgets:{...legacyBudgets}};
      }
    }
    // Legacy versions kept ONE global running balance + a single shared
    // balanceLog (with each entry tagged by ym) instead of per-month data.
    // Fold that history into each month it actually belongs to, then drop
    // the old global fields so balances become fully month-independent.
    const oldLog=d.balanceLog||[];
    if(oldLog.length){
      const grouped={};
      oldLog.forEach(e=>{(grouped[e.ym]=grouped[e.ym]||[]).push(e)});
      Object.keys(grouped).forEach(ym=>{
        if(!merged.months[ym])merged.months[ym]={...defaultMonth(),budgets:legacyBudgets?{...legacyBudgets}:{}};
        const entries=grouped[ym];
        const last=entries[entries.length-1];
        merged.months[ym]={...merged.months[ym],
          balanceLog:entries,
          balances:{debit:last.debit,sbi:last.sbi,yes:last.yes},
          lastCalc:{debitSpend:last.debitSpend,sbiSpend:last.sbiSpend,yesSpend:last.yesSpend,totalNew:last.totalNew,usedIncomeBaseline:last.usedIncomeBaseline}};
      });
    }else if(d.balances){
      // Even older versions may have a saved balance with no log at all.
      if(!merged.months[curYm()])merged.months[curYm()]={...defaultMonth(),budgets:legacyBudgets?{...legacyBudgets}:{}};
      merged.months[curYm()]={...merged.months[curYm()],balances:d.balances,lastCalc:d.lastCalc||null};
    }
    delete merged.balances;
    delete merged.lastCalc;
    delete merged.balanceLog;
    return merged;
  });
  const[page,setPage]=useState('dash');
  const[month,setMonth]=useState(curYm());
  // Set only by the Dashboard's "tap a row to log an expense" shortcut, so
  // Categorize opens pre-filled with that subcategory already picked. Cleared
  // whenever the person navigates to Categorize any other way, so it never
  // lingers and silently pre-fills a later, unrelated visit.
  const[prefillSubId,setPrefillSubId]=useState(null);

  useEffect(()=>{lsSave(SK,data)},[data]);

  // All of the handlers below operate on `ym` (the currently BROWSED month,
  // passed in explicitly from whichever page called them) rather than
  // hardcoding curYm() (today's real month). That's what keeps each month's
  // income, budgets, balances, and uncategorized pools fully independent —
  // editing settings while viewing August only ever touches August's data.
  function saveBalances(ym,newBal,spendDelta,calc){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.uncategorized.debit=(md.uncategorized.debit||0)+(calc?calc.debitSpend:0);
      md.uncategorized.sbi=(md.uncategorized.sbi||0)+(calc?calc.sbiSpend:0);
      md.uncategorized.yes=(md.uncategorized.yes||0)+(calc?calc.yesSpend:0);
      const logEntry={id:genId(),at:new Date().toISOString(),ym,
        debit:newBal.debit,sbi:newBal.sbi,yes:newBal.yes,
        debitSpend:calc?calc.debitSpend:0,sbiSpend:calc?calc.sbiSpend:0,yesSpend:calc?calc.yesSpend:0,
        totalNew:spendDelta,usedIncomeBaseline:calc?!!calc.usedIncomeBaseline:false};
      md.balances=newBal;
      md.lastCalc=calc||null;
      md.balanceLog=[...md.balanceLog,logEntry];
      return{...d,months};
    });
  }
  function setCardInputMode(mode){
    setData(d=>({...d,cardInputMode:mode}));
  }
  function deleteLogEntry(id,ym){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      const log=md.balanceLog||[];
      const idx=log.findIndex(e=>e.id===id);
      if(idx===-1)return d;
      const isLatest=idx===log.length-1;
      if(isLatest){
        const entry=log[idx];
        md.uncategorized.debit=Math.max(0,(md.uncategorized.debit||0)-(entry.debitSpend||0));
        md.uncategorized.sbi=Math.max(0,(md.uncategorized.sbi||0)-(entry.sbiSpend||0));
        md.uncategorized.yes=Math.max(0,(md.uncategorized.yes||0)-(entry.yesSpend||0));
        const prev=log[idx-1];
        md.balances=prev?{debit:prev.debit,sbi:prev.sbi,yes:prev.yes}:null;
        md.lastCalc=prev?{debitSpend:prev.debitSpend,sbiSpend:prev.sbiSpend,yesSpend:prev.yesSpend,totalNew:prev.totalNew,usedIncomeBaseline:prev.usedIncomeBaseline}:null;
      }
      md.balanceLog=log.filter(e=>e.id!==id);
      return{...d,months};
    });
  }
  function addTxn(txn,ym){
    setData(d=>{
      const months={...d.months};
      const dateYm=txn.date.slice(0,7);
      // The uncategorized pool being drawn down is the BROWSED month's pool
      // for the chosen payment source (that's what's shown on the
      // Categorize screen), regardless of what date the expense is filed under.
      const curMd=cloneMonthEntry(d,months,ym);
      curMd.uncategorized[txn.source]=Math.max(0,(curMd.uncategorized[txn.source]||0)-txn.amount);
      const finalTxn={...txn,originYm:ym};
      // The transaction record itself is filed under its own date's month, so
      // History and per-month budget analytics stay accurate.
      const txnMd=dateYm===ym?curMd:cloneMonthEntry(d,months,dateYm);
      txnMd.transactions=[...txnMd.transactions,finalTxn];
      return{...d,months};
    });
  }
  function deleteTxn(ym,txn){
    setData(d=>{
      const months={...d.months};
      // Remove the record from wherever it's filed...
      const dateMd=cloneMonthEntry(d,months,ym);
      dateMd.transactions=dateMd.transactions.filter(t=>t.id!==txn.id);
      // ...and give the money back to the bucket it was originally drawn from.
      const originYm=txn.originYm||ym;
      const originMd=cloneMonthEntry(d,months,originYm);
      originMd.uncategorized[txn.source]=(originMd.uncategorized[txn.source]||0)+txn.amount;
      return{...d,months};
    });
  }
  function editTxn(ym,oldTxn,updates){
    setData(d=>{
      const months={...d.months};
      const originYm=oldTxn.originYm||ym;
      // 1. give back the old amount to its original source bucket
      const originMd=cloneMonthEntry(d,months,originYm);
      originMd.uncategorized[oldTxn.source]=(originMd.uncategorized[oldTxn.source]||0)+oldTxn.amount;
      // 2. remove the old record from wherever it was filed
      const oldDateMd=cloneMonthEntry(d,months,ym);
      oldDateMd.transactions=oldDateMd.transactions.filter(t=>t.id!==oldTxn.id);
      // 3. draw the new amount from the (possibly new) source, same origin month
      const originMd2=cloneMonthEntry(d,months,originYm);
      originMd2.uncategorized[updates.source]=(originMd2.uncategorized[updates.source]||0)-updates.amount;
      // 4. file the updated record under its (possibly new) date's month
      const newDateYm=updates.date.slice(0,7);
      const newTxn={...oldTxn,...updates,originYm};
      const newDateMd=cloneMonthEntry(d,months,newDateYm);
      newDateMd.transactions=[...newDateMd.transactions,newTxn];
      return{...d,months};
    });
  }
  function updateSettings(ym,{cardLimits,budgets,monthIncome}){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.income=monthIncome;
      md.budgets=budgets;
      return{...d,cardLimits,months};
    });
  }
  // Directly overwrites the browsed month's uncategorized buckets. Used to
  // manually correct totals — e.g. after the one-time migration that lumps
  // old pre-split spending entirely into Debit, or to fix any other mismatch
  // against your real account/card statements.
  function adjustBuckets(ym,newBuckets){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.uncategorized={debit:+newBuckets.debit||0,sbi:+newBuckets.sbi||0,yes:+newBuckets.yes||0};
      return{...d,months};
    });
  }
  // Zeroes out the browsed month's income and every category/subcategory budget.
  function resetIncomeAndBudgets(ym){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.income={salary:0,other:0,extras:[]};
      md.budgets=zeroBudgets();
      return{...d,months};
    });
  }
  // Clears this month's saved balances baseline so its next Balances save
  // starts fresh (using the income-baseline logic again). This month's
  // balance history log is kept. Other months are untouched.
  function resetBalances(ym){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.balances=null;
      md.lastCalc=null;
      return{...d,months};
    });
  }
  // Zeroes the browsed month's uncategorized buckets directly (shortcut for
  // the manual adjustment tool). Doesn't touch already-categorized transactions.
  function resetUncategorized(ym){
    setData(d=>{
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.uncategorized={debit:0,sbi:0,yes:0};
      return{...d,months};
    });
  }
  // Full factory reset — wipes everything back to a blank app.
  function resetEverything(){
    setData(()=>defaultData());
  }

  const md=getMonth(data,month);
  const uncategorized=uncategorizedTotal(md);

  const NAV=[
    {id:'dash',label:'Home',em:'\uD83C\uDFE0'},
    {id:'balances',label:'Balances',em:'\uD83D\uDCB3'},
    {id:'categorize',label:'Categorize',em:'\uD83C\uDFF7\uFE0F',badge:uncategorized>0.5},
    {id:'history',label:'History',em:'\uD83D\uDCDC'},
    {id:'settings',label:'Settings',em:'\u2699\uFE0F'},
  ];

  return h('div',{style:{height:'100dvh',display:'flex',flexDirection:'column',background:C.bg,color:C.text,fontFamily:"system-ui,-apple-system,sans-serif",overflow:'hidden'}},
    h(SaveBar,{data,setData,month}),
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}},
      page==='dash'       &&h(Dashboard,      {data,month,setMonth,setPage,onQuickCategorize:subId=>{setPrefillSubId(subId);setPage('categorize')}}),
      page==='balances'   &&h(BalancesPage,   {data,month,onSave:(newBal,spendDelta,calc)=>saveBalances(month,newBal,spendDelta,calc),onModeChange:setCardInputMode,onDeleteLog:id=>deleteLogEntry(id,month),onAdjustBuckets:newBuckets=>adjustBuckets(month,newBuckets),onResetBalances:()=>resetBalances(month)}),
      page==='categorize' &&h(CategorizePage, {data,month,prefillSubId,onAddTxn:txn=>addTxn(txn,month),onEditTxn:editTxn,onDeleteTxn:deleteTxn,onResetUncategorized:()=>resetUncategorized(month)}),
      page==='history'    &&h(HistoryPage,    {data,month,onEditTxn:editTxn,onDeleteTxn:deleteTxn}),
      page==='settings'   &&h(SettingsPage,   {data,month,onUpdate:settings=>updateSettings(month,settings),onResetIncomeAndBudgets:()=>resetIncomeAndBudgets(month),onResetEverything:resetEverything})
    ),
    h('nav',{style:{display:'flex',background:C.chrome,borderTop:`1px solid ${C.border}`,paddingBottom:'env(safe-area-inset-bottom,0px)',flexShrink:0,boxShadow:'0 -2px 16px rgba(109,40,217,.08)'}},
      NAV.map(n=>{
        const on=page===n.id;
        return h('button',{key:n.id,onClick:()=>{setPrefillSubId(null);setPage(n.id)},style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'9px 0 10px',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:9.5,fontWeight:on?800:500,color:on?C.indigo:C.text3,position:'relative',transition:'color .15s'}},
          on&&h('div',{style:{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:24,height:3,borderRadius:99,background:C.grad}}),
          h('span',{style:{fontSize:'1.25rem',position:'relative'}},n.em,
            n.badge&&h('span',{style:{position:'absolute',top:-2,right:-4,width:8,height:8,borderRadius:99,background:C.red,border:`1.5px solid ${C.nav}`}})
          ),
          n.label
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
