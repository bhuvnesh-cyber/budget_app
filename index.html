<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Spend Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F3F0FF;
  --s0:#FFFFFF;
  --s1:#EDE8FF;
  --s2:#E0D9FF;
  --bd:#D0C7F5;
  --bd2:#B8AEE8;
  --tx:#1A0A3C;
  --m1:#5B4A82;
  --m2:#9B8EBE;

  /* Purple palette */
  --p1:#7C3AED;--p2:#8B5CF6;--p3:#A78BFA;--p4:#C4B5FD;--p5:#EDE9FE;
  --p-dk:#5B21B6;--p-lt:#F5F3FF;

  /* Accent colors */
  --rose:#E11D48;--rose-lt:#FFF1F2;--rose-bd:#FECDD3;
  --grn:#059669;--grn-lt:#ECFDF5;--grn-bd:#A7F3D0;
  --amb:#D97706;--amb-lt:#FFFBEB;--amb-bd:#FDE68A;
  --sky:#0284C7;--sky-lt:#F0F9FF;--sky-bd:#BAE6FD;
  --pnk:#DB2777;--pnk-lt:#FDF2F8;--pnk-bd:#FBCFE8;
  --org:#EA580C;--org-lt:#FFF7ED;--org-bd:#FED7AA;

  --mono:'JetBrains Mono',monospace;
  --sans:'Plus Jakarta Sans',sans-serif;
  --r:16px;--rs:10px;
  --nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --sh:0 2px 8px rgba(124,58,237,.08),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 8px 28px rgba(124,58,237,.18),0 2px 8px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow-x:hidden;font-size:14px;line-height:1.5}
#root{display:flex;flex-direction:column;min-height:100%}

/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));
  background:rgba(255,255,255,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1.5px solid var(--bd);display:flex;align-items:stretch;z-index:100;
  padding-bottom:var(--safe-b);box-shadow:0 -4px 24px rgba(124,58,237,.1)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;cursor:pointer;color:var(--m2);font-family:var(--sans);
  font-size:.42rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;transition:color .15s;padding:0}
.nb.on{color:var(--p1)}
.nb svg{width:21px;height:21px;stroke-width:1.8;fill:none;stroke:currentColor;transition:stroke .15s}
.nb-pip{width:18px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p2));display:none;margin-top:1px}
.nb.on .nb-pip{display:block}

.page{flex:1;padding:.5rem 1rem calc(var(--nav-h) + var(--safe-b) + 1rem);max-width:520px;margin:0 auto;width:100%}

/* ── CARDS ── */
.card{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:.5rem;box-shadow:var(--sh)}

/* ── PAGE HEADER ── */
.ph{padding:.7rem 0 .55rem;display:flex;align-items:baseline;justify-content:space-between}
.ph-title{font-size:1.2rem;font-weight:900;color:var(--tx);letter-spacing:-.03em}
.ph-sub{font-size:.58rem;color:var(--m2);font-family:var(--mono)}

/* ── SECTION HEADER ── */
.sh{font-size:.46rem;letter-spacing:.18em;text-transform:uppercase;color:var(--p1);font-weight:900;
  margin:1.1rem 0 .5rem;display:flex;align-items:center;gap:.5rem}
.sh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}

/* ── HERO ── */
.hero{border-radius:var(--r);padding:1.1rem;margin-bottom:.5rem;border:1.5px solid;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;opacity:.12;background:currentColor}
.hero-lbl{font-size:.46rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.2rem;opacity:.8}
.hero-amt{font-family:var(--mono);font-size:2.2rem;font-weight:700;line-height:1;letter-spacing:-.04em;margin-bottom:.32rem}
.hero-sub{font-size:.6rem;font-family:var(--mono);opacity:.75}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.7rem;padding-top:.6rem;border-top:1px solid currentColor;opacity:.9}
.hg-lbl{font-size:.45rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:.15rem;font-weight:800}
.hg-val{font-family:var(--mono);font-weight:700;font-size:.8rem}
.hero-ok{background:linear-gradient(140deg,#F0FDF4,#DCFCE7);border-color:var(--grn-bd);color:#065F46}
.hero-warn{background:linear-gradient(140deg,#FFFBEB,#FEF9C3);border-color:var(--amb-bd);color:#78350F}
.hero-bad{background:linear-gradient(140deg,#FFF1F2,#FFE4E6);border-color:var(--rose-bd);color:#9F1239}
.hero-pur{background:linear-gradient(140deg,#F5F3FF,#EDE9FE);border-color:var(--p4);color:var(--p-dk)}

/* ── STATS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.45rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-bottom:.45rem}
.sc{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);padding:.65rem .85rem;box-shadow:var(--sh)}
.sc-lbl{font-size:.44rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--m2);margin-bottom:.26rem}
.sc-val{font-family:var(--mono);font-size:1.1rem;font-weight:700;line-height:1}
.sc-sub{font-size:.55rem;color:var(--m2);margin-top:.2rem;font-family:var(--mono)}
.sc-top{border-top:2.5px solid}

/* ── HEAT ── amounts → purple shades then warm */
.h0{color:#7C3AED}.h1{color:#6D28D9}.h2{color:#059669}.h3{color:#0D9488}
.h4{color:#CA8A04}.h5{color:#D97706}.h6{color:#EA580C}.h7{color:#DC2626}
.h8{color:#B91C1C}.h9{color:#991B1B}

/* ── NOTES ── */
.note{display:flex;align-items:center;gap:7px;padding:.42rem .8rem;border-radius:var(--rs);
  font-size:.67rem;font-weight:700;margin-bottom:.45rem;border-left:3px solid}
.n-pur{background:var(--p-lt);border-color:var(--p1);color:var(--p-dk)}
.n-grn{background:var(--grn-lt);border-color:var(--grn);color:#065F46}
.n-amb{background:var(--amb-lt);border-color:var(--amb);color:#78350F}
.n-red{background:var(--rose-lt);border-color:var(--rose);color:#9F1239}
.n-sky{background:var(--sky-lt);border-color:var(--sky);color:var(--sky)}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;
  font-size:.48rem;font-weight:800;letter-spacing:.04em;border:1px solid;white-space:nowrap}
.tag-rent     {background:#EEF2FF;border-color:#C7D2FE;color:#3730A3}
.tag-family   {background:var(--p-lt);border-color:var(--p4);color:var(--p-dk)}
.tag-savings  {background:var(--grn-lt);border-color:var(--grn-bd);color:#065F46}
.tag-vegetable{background:#F0FDF4;border-color:#BBF7D0;color:#15803D}
.tag-uber     {background:var(--rose-lt);border-color:var(--rose-bd);color:var(--rose)}
.tag-yescc    {background:var(--amb-lt);border-color:var(--amb-bd);color:#92400E}
.tag-recharge {background:var(--sky-lt);border-color:var(--sky-bd);color:var(--sky)}
.tag-entertainment{background:var(--pnk-lt);border-color:var(--pnk-bd);color:var(--pnk)}
.tag-other    {background:var(--s1);border-color:var(--bd2);color:var(--m1)}
.tag-furniture{background:var(--org-lt);border-color:var(--org-bd);color:var(--org)}
.tag-untagged {background:var(--s2);border-color:var(--bd2);color:var(--m2)}

/* ── INPUTS ── */
input,select,textarea{width:100%;background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);
  border-radius:var(--rs);font-family:var(--sans);font-size:.8rem;font-weight:600;
  padding:.5rem .8rem;outline:none;transition:border-color .15s,box-shadow .15s;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(139,92,246,.15);background:var(--s0)}
input::placeholder{color:var(--m2)}
label{font-size:.54rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--m1);display:block;margin-bottom:4px}

/* ── BUTTONS ── */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:.6rem 1rem;
  border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--sans);font-weight:800;
  font-size:.78rem;transition:all .12s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-pri{background:linear-gradient(135deg,var(--p-dk),var(--p1));color:#fff;box-shadow:0 3px 14px rgba(124,58,237,.35)}
.btn-sec{background:var(--s0);border:1.5px solid var(--bd);color:var(--m1)}
.btn-red{background:var(--rose-lt);border:1px solid var(--rose-bd);color:var(--rose)}
.btn-sm{padding:.3rem .7rem;font-size:.63rem;width:auto}
.del-btn{background:none;border:none;color:var(--m2);cursor:pointer;padding:4px 6px;
  border-radius:6px;font-size:.78rem;transition:color .1s;flex-shrink:0}
.del-btn:hover{color:var(--rose)}

/* ── BAR ── */
.bw{background:var(--s1);border-radius:99px;height:4px;margin-top:5px;overflow:hidden}
.bf{height:4px;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── UPLOAD ── */
.upload-zone{border:2px dashed var(--bd2);border-radius:var(--r);padding:2rem 1rem;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--s0)}
.upload-zone.drag,.upload-zone:hover{border-color:var(--p2);background:var(--p-lt)}
.upload-zone input{display:none}

/* ── TRANSACTION ROWS ── */
.txn-list{background:var(--s0);border:1.5px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:.5rem;box-shadow:var(--sh)}
.txn-row{display:flex;align-items:flex-start;gap:.5rem;padding:.58rem .85rem;border-bottom:1px solid var(--bd);transition:background .1s}
.txn-row:last-child{border-bottom:none}
.txn-row:hover{background:var(--s1)}
.txn-left{flex:1;min-width:0}
.txn-date{font-size:.5rem;color:var(--m2);font-family:var(--mono);margin-bottom:2px}
.txn-recv{font-size:.72rem;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amt{font-family:var(--mono);font-weight:700;font-size:.82rem}
.tag-sel{background:var(--s1);border:1.5px solid var(--bd);color:var(--tx);border-radius:99px;
  font-family:var(--sans);font-size:.5rem;font-weight:800;padding:2px 8px;
  outline:none;cursor:pointer;width:auto}
.tag-sel:focus{border-color:var(--p2)}

/* ── WATERFALL ── */
.wf-row{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--bd)}
.wf-row:last-child{border-bottom:none}
.wf-lbl{font-size:.68rem;color:var(--m1);font-weight:500}
.wf-val{font-family:var(--mono);font-weight:700;font-size:.72rem}

/* ── CAT ROW ── */
.cat-row{display:flex;align-items:center;gap:.5rem;padding:.48rem 0;border-bottom:1px solid var(--bd)}
.cat-row:last-child{border-bottom:none}
.cat-icon{font-size:.9rem;width:24px;text-align:center;flex-shrink:0}
.cat-name{font-size:.72rem;font-weight:700}
.cat-cnt{font-size:.52rem;color:var(--m2);font-family:var(--mono)}
.cat-amt{font-family:var(--mono);font-weight:700;font-size:.8rem}

/* ── TAB BAR ── */
.tab-bar{display:flex;background:var(--s1);border-radius:11px;padding:3px;margin-bottom:.7rem;gap:2px;border:1.5px solid var(--bd)}
.tab{flex:1;padding:.3rem .25rem;border:none;border-radius:8px;cursor:pointer;font-family:var(--sans);
  font-size:.48rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--m2);background:transparent;transition:all .15s;white-space:nowrap}
.tab.on{color:var(--p1);background:var(--s0);box-shadow:var(--sh)}

/* ── INS ROW ── */
.ins-row{display:flex;justify-content:space-between;align-items:center;padding:.42rem 0;border-bottom:1px solid var(--bd)}
.ins-row:last-child{border-bottom:none}
.ins-lbl{font-size:.68rem;color:var(--m1);font-weight:500}
.ins-val{font-family:var(--mono);font-weight:700;font-size:.73rem}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;padding:2.2rem 1rem;text-align:center;
  gap:.45rem;background:var(--s0);border:1.5px dashed var(--bd2);border-radius:var(--r)}
.empty-icon{font-size:2.2rem}.empty-title{font-size:.85rem;font-weight:800;color:var(--m1)}
.empty-body{font-size:.68rem;color:var(--m2);max-width:200px;line-height:1.5}

/* ── MONEY ITEM ── */
.money-item{display:flex;align-items:center;gap:.45rem;padding:.48rem 0;border-bottom:1px solid var(--bd)}
.money-item:last-child{border-bottom:none}

/* ── WEEKEND CARD ── */
.wknd-card{background:var(--s0);border:1.5px solid var(--pnk-bd);border-radius:var(--r);overflow:hidden;margin-bottom:.5rem;box-shadow:var(--sh)}
.wknd-head{display:flex;justify-content:space-between;align-items:center;padding:.6rem .85rem;
  background:linear-gradient(135deg,var(--pnk-lt),#FDF2F8);border-bottom:1px solid var(--pnk-bd)}
.wknd-day{display:flex;justify-content:space-between;align-items:center;padding:.42rem .85rem;border-bottom:1px solid var(--bd)}
.wknd-day:last-child{border-bottom:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--p-dk),var(--p1));color:#fff;padding:.42rem 1.2rem;
  border-radius:99px;font-size:.68rem;font-weight:800;z-index:200;animation:fu .18s ease;
  white-space:nowrap;box-shadow:0 4px 20px rgba(124,58,237,.35)}
@keyframes fu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── PILL ── */
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:99px;
  font-size:.5rem;font-weight:800;letter-spacing:.05em;border:1px solid;white-space:nowrap}
.pill-pur{background:var(--p-lt);border-color:var(--p4);color:var(--p-dk)}
.pill-grn{background:var(--grn-lt);border-color:var(--grn-bd);color:var(--grn)}
.pill-pnk{background:var(--pnk-lt);border-color:var(--pnk-bd);color:var(--pnk)}

/* ── GRADIENT BG ACCENT ── */
.grad-bg{background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:var(--r);color:#fff;padding:1rem;margin-bottom:.5rem;box-shadow:var(--sh2)}

hr{border:none;border-top:1px solid var(--bd);margin:.6rem 0}
.row{display:flex;align-items:center;gap:.5rem}
.f1{flex:1}
.mb{margin-bottom:.5rem}

@media(max-width:380px){.g3{grid-template-columns:1fr 1fr}.ph-title{font-size:1rem}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const{createElement:h,useState,useEffect,useRef,useMemo,useCallback}=React;

// ── STORAGE KEYS ───────────────────────────────────────────────────────────
const LS={
  RAW:'sa_raw_v4',       // parsed raw transactions (JSON array)
  TAGS:'sa_tags_v4',     // {ref: tag}
  SET:'sa_settings_v4',  // settings object
  MAN:'sa_manual_v4',    // manual flows
};
function ls_get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function ls_set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

// ── TAG DEFINITIONS ────────────────────────────────────────────────────────
const TAGS=['rent','family','savings','vegetable','uber','yescc','recharge','entertainment','other','furniture','untagged'];
const TM={
  rent:         {icon:'🏠',label:'Rent'},
  family:       {icon:'👨‍👩‍👧',label:'Family'},
  savings:      {icon:'💰',label:'Savings'},
  vegetable:    {icon:'🥦',label:'Vegetable'},
  uber:         {icon:'🚗',label:'Uber'},
  yescc:        {icon:'💳',label:'YES CC'},
  recharge:     {icon:'📱',label:'Recharge'},
  entertainment:{icon:'🎉',label:'Fun'},
  other:        {icon:'🧾',label:'Other'},
  furniture:    {icon:'🪑',label:'Furniture'},
  untagged:     {icon:'❓',label:'Untagged'},
};

// ── HELPERS ────────────────────────────────────────────────────────────────
const fmt=n=>'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const fmtK=n=>n>=1000?'₹'+(n/1000).toFixed(1)+'k':'₹'+Math.round(n);
const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;

function parseDate(str){const[d,m,y]=str.split('/');return new Date(+y,+m-1,+d)}
function isWeekend(d){const w=d.getDay();return w===0||w===6}
function weekOfMonth(d){const f=new Date(d.getFullYear(),d.getMonth(),1);return Math.ceil((d.getDate()+f.getDay())/7)}

// Extract display name from receiver: text after @ up to ( or end
function cleanRecv(recv){
  if(!recv)return recv;
  const m=recv.match(/@([^(@]+)/);
  return m?m[1].split('(')[0].trim():recv;
}

const HEAT_T=[100,250,500,800,1200,2000,3500,5000,10000];
const HEAT_C=['#7C3AED','#6D28D9','#059669','#0D9488','#CA8A04','#D97706','#EA580C','#DC2626','#B91C1C','#991B1B'];
function heatCls(n){const i=HEAT_T.findIndex(t=>n<t);return'h'+(i===-1?9:i)}
function heatHex(n){const i=HEAT_T.findIndex(t=>n<t);return HEAT_C[i===-1?9:i]}

// ── AUTO-TAGGER ────────────────────────────────────────────────────────────
function autoTag(txn){
  const recv=(txn.receiver||'').toUpperCase();
  const vpa=(txn.receiverVpa||'').toLowerCase();
  const[hh,mm]=txn.time.split(':').map(Number);
  const mins=hh*60+mm;
  const date=parseDate(txn.date);
  const dow=date.getDay();
  const we=dow===0||dow===6;
  const wd=dow>=1&&dow<=5;
  const amt=txn.amount;

  // YES Credit Card — bank column
  if(txn.isYesCC) return 'yescc';

  // Named keywords (check receiver name in parens)
  if(recv.includes('ANKA')) return 'rent';
  if(recv.includes('UMAR')) return 'family';
  if(recv.includes('UBEY')) return 'savings';
  if(recv.includes('MOJO')) return 'furniture';

  // Recharge: @icici or @airtel in VPA
  if(vpa.includes('@icici')||vpa.includes('@airtel')||vpa.includes('rxairtel')) return 'recharge';
  // Also Jio recharge
  if(recv.includes('JIO')) return 'recharge';

  // Sunday 17:30–19:00 → vegetable
  if(dow===0&&mins>=17*60+30&&mins<=19*60) return 'vegetable';

  // Weekday 08:50–09:40 or 18:10–19:30 → uber
  if(wd&&((mins>=8*60+50&&mins<=9*60+40)||(mins>=18*60+10&&mins<=19*60+30))) return 'uber';

  // Weekend non-vegetable → entertainment
  if(we) return 'entertainment';

  // Weekday < 500 → other, ≥ 500 → untagged
  if(wd&&amt<500) return 'other';
  return 'untagged';
}

// ── PARSER ─────────────────────────────────────────────────────────────────
function parseHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const rows=doc.querySelectorAll('table tr');
  const txns=[];let first=true;
  rows.forEach(row=>{
    if(first){first=false;return}
    const cells=Array.from(row.querySelectorAll('td,th')).map(c=>c.innerText.trim());
    if(cells.length<11)return;
    const[date,time,bank,acct,,receiver,ref,,amount,drCr,status]=cells;
    if(!date||status!=='SUCCESS')return;
    // include both DR and CR? No — only DR
    if(drCr!=='DR')return;
    const isYesCC=bank.toUpperCase().includes('CREDIT');
    // Extract VPA from receiver string (full raw)
    const vpam=receiver.match(/^([^(]+)/);
    const receiverVpa=vpam?vpam[1].trim():'';
    txns.push({date,time,bank,receiver,receiverVpa,ref,amount:parseFloat(amount)||0,isYesCC});
  });
  const seen=new Set(),out=[];
  for(const t of txns){if(!seen.has(t.ref)){seen.add(t.ref);out.push(t)}}
  return out;
}

// ── SALARY DATE AUTO-DETECT ────────────────────────────────────────────────
function detectSalaryDate(rawTxns){
  // Find earliest txn with ANKA, UMAR, UBEY, or MOJO in receiver
  const keywords=['ANKA','UMAR','UBEY','MOJO'];
  const hits=rawTxns.filter(t=>keywords.some(k=>t.receiver.toUpperCase().includes(k)));
  if(!hits.length)return null;
  hits.sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  return hits[0].date; // DD/MM/YYYY
}

  return h('div',{className:'bw'},h('div',{className:'bf',style:{width:p+'%',background:heatHex(spend)}}));
}

    lent:  {icon:'🤝',color:'var(--p2)',hint:'Money you gave out to return'},
  };
  const sec=SEC[tab];
  const list=manual[tab]||[];
  const total=list.reduce((a,i)=>a+i.amount,0);
  const cashSpend=manual.cashSpend||0;
  return h('div',{className:'page'},
    h('div',{className:'ph'},h('div',{className:'ph-title'},'Money Flows'),h('div',{className:'ph-sub'},'All deducted from balance')),
    h('div',{className:'tab-bar'},
      ['debts','savings','lent','cash'].map(t=>
        h('button',{key:t,className:`tab${tab===t?' on':''}`,onClick:()=>setTab(t)},
          (SEC[t]?.icon||'💵')+' '+(t==='cash'?'Cash':t.charAt(0).toUpperCase()+t.slice(1))
        )
      )
    ),
    tab!=='cash'
      ?h('div',null,
        h('div',{className:'note',style:{background:`${sec.color}12`,borderColor:sec.color,color:sec.color}},sec.icon+' '+sec.hint),
        list.length===0
          ?h('div',{className:'empty',style:{marginBottom:'.5rem'}},h('div',{className:'empty-icon'},sec.icon),h('div',{className:'empty-title'},'None added'))
          :h('div',{className:'card mb'},
            list.map(item=>
              h('div',{key:item.id,className:'money-item'},
                h('div',{className:'f1',style:{display:'flex',flexDirection:'column',gap:4}},
                  h('input',{type:'text',value:item.label,placeholder:'Label…',onChange:e=>updItem(tab,item.id,'label',e.target.value),style:{padding:'.3rem .6rem',fontSize:'.72rem'}}),
                  h('input',{type:'number',value:item.amount||'',inputMode:'numeric',placeholder:'Amount',onChange:e=>updItem(tab,item.id,'amount',parseFloat(e.target.value)||0),style:{padding:'.3rem .6rem',fontSize:'.72rem'}})
                ),
                h('button',{className:'del-btn',onClick:()=>delItem(tab,item.id)},'✕')
              )
            ),
            h('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'.45rem',borderTop:'1px solid var(--bd)',marginTop:'.2rem'}},
              h('span',{style:{fontSize:'.62rem',fontWeight:700,color:'var(--m1)'}},'Total'),
              h('span',{style:{fontFamily:'var(--mono)',fontWeight:900,fontSize:'.88rem',color:sec.color}},fmt(total))
            )
          ),
        h('button',{className:'btn btn-sec btn-sm',style:{marginBottom:'.5rem'},onClick:()=>addItem(tab)},'+ Add')
      )
      :h('div',null,
        h('div',{className:'note n-amb'},'💵 Cash purchases not in bank history'),
        h('div',{className:'card'},
          h('label',null,'Total cash spent'),
          h('input',{type:'number',inputMode:'numeric',value:cashSpend||'',placeholder:'0',onChange:e=>onManualChange({...manual,cashSpend:parseFloat(e.target.value)||0})}),
          cashSpend>0&&h('div',{style:{marginTop:'.4rem',fontSize:'.62rem',fontFamily:'var(--mono)',color:'var(--amb)',fontWeight:700}},'−'+fmt(cashSpend)+' from balance')
        )
      )
  );
}

// ── SETTINGS PAGE ─────────────────────────────────────────────────────────
function SettingsPage({settings,onSave,txnCount,autoDate,toast}){
  const[loc,setLoc]=useState({...settings});
  function save(){onSave(loc);toast('Saved ✓')}

  return h('div',{className:'page'},
    h('div',{className:'ph'},h('div',{className:'ph-title'},'Settings'),h('div',{className:'ph-sub'},txnCount+' transactions')),

    h('div',{className:'sh'},'Income'),
    h('div',{className:'card'},
      h('div',{className:'mb'},
        h('label',null,'Monthly salary'),
        h('input',{type:'number',inputMode:'numeric',value:loc.salary||'',placeholder:'e.g. 102844',onChange:e=>setLoc({...loc,salary:parseFloat(e.target.value)||0})})
      ),
      h('div',{className:'mb'},
        h('label',null,'Cash in hand (added to salary)'),
        h('input',{type:'number',inputMode:'numeric',value:loc.cashInHand||'',placeholder:'0',onChange:e=>setLoc({...loc,cashInHand:parseFloat(e.target.value)||0})}),
        h('div',{style:{fontSize:'.58rem',color:'var(--m2)',marginTop:3}},'This is added to your total income')
      ),
      h('div',null,
        h('label',null,'SBI credit card spent (enter manually)'),
        h('input',{type:'number',inputMode:'numeric',value:loc.sbiSpent||'',placeholder:'0',onChange:e=>setLoc({...loc,sbiSpent:parseFloat(e.target.value)||0})}),
        h('div',{style:{fontSize:'.58rem',color:'var(--m2)',marginTop:3}},'Deducted from your balance')
      )
    ),

    h('div',{className:'sh'},'Salary Start Date'),
    h('div',{className:'card'},
      autoDate&&h('div',{className:'note n-grn',style:{marginBottom:'.5rem'}},'✓ Auto-detected: '+autoDate+' (date of first ANKA/UMAR/UBEY/MOJO payment)'),
      h('div',null,
        h('label',null,'Override start date (optional)'),
        h('input',{type:'date',value:loc.salaryDate||'',onChange:e=>setLoc({...loc,salaryDate:e.target.value})}),
        h('div',{style:{fontSize:'.58rem',color:'var(--m2)',marginTop:3}},'Leave blank to use auto-detected date. Only transactions from this date are counted.')
      )
    ),

    h('button',{className:'btn btn-pri',style:{marginTop:'.3rem',marginBottom:'.5rem'},onClick:save},'✓ Save Settings'),

    h('div',{className:'sh'},'Auto-tag Rules'),
    h('div',{className:'card'},
      [
        ['YES BANK CREDIT CARD','→ YES CC (auto from bank column)','yescc'],
        ['ANKA receiver','→ Rent','rent'],
        ['UMAR receiver','→ Family','family'],
        ['UBEY receiver','→ Savings','savings'],
        ['MOJO receiver','→ Furniture Rent','furniture'],
        ['@icici / @airtel / Jio','→ Recharge','recharge'],
        ['Sunday 5:30–7 PM','→ Vegetable','vegetable'],
        ['Weekday 8:50–9:40 AM / 6:10–7:30 PM','→ Uber','uber'],
        ['Weekend (other)','→ Entertainment','entertainment'],
        ['Weekday < ₹500','→ Other','other'],
        ['Weekday ≥ ₹500','→ Untagged (manual)','untagged'],
      ].map(([rule,tag,cls],i,arr)=>
        h('div',{key:i,style:{display:'flex',alignItems:'center',gap:'.5rem',padding:'.26rem 0',borderBottom:i<arr.length-1?'1px solid var(--bd)':'none'}},
          h('span',{style:{fontSize:'.65rem',color:'var(--m1)',flex:1}},rule),
          h('span',{className:`tag tag-${cls}`,style:{flexShrink:0}},tag)
        )
      )
    ),

    h('div',{className:'sh',style:{color:'var(--rose)'}},'Danger'),
    h('button',{className:'btn btn-red',onClick:()=>{
      if(confirm('Clear all saved data?')){
        Object.values(LS).forEach(k=>localStorage.removeItem(k));
        window.location.reload();
      }
    }},'🗑 Clear all saved data')
  );
}

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  // Load everything from localStorage on mount
  const[settings,setSettings]=useState(()=>ls_get(LS.SET,{salary:0,cashInHand:0,sbiSpent:0,salaryDate:''}));
  const[tagMap,setTagMap]=useState(()=>ls_get(LS.TAGS,{}));
  const[manual,setManual]=useState(()=>ls_get(LS.MAN,{debts:[],savings:[],lent:[],cashSpend:0}));
  const[rawTxns,setRawTxns]=useState(()=>ls_get(LS.RAW,[]));  // ← persisted!
  const[page,setPage]=useState(()=>ls_get(LS.RAW,[]).length>0?'overview':'upload');
  const[toastMsg,setToastMsg]=useState('');
  const toastRef=useRef();

  function toast(msg){
    setToastMsg(msg);
    if(toastRef.current)clearTimeout(toastRef.current);
    toastRef.current=setTimeout(()=>setToastMsg(''),2400);
  }

  // Persist all state changes
  useEffect(()=>{ls_set(LS.SET,settings)},[settings]);
  useEffect(()=>{ls_set(LS.TAGS,tagMap)},[tagMap]);
  useEffect(()=>{ls_set(LS.MAN,manual)},[manual]);
  useEffect(()=>{ls_set(LS.RAW,rawTxns)},[rawTxns]);

  // Auto-detect salary date from saved raw txns
  const autoDate=useMemo(()=>{
    const d=detectSalaryDate(rawTxns);
    return d||null;
  },[rawTxns]);

  // Effective cutoff: override > auto > none
  const cutoffDate=useMemo(()=>{
    if(settings.salaryDate)return new Date(settings.salaryDate);
    if(autoDate){const[d,m,y]=autoDate.split('/');return new Date(+y,+m-1,+d);}
    return null;
  },[settings.salaryDate,autoDate]);

  // Build display txns with tags applied + cutoff filter
  const txns=useMemo(()=>
    rawTxns
      .filter(t=>!cutoffDate||parseDate(t.date)>=cutoffDate)
      .map(t=>({...t,tag:tagMap[t.ref]||(t.autoTag||'untagged')}))
  ,[rawTxns,tagMap,cutoffDate]);

  function handleLoad(html){
    const parsed=parseHTML(html);
    // Merge with existing: keep existing refs, add new ones
    const existingRefs=new Set(rawTxns.map(t=>t.ref));
    const newTxns=parsed.filter(t=>!existingRefs.has(t.ref)).map(t=>({...t,autoTag:autoTag(t)}));
    // Re-tag all existing too (in case autoTag logic changed)
    const existingRetagged=rawTxns.map(t=>({...t,autoTag:autoTag(t)}));
    const merged=[...existingRetagged,...newTxns];
    setRawTxns(merged);
    setPage('overview');
    toast(`${merged.length} total · ${newTxns.length} new · tags preserved ✓`);
  }

  function handleTagChange(ref,tag){setTagMap(prev=>({...prev,[ref]:tag}))}
  function handleSettingsSave(s){setSettings(s)}
  function handleManualChange(m){setManual(m)}

  const hasData=rawTxns.length>0;
  const untagCnt=txns.filter(t=>t.tag==='untagged').length;

  const navItems=[
    {id:'upload',  label:'Upload'},
    {id:'overview',label:'Overview'},
    {id:'tag',     label:untagCnt>0?`Tag ${untagCnt}`:'Tag'},
    {id:'insights',label:'Insights'},
    {id:'money',   label:'Money'},
    {id:'settings',label:'Settings'},
  ];

  function navIcon(id){
    if(id==='upload')   return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'17 8 12 3 7 8'}),h('line',{x1:12,y1:3,x2:12,y2:15}));
    if(id==='overview') return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:3,y:3,width:7,height:7,rx:1}),h('rect',{x:14,y:3,width:7,height:7,rx:1}),h('rect',{x:3,y:14,width:7,height:7,rx:1}),h('rect',{x:14,y:14,width:7,height:7,rx:1}));
    if(id==='tag')      return h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z'}),h('line',{x1:7,y1:7,x2:7.01,y2:7}));
    if(id==='insights') return h('svg',{viewBox:'0 0 24 24'},h('polyline',{points:'22 12 18 12 15 21 9 3 6 12 2 12'}));
    if(id==='money')    return h('svg',{viewBox:'0 0 24 24'},h('rect',{x:2,y:5,width:20,height:14,rx:2}),h('line',{x1:2,y1:10,x2:22,y2:10}));
    if(id==='settings') return h('svg',{viewBox:'0 0 24 24'},h('circle',{cx:12,cy:12,r:3}),h('path',{d:'M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'}));
  }

  const needsData=['overview','tag','insights'].includes(page)&&!hasData;

  return h('div',null,
    page==='upload'   &&h(UploadPage,   {onLoad:handleLoad,hasSaved:hasData}),
    page==='overview' &&(needsData?null:h(OverviewPage, {txns,settings,manual})),
    page==='tag'      &&(needsData?null:h(TagPage,      {txns,onTagChange:handleTagChange})),
    page==='insights' &&(needsData?null:h(InsightsPage, {txns,settings,manual})),
    page==='money'    &&h(MoneyPage,   {manual,onManualChange:handleManualChange}),
    page==='settings' &&h(SettingsPage,{settings,onSave:handleSettingsSave,txnCount:txns.length,autoDate,toast}),

    needsData&&h('div',{style:{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(243,240,255,.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:50,backdropFilter:'blur(4px)'}},
      h('div',{className:'card',style:{maxWidth:'260px',textAlign:'center',padding:'1.5rem',border:'1.5px solid var(--p4)'}},
        h('div',{style:{fontSize:'2rem',marginBottom:'.5rem'}},'📂'),
        h('div',{style:{fontWeight:900,marginBottom:'.35rem'}},'No transactions'),
        h('div',{style:{fontSize:'.7rem',color:'var(--m2)',marginBottom:'.75rem'}},'Upload your YES Bank transaction HTML.'),
        h('button',{className:'btn btn-pri',onClick:()=>setPage('upload')},'Go to Upload')
      )
    ),

    h('nav',{className:'nav'},
      navItems.map(n=>
        h('button',{key:n.id,className:`nb${page===n.id?' on':''}`,onClick:()=>setPage(n.id)},
          navIcon(n.id),
          h('span',{style:{fontSize:'.41rem',fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase'}},n.label),
          h('span',{className:'nb-pip'})
        )
      )
    ),
    h(Toast,{msg:toastMsg})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
