<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Budget Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;height:100dvh;overflow:hidden;background:#F0ECFF}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}
button{-webkit-user-select:none;user-select:none}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
'use strict';
const{createElement:h,useState,useEffect,useMemo}=React;

/* ══════════════════════════ STORAGE ══════════════════════════ */
const SK='budget_tracker_v1';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

/* ══════════════════════════ PALETTE ══════════════════════════ */
const C={
  bg:'#F0ECFF', card:'#FFFFFF', card2:'#F5F3FF',
  border:'#E0D9FF', border2:'#CAC0F0',
  text:'#1A0A3C', text2:'#6B5FA0', text3:'#9E8EC4',
  red:'#E11D48', redlt:'#FFF1F2',
  green:'#059669', greenlt:'#ECFDF5',
  orange:'#D97706', orangelt:'#FFFBEB',
  purple:'#7C3AED', purplelt:'#EDE9FE',
  nav:'#FFFFFF',
  shadow:'0 2px 12px rgba(109,40,217,.10)',
  shadow2:'0 4px 20px rgba(109,40,217,.15)',
};

/* ══════════════════════════ CATEGORY TREE ══════════════════════════ */
const CATEGORIES=[
  {id:'fixed',name:'Fixed Expenses',icon:'\uD83C\uDFE0',color:'#EF5350',subs:[
    {id:'rent',name:'Rent',icon:'\uD83C\uDFE0'},
    {id:'milk',name:'Milk',icon:'\uD83E\uDD5B'},
    {id:'electricity',name:'Electricity',icon:'\u26A1'},
    {id:'furniture',name:'Furniture Bill',icon:'\uD83E\uDE91'},
    {id:'wifi',name:'WiFi',icon:'\uD83D\uDCF6'},
    {id:'maid',name:'Maid',icon:'\uD83E\uDDF9'},
    {id:'garbage',name:'Garbage',icon:'\uD83D\uDDD1\uFE0F'},
  ]},
  {id:'savings',name:'Savings',icon:'\uD83D\uDCB0',color:'#66BB6A',subs:[
    {id:'mf',name:'Mutual Fund',icon:'\uD83D\uDCC8'},
    {id:'rd',name:'RD',icon:'\uD83C\uDFE6'},
  ]},
  {id:'variable',name:'Variable Expenses',icon:'\uD83D\uDED2',color:'#7E57C2',subs:[
    {id:'vegetable',name:'Vegetable',icon:'\uD83E\uDD66'},
    {id:'entertainment',name:'Entertainment',icon:'\uD83C\uDFAC'},
    {id:'amazon',name:'Amazon',icon:'\uD83D\uDCE6'},
    {id:'food',name:'Food',icon:'\uD83C\uDF5C'},
    {id:'uber',name:'Uber',icon:'\uD83D\uDE97'},
    {id:'grocery',name:'Grocery',icon:'\uD83D\uDECD\uFE0F'},
    {id:'misc',name:'Misc',icon:'\uD83E\uDDFE'},
  ]},
  {id:'debts',name:'Debts',icon:'\uD83E\uDCB3',color:'#8D6E63',subs:[
    {id:'familydebt',name:'Family Debts',icon:'\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC67'},
    {id:'personaldebt',name:'Personal Debts',icon:'\uD83E\uDDFE'},
  ]},
  {id:'support',name:'Support',icon:'\uD83E\uDD1D',color:'#EC407A',subs:[
    {id:'family',name:'Family',icon:'\uD83D\uDC68\u200D\uD83D\uDC69\u200D\uD83D\uDC66'},
  ]},
];
const ALL_SUBS=CATEGORIES.flatMap(c=>c.subs.map(s=>({...s,catId:c.id,catName:c.name,catColor:c.color})));
const getSub=id=>ALL_SUBS.find(s=>s.id===id)||{name:id,icon:'\uD83D\uDCB8',catColor:C.purple,catId:'',catName:''};
const getCat=id=>CATEGORIES.find(c=>c.id===id)||{name:id,icon:'\uD83D\uDCB8',color:C.purple};
// User-added custom subcategories (data.customSubs) get merged in alongside
// the built-in ones wherever categories/subcategories are listed or looked up.
function categoriesFor(data){
  const customSubs=(data&&data.customSubs)||[];
  return CATEGORIES.map(c=>({...c,subs:[...c.subs,...customSubs.filter(s=>s.catId===c.id).map(s=>({id:s.id,name:s.name,icon:s.icon||'\uD83C\uDFF7\uFE0F'}))]}));
}
function allSubsFor(data){
  return categoriesFor(data).flatMap(c=>c.subs.map(s=>({...s,catId:c.id,catName:c.name,catColor:c.color})));
}
function getSubFor(id,data){
  return allSubsFor(data).find(s=>s.id===id)||getSub(id);
}

const SOURCES=[
  {id:'debit',name:'Debit Account',short:'Debit',color:'#7C3AED'},
  {id:'sbi',  name:'SBI Credit Card',short:'SBI',  color:'#2563EB'},
  {id:'yes',  name:'YES Credit Card',short:'YES',  color:'#D97706'},
];
const getSrc=id=>SOURCES.find(s=>s.id===id)||SOURCES[0];

/* ══════════════════════════ HELPERS ══════════════════════════ */
const fmt=n=>'\u20B9'+Math.round((parseFloat(n)||0)*100)/100;
const fmt2=n=>{const v=parseFloat(n)||0;return '\u20B9'+v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fmtC=n=>{const v=Math.round(parseFloat(n)||0);return (v<0?'\u2212':'')+'\u20B9'+Math.abs(v).toLocaleString('en-IN')};
const today=()=>new Date().toISOString().slice(0,10);
const curYm=()=>today().slice(0,7);
const prevM=m=>{const d=new Date(m+'-01T00:00:00');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)};
const nextM=m=>{const d=new Date(m+'-01T00:00:00');d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7)};
const monthLabel=m=>{const[y,mo]=m.split('-');const N=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return N[+mo-1]+' '+y};
const genId=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function defaultMonth(){return{income:{salary:0,other:0,extras:[]},uncategorized:{debit:0,sbi:0,yes:0},transactions:[]}}
function defaultData(){
  const budgets={};ALL_SUBS.forEach(s=>budgets[s.id]=0);
  return{budgets,budgetNotes:{},cardLimits:{sbi:0,yes:0},balances:null,cardInputMode:'remaining',lastCalc:null,balanceLog:[],customSubs:[],months:{}};
}
// Reads a month's data, normalizing legacy shapes (uncategorized used to be a
// single number; it's now split per payment source).
function getMonth(data,ym){
  const md=data.months[ym];
  if(!md)return defaultMonth();
  let unc=md.uncategorized;
  if(typeof unc==='number')unc={debit:unc,sbi:0,yes:0};
  if(!unc)unc={debit:0,sbi:0,yes:0};
  return{...md,uncategorized:{debit:+unc.debit||0,sbi:+unc.sbi||0,yes:+unc.yes||0}};
}
// Returns a working clone of months[ym] (creating it from data if it doesn't
// exist yet in the working copy), inserts it into `months`, and returns the
// SAME object reference so callers can mutate its fields directly and have
// that reflected in `months` without re-assigning.
function cloneMonthEntry(data,months,ym){
  const existing=months[ym]||getMonth(data,ym);
  const clone={income:existing.income,uncategorized:{...existing.uncategorized},transactions:[...existing.transactions]};
  months[ym]=clone;
  return clone;
}
function uncategorizedTotal(md){return(+md.uncategorized.debit||0)+(+md.uncategorized.sbi||0)+(+md.uncategorized.yes||0)}
function monthIncome(md){return (+md.income.salary||0)+(+md.income.other||0)+md.income.extras.reduce((s,e)=>s+(+e.amount||0),0)}
function subBudget(data,subId){return +data.budgets[subId]||0}
function catBudgetSum(data,catId){const cat=categoriesFor(data).find(c=>c.id===catId);return cat?cat.subs.reduce((s,sub)=>s+subBudget(data,sub.id),0):0}
function totalBudget(data){return allSubsFor(data).reduce((s,sub)=>s+subBudget(data,sub.id),0)}
function subSpent(md,subId){return md.transactions.filter(t=>t.subId===subId).reduce((s,t)=>s+t.amount,0)}
function catSpent(md,catId){return md.transactions.filter(t=>t.catId===catId).reduce((s,t)=>s+t.amount,0)}
function totalSpent(md){return md.transactions.reduce((s,t)=>s+t.amount,0)}
// True total money that has left the accounts this month: categorized
// transactions PLUS whatever is still sitting in the uncategorized buckets
// (that money has already been spent in real life, just not sorted yet).
function totalSpentAll(md){return totalSpent(md)+uncategorizedTotal(md)}
function statusFor(spent,budget){
  if(budget<=0)return spent>0?{label:'Over Budget',color:C.red,bg:C.redlt}:{label:'No Budget',color:C.text3,bg:C.card2};
  const pct=spent/budget*100;
  if(pct>100)return{label:'Over Budget',color:C.red,bg:C.redlt};
  if(pct>=80)return{label:'Near Budget',color:C.orange,bg:C.orangelt};
  return{label:'Under Budget',color:C.green,bg:C.greenlt};
}

/* ══════════════════════════ PDF REPORT ══════════════════════════ */
function hex01(hex){
  const h=hex.replace('#','');
  return[parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];
}
// pdf-lib's standard fonts use WinAnsi encoding, which can't render the ₹
// glyph (or emoji). Use a plain "Rs" prefix for all amounts drawn into the PDF.
function fmtPdf(n){const v=Math.round(parseFloat(n)||0);return(v<0?'-':'')+'Rs '+Math.abs(v).toLocaleString('en-IN')}
function downloadBytes(bytes,filename){
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function buildPdfReport(data){
  const{PDFDocument,rgb,StandardFonts}=window.PDFLib;
  const doc=await PDFDocument.create();
  const font=await doc.embedFont(StandardFonts.Helvetica);
  const bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const PW=595,PH=842,MX=42;
  const col={
    purple:rgb(...hex01('#7C3AED')),purplelt:rgb(...hex01('#EDE9FE')),
    green:rgb(...hex01('#059669')),greenlt:rgb(...hex01('#ECFDF5')),
    red:rgb(...hex01('#E11D48')),redlt:rgb(...hex01('#FFF1F2')),
    orange:rgb(...hex01('#D97706')),orangelt:rgb(...hex01('#FFFBEB')),
    text:rgb(...hex01('#1A0A3C')),text2:rgb(...hex01('#6B5FA0')),text3:rgb(...hex01('#9E8EC4')),
    border:rgb(...hex01('#E0D9FF')),card2:rgb(...hex01('#F5F3FF')),white:rgb(1,1,1),
  };
  const catColors={};categoriesFor(data).forEach(c=>catColors[c.id]=rgb(...hex01(c.color)));
  const srcColors={debit:col.purple,sbi:rgb(...hex01('#2563EB')),yes:col.orange};

  let page=null,y=0;
  function newPage(){page=doc.addPage([PW,PH]);y=PH-MX;return page}
  function ensure(space){if(y-space<MX){newPage();headerBand(currentBandTitle,currentBandColor,true)}}
  let currentBandTitle='',currentBandColor=col.purple;
  function headerBand(title,color,continued){
    currentBandTitle=title;currentBandColor=color;
    page.drawRectangle({x:0,y:PH-64,width:PW,height:64,color});
    page.drawText(title+(continued?'  (cont.)':''),{x:MX,y:PH-40,size:17,font:bold,color:col.white});
    y=PH-64-24;
  }
  function text(str,x,yy,size,f,c){page.drawText(String(str),{x,y:yy,size,font:f||font,color:c||col.text})}
  function rightText(str,xRight,yy,size,f,c){
    const w=(f||font).widthOfTextAtSize(String(str),size);
    page.drawText(String(str),{x:xRight-w,y:yy,size,font:f||font,color:c||col.text});
  }
  function line(x1,yy,x2,yy2,color,thickness){page.drawLine({start:{x:x1,y:yy},end:{x:x2,y:yy2},thickness:thickness||0.75,color:color||col.border})}
  function miniBar(x,yy,w,h,pct,color){
    page.drawRectangle({x,y:yy,width:w,height:h,color:col.card2});
    const fw=Math.max(0,Math.min(100,pct))/100*w;
    if(fw>0)page.drawRectangle({x,y:yy,width:fw,height:h,color});
  }

  const ymKeys=Object.keys(data.months).sort();
  const genDate=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});

  /* ---- Cover page ---- */
  newPage();
  headerBand('Budget Report',col.purple);
  y-=10;
  text('Generated on '+genDate,MX,y,11,font,col.text2); y-=28;
  if(ymKeys.length===0){
    text('No monthly data yet \u2014 add income, budgets, and expenses to see a report here.',MX,y,12,font,col.text2);
  }else{
    text('Overview \u2014 '+ymKeys.length+' month'+(ymKeys.length>1?'s':''),MX,y,13,bold,col.text); y-=22;
    const headers=['Month','Income','Expenses','Savings','Remaining'];
    const colX=[MX,MX+120,MX+230,MX+340,MX+440];
    headers.forEach((hd,i)=>text(hd,colX[i],y,10,bold,col.text2));
    y-=8; line(MX,y,PW-MX,y,col.border,1); y-=16;
    let totInc=0,totExp=0,totSav=0;
    ymKeys.forEach(ym=>{
      const md=getMonth(data,ym);
      const inc=monthIncome(md),exp=totalSpent(md)+uncategorizedTotal(md),sav=catSpent(md,'savings'),rem=inc-exp;
      totInc+=inc;totExp+=exp;totSav+=sav;
      ensure(20);
      text(monthLabel(ym),colX[0],y,10.5,font,col.text);
      text(fmtPdf(inc),colX[1],y,10.5,font,col.green);
      text(fmtPdf(exp),colX[2],y,10.5,font,col.red);
      text(fmtPdf(sav),colX[3],y,10.5,font,col.purple);
      text(fmtPdf(rem),colX[4],y,10.5,font,rem>=0?col.green:col.red);
      y-=18;
    });
    y-=6; line(MX,y,PW-MX,y,col.border,1); y-=18;
    text('Totals',colX[0],y,10.5,bold,col.text);
    text(fmtPdf(totInc),colX[1],y,10.5,bold,col.green);
    text(fmtPdf(totExp),colX[2],y,10.5,bold,col.red);
    text(fmtPdf(totSav),colX[3],y,10.5,bold,col.purple);
    text(fmtPdf(totInc-totExp),colX[4],y,10.5,bold,(totInc-totExp)>=0?col.green:col.red);
  }

  /* ---- One section per month ---- */
  ymKeys.slice().reverse().forEach(ym=>{
    const md=getMonth(data,ym);
    const income=monthIncome(md);
    const catSpentOnly=totalSpent(md);
    const uncatTotal=uncategorizedTotal(md);
    const totalReal=catSpentOnly+uncatTotal;
    const savings=catSpent(md,'savings');
    const remaining=income-totalReal;

    newPage();
    headerBand(monthLabel(ym),col.purple);
    y-=6;

    // Stat cards (2x3 grid-ish, simple row of 5 compact)
    const stats=[['Income',income,col.green],['Expenses',catSpentOnly,col.red],['Savings',savings,col.purple],
      ['Remaining',remaining,remaining>=0?col.green:col.red],['Uncategorized',uncatTotal,col.orange]];
    const boxW=(PW-2*MX-4*8)/5;
    stats.forEach((s,i)=>{
      const bx=MX+i*(boxW+8);
      page.drawRectangle({x:bx,y:y-46,width:boxW,height:46,color:col.card2,borderColor:col.border,borderWidth:0.75});
      text(s[0],bx+6,y-16,7.5,bold,col.text3);
      text(fmtPdf(s[1]),bx+6,y-34,10,bold,s[2]);
    });
    y-=46+22;

    // Category / subcategory budget table
    text('Category Budget Performance',MX,y,13,bold,col.text); y-=18;
    const headers2=['Item','Budget','Spent','%','Status'];
    const cx=[MX,MX+230,MX+310,MX+390,MX+440];
    headers2.forEach((hd,i)=>text(hd,cx[i],y,9.5,bold,col.text2));
    y-=6; line(MX,y,PW-MX,y,col.border,1); y-=14;

    categoriesFor(data).forEach(cat=>{
      const cBudget=catBudgetSum(data,cat.id),cSpent=catSpent(md,cat.id);
      if(cBudget<=0&&cSpent<=0)return;
      ensure(20);
      const cStatus=statusFor(cSpent,cBudget);
      text(cat.name,cx[0],y,10.5,bold,catColors[cat.id]||col.text);
      text(fmtPdf(cBudget),cx[1],y,10,font,col.text2);
      text(fmtPdf(cSpent),cx[2],y,10,font,col.text2);
      text(cBudget?Math.round(cSpent/cBudget*100)+'%':'\u2014',cx[3],y,10,font,col.text2);
      text(cStatus.label,cx[4],y,9,bold,rgb(...hex01(cStatus.color)));
      y-=15;
      cat.subs.forEach(sub=>{
        const b=subBudget(data,sub.id),sp=subSpent(md,sub.id);
        if(b<=0&&sp<=0)return;
        ensure(20);
        const st=statusFor(sp,b);
        text('  '+sub.name,cx[0],y,9.5,font,col.text);
        text(fmtPdf(b),cx[1],y,9.5,font,col.text2);
        text(fmtPdf(sp),cx[2],y,9.5,font,col.text2);
        text(b?Math.round(sp/b*100)+'%':(sp>0?'\u2014':'0%'),cx[3],y,9.5,font,col.text2);
        text(st.label,cx[4],y,8.5,bold,rgb(...hex01(st.color)));
        miniBar(cx[0]+8,y-4,150,3,b?sp/b*100:(sp>0?100:0),rgb(...hex01(st.color)));
        y-=15;
      });
      y-=4;
    });

    // Payment source split
    ensure(70);
    y-=6;
    text('Payment Source Split',MX,y,13,bold,col.text); y-=18;
    SOURCES.forEach(s=>{
      const v=md.transactions.filter(t=>t.source===s.id).reduce((a,t)=>a+t.amount,0);
      ensure(18);
      text(s.name,MX,y,10,font,col.text2);
      rightText(fmtPdf(v),PW-MX,y,10,bold,col.text);
      y-=8;
      miniBar(MX,y-4,PW-2*MX,5,catSpentOnly?v/catSpentOnly*100:0,srcColors[s.id]);
      y-=16;
    });
  });

  // Footer page numbers
  const pages=doc.getPages();
  pages.forEach((p,i)=>{
    p.drawText('Page '+(i+1)+' of '+pages.length+'  \u00B7  Budget Tracker Report',{x:MX,y:20,size:8,font,color:col.text3});
  });

  return await doc.save();
}

/* ══════════════════════════ SMALL UI ══════════════════════════ */
function MonthBar({month,setMonth}){
  return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',background:C.card,borderBottom:`1px solid ${C.border}`,boxShadow:C.shadow}},
    h('button',{onClick:()=>setMonth(prevM(month)),style:{background:C.card2,border:`1px solid ${C.border2}`,color:C.purple,fontSize:18,cursor:'pointer',padding:'4px 14px',borderRadius:10,fontWeight:700}},'\u2039'),
    h('span',{style:{color:C.text,fontWeight:800,fontSize:17}},monthLabel(month)),
    h('button',{onClick:()=>setMonth(nextM(month)),style:{background:C.card2,border:`1px solid ${C.border2}`,color:C.purple,fontSize:18,cursor:'pointer',padding:'4px 14px',borderRadius:10,fontWeight:700}},'\u203A')
  );
}
function Bar({pct,color}){
  const w=Math.max(0,Math.min(100,pct));
  return h('div',{style:{width:'100%',height:8,background:C.card2,borderRadius:99,overflow:'hidden'}},
    h('div',{style:{width:w+'%',height:'100%',background:color,borderRadius:99,transition:'width .3s'}})
  );
}
function Pie({segs,size}){
  size=size||200;const r=size/2-12;const cx=size/2,cy=size/2;
  let a=-Math.PI/2;
  const tot=segs.reduce((s,x)=>s+x.v,0);
  if(!tot)return h('div',{style:{width:size,height:size,borderRadius:'50%',background:C.card2,display:'flex',alignItems:'center',justifyContent:'center',color:C.text3,fontSize:13,fontWeight:600}},'No data');
  return h('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`},
    h('circle',{cx,cy,r:r+10,fill:C.card2}),
    segs.filter(s=>s.v>0).map((s,i)=>{
      const st=a,sw=2*Math.PI*(s.v/tot);a+=sw;
      const x1=cx+r*Math.cos(st),y1=cy+r*Math.sin(st);
      const x2=cx+r*Math.cos(a),y2=cy+r*Math.sin(a);
      return h('path',{key:i,d:`M${cx},${cy}L${x1},${y1}A${r},${r} 0 ${sw>Math.PI?1:0},1 ${x2},${y2}Z`,fill:s.color,stroke:C.card,strokeWidth:2});
    }),
    h('circle',{cx,cy,r:r*0.45,fill:C.card})
  );
}
function Sheet({onClose,children}){
  return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:200,display:'flex',alignItems:'flex-end'},
    onClick:e=>{if(e.target===e.currentTarget)onClose()}},
    h('div',{style:{width:'100%',maxHeight:'95dvh',overflowY:'auto'}},children)
  );
}
function SectionTitle({children}){
  return h('div',{style:{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',color:C.text3,margin:'18px 16px 8px'}},children);
}
function NumField({value,onChange,placeholder}){
  return h('input',{type:'number',inputMode:'decimal',value,onChange:e=>onChange(e.target.value),placeholder:placeholder||'0',
    style:{width:'100%',padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,fontSize:15,fontFamily:'monospace',fontWeight:700,color:C.text,background:C.card2,outline:'none'}});
}

/* ══════════════════════════ DASHBOARD ══════════════════════════ */
function Dashboard({data,month,setMonth,setPage}){
  const md=getMonth(data,month);
  const income=monthIncome(md);
  const catSpentOnly=totalSpent(md); // what you've actually categorized as an expense
  const uncatTotal=uncategorizedTotal(md); // money spent but not yet sorted into a category
  const totalReal=catSpentOnly+uncatTotal; // true total that's left your accounts this month
  const savings=catSpent(md,'savings');
  const remaining=income-totalReal;
  const overspent=totalReal>income?totalReal-income:0;
  const budgetTot=totalBudget(data);
  const[watchFilter,setWatchFilter]=useState('all'); // all | over | near | under

  const catSegs=categoriesFor(data).map(c=>({v:catSpent(md,c.id),color:c.color,name:c.name,icon:c.icon})).filter(s=>s.v>0);
  const catTotal=catSegs.reduce((s,c)=>s+c.v,0);
  const srcSegs=SOURCES.map(s=>({v:md.transactions.filter(t=>t.source===s.id).reduce((a,t)=>a+t.amount,0),color:s.color,name:s.short}));

  // Every subcategory with a budget or spend, with full status info
  const allRows=allSubsFor(data).map(s=>{
    const b=subBudget(data,s.id),sp=subSpent(md,s.id);
    return{...s,budget:b,spent:sp,status:statusFor(sp,b),pct:b?sp/b*100:(sp>0?101:0)};
  }).filter(r=>r.budget>0||r.spent>0)
    .sort((a,b)=>b.pct-a.pct);
  const overCount=allRows.filter(r=>r.status.label==='Over Budget').length;
  const nearCount=allRows.filter(r=>r.status.label==='Near Budget').length;
  const underCount=allRows.filter(r=>r.status.label==='Under Budget').length;
  const watchRows=allRows.filter(r=>
    watchFilter==='all'?true:
    watchFilter==='over'?r.status.label==='Over Budget':
    watchFilter==='near'?r.status.label==='Near Budget':
    r.status.label==='Under Budget'
  );

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h(MonthBar,{month,setMonth}),
    overspent>0.5 && h('div',{style:{margin:'12px 16px 0',padding:'14px 16px',borderRadius:16,background:C.redlt,border:`1.5px solid ${C.red}`,display:'flex',alignItems:'center',gap:12}},
      h('span',{style:{fontSize:'1.6rem'}},'\uD83D\uDD3A'),
      h('div',{style:{flex:1}},
        h('div',{style:{fontWeight:800,color:C.red,fontSize:14}},'Over Income This Month'),
        h('div',{style:{fontSize:12,color:C.text2}},'You\u2019ve spent more than you\u2019ve earned')
      ),
      h('span',{style:{fontFamily:'monospace',fontWeight:800,color:C.red,fontSize:16}},'+'+fmtC(overspent))
    ),
    uncatTotal>0.5 && h('div',{onClick:()=>setPage('categorize'),style:{margin:'12px 16px 0',padding:'14px 16px',borderRadius:16,background:C.orangelt,border:`1.5px solid ${C.orange}`,display:'flex',alignItems:'center',gap:12,cursor:'pointer'}},
      h('span',{style:{fontSize:'1.6rem'}},'\u26A0\uFE0F'),
      h('div',{style:{flex:1}},
        h('div',{style:{fontWeight:800,color:C.orange,fontSize:14}},'Uncategorized Spending'),
        h('div',{style:{fontSize:12,color:C.text2}},'Tap to categorize '+fmtC(uncatTotal))
      ),
      h('span',{style:{fontFamily:'monospace',fontWeight:800,color:C.orange,fontSize:16}},fmtC(uncatTotal))
    ),
    /* Summary cards */
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,padding:'14px 16px 4px'}},
      [['Income',income,C.green,'\uD83D\uDCB0'],['Expenses',catSpentOnly,C.red,'\uD83D\uDCB8'],
       ['Savings',savings,C.purple,'\uD83D\uDCC8'],['Remaining',remaining,remaining>=0?C.green:C.red,'\uD83E\uDE99']].map(([l,v,col,ic])=>
        h('div',{key:l,style:{background:C.card,borderRadius:16,padding:'14px',boxShadow:C.shadow,border:`1px solid ${C.border}`}},
          h('div',{style:{fontSize:18,marginBottom:4}},ic),
          h('div',{style:{fontSize:11,color:C.text3,fontWeight:600,marginBottom:2}},l),
          h('div',{style:{fontFamily:'monospace',fontWeight:800,color:col,fontSize:16}},fmtC(v)),
          l==='Expenses'&&uncatTotal>0.5&&h('div',{style:{fontSize:10,color:C.orange,fontWeight:700,marginTop:2}},'+ '+fmtC(uncatTotal)+' uncategorized'),
          l==='Remaining'&&uncatTotal>0.5&&h('div',{style:{fontSize:10,color:C.text3,fontWeight:600,marginTop:2}},'accounts for uncategorized too')
        )
      )
    ),
    /* Budget overview bar */
    h('div',{style:{margin:'10px 16px',padding:'14px 16px',background:C.card,borderRadius:16,boxShadow:C.shadow,border:`1px solid ${C.border}`}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
        h('span',{style:{fontSize:13,fontWeight:700,color:C.text}},'Total Budget Used'),
        h('span',{style:{fontSize:13,fontWeight:700,color:C.text2,fontFamily:'monospace'}},fmtC(catSpentOnly)+' / '+fmtC(budgetTot))
      ),
      h(Bar,{pct:budgetTot?catSpentOnly/budgetTot*100:0,color:statusFor(catSpentOnly,budgetTot).color})
    ),
    /* Category pie */
    h(SectionTitle,null,'Spending by Category'),
    h('div',{style:{position:'relative',display:'flex',justifyContent:'center',padding:'8px 0 14px'}},
      h(Pie,{segs:catSegs,size:180}),
      catTotal>0&&h('div',{style:{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',textAlign:'center',pointerEvents:'none'}},
        h('div',{style:{fontSize:10,color:C.text3,fontWeight:700}},'TOTAL'),
        h('div',{style:{fontSize:15,fontWeight:800,color:C.text,fontFamily:'monospace'}},fmtC(catTotal))
      )
    ),
    catSegs.length>0&&h('div',{style:{padding:'0 16px 6px'}},
      catSegs.slice().sort((a,b)=>b.v-a.v).map(s=>h('div',{key:s.name,style:{display:'flex',alignItems:'center',gap:8,padding:'7px 0'}},
        h('div',{style:{width:10,height:10,borderRadius:99,background:s.color,flexShrink:0}}),
        h('span',{style:{fontSize:13,color:C.text,fontWeight:600,flex:1}},s.icon+' '+s.name),
        h('span',{style:{fontSize:12,color:C.text3,fontWeight:700,marginRight:8}},Math.round(s.v/catTotal*100)+'%'),
        h('span',{style:{fontSize:13,color:C.text,fontWeight:800,fontFamily:'monospace'}},fmtC(s.v))
      ))
    ),
    /* Payment source split */
    h(SectionTitle,null,'Payment Source Split'),
    h('div',{style:{padding:'0 16px'}},
      srcSegs.map(s=>h('div',{key:s.name,style:{marginBottom:10}},
        h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:4}},
          h('span',{style:{fontSize:13,color:C.text2,fontWeight:600}},s.name),
          h('span',{style:{fontSize:13,color:C.text,fontWeight:700,fontFamily:'monospace'}},fmtC(s.v))
        ),
        h(Bar,{pct:catSpentOnly?s.v/catSpentOnly*100:0,color:s.color})
      ))
    ),
    /* Budget Watch — cooler, filterable, shows everything */
    allRows.length>0&&h(SectionTitle,null,'Budget Watch'),
    allRows.length>0&&h('div',{style:{padding:'0 16px 10px'}},
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:2}},
        [['all','All',allRows.length,C.purple],['over','\uD83D\uDD34 Over',overCount,C.red],['near','\uD83D\uDFE0 Near',nearCount,C.orange],['under','\uD83D\uDFE2 Under',underCount,C.green]].map(([key,label,count,col])=>
          h('button',{key,onClick:()=>setWatchFilter(key),
            style:{flexShrink:0,padding:'7px 13px',borderRadius:99,border:`1.5px solid ${watchFilter===key?col:C.border}`,background:watchFilter===key?col+'18':C.card2,color:watchFilter===key?col:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
            label+' ('+count+')')
        )
      )
    ),
    allRows.length>0&&h('div',{style:{padding:'0 16px'}},
      watchRows.length===0&&h('div',{style:{textAlign:'center',padding:'24px 0',color:C.text3,fontSize:13,fontWeight:600}},'Nothing in this bucket \uD83C\uDF89'),
      watchRows.map(r=>{
        const pctLabel=r.budget?Math.round(r.pct)+'%':(r.spent>0?'\u2014':'0%');
        return h('div',{key:r.id,style:{background:C.card,borderRadius:14,padding:'12px 14px',marginBottom:10,boxShadow:C.shadow,border:`1px solid ${C.border}`,borderLeft:`4px solid ${r.status.color}`}},
          h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:8}},
            h('span',{style:{fontSize:'1.2rem'}},r.icon),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontSize:13.5,fontWeight:700,color:C.text}},r.name),
              h('div',{style:{fontSize:10.5,color:C.text3}},r.catName)
            ),
            h('div',{style:{textAlign:'right'}},
              h('div',{style:{fontSize:10.5,fontWeight:800,color:r.status.color,padding:'2px 8px',borderRadius:99,background:r.status.bg,display:'inline-block'}},r.status.label),
            )
          ),
          h(Bar,{pct:r.budget?r.pct:100,color:r.status.color}),
          h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:6}},
            h('span',{style:{fontSize:12,color:C.text2,fontFamily:'monospace',fontWeight:600}},fmtC(r.spent)+' of '+(r.budget?fmtC(r.budget):'no budget set')),
            h('span',{style:{fontSize:12,fontWeight:800,color:r.status.color}},pctLabel)
          )
        );
      })
    )
  );
}

/* ══════════════════════════ BALANCES PAGE ══════════════════════════ */
function BalancesPage({data,month,onSave,onModeChange,onDeleteLog,onAdjustBuckets,onResetBalances}){
  const curMd=getMonth(data,month);
  const[showAdjust,setShowAdjust]=useState(false);
  const[adjDebit,setAdjDebit]=useState(String(curMd.uncategorized.debit));
  const[adjSbi,setAdjSbi]=useState(String(curMd.uncategorized.sbi));
  const[adjYes,setAdjYes]=useState(String(curMd.uncategorized.yes));
  const[adjSaved,setAdjSaved]=useState(false);
  function saveAdjust(){
    onAdjustBuckets({debit:adjDebit,sbi:adjSbi,yes:adjYes});
    setAdjSaved(true);setTimeout(()=>setAdjSaved(false),1500);
  }
  const bal=data.balances;
  const md=getMonth(data,month);
  const incomeTotal=monthIncome(md);
  const baseline=bal||{debit:incomeTotal,sbi:0,yes:0};
  const mode=data.cardInputMode||'remaining'; // 'remaining' | 'outstanding'
  const isRemaining=mode==='remaining';

  // Card fields are always edited in the CURRENT display mode. Convert stored
  // outstanding -> remaining for display when needed.
  const sbiLimit=+data.cardLimits.sbi||0, yesLimit=+data.cardLimits.yes||0;
  const initSbiDisplay=bal?(isRemaining?(sbiLimit-bal.sbi):bal.sbi):'';
  const initYesDisplay=bal?(isRemaining?(yesLimit-bal.yes):bal.yes):'';

  const[debit,setDebit]=useState(bal?String(bal.debit):'');
  const[sbiDisp,setSbiDisp]=useState(bal?String(initSbiDisplay):'');
  const[yesDisp,setYesDisp]=useState(bal?String(initYesDisplay):'');

  function switchMode(newMode){
    if(newMode===mode)return;
    // convert whatever is currently typed into the new mode so numbers don't jump
    const curSbiOutstanding=isRemaining?(sbiLimit-(+sbiDisp||0)):(+sbiDisp||0);
    const curYesOutstanding=isRemaining?(yesLimit-(+yesDisp||0)):(+yesDisp||0);
    if(newMode==='remaining'){
      setSbiDisp(sbiLimit?String(sbiLimit-curSbiOutstanding):'');
      setYesDisp(yesLimit?String(yesLimit-curYesOutstanding):'');
    }else{
      setSbiDisp(String(curSbiOutstanding));
      setYesDisp(String(curYesOutstanding));
    }
    onModeChange(newMode);
  }

  // Resolve what each field actually means: if the user left it blank, that
  // means "no change" (keep the last known value) — NOT "zero remaining /
  // fully maxed out". These are used for both the save and the live preview.
  function resolveDebit(){return debit===''?baseline.debit:(+debit||0)}
  function resolveSbi(){return sbiDisp===''?baseline.sbi:(isRemaining?(sbiLimit-(+sbiDisp||0)):(+sbiDisp||0))}
  function resolveYes(){return yesDisp===''?baseline.yes:(isRemaining?(yesLimit-(+yesDisp||0)):(+yesDisp||0))}

  function save(){
    const nD=resolveDebit();
    const nS=resolveSbi();
    const nY=resolveYes();
    const debitSpend=baseline.debit-nD;
    const sbiSpend=nS-baseline.sbi;
    const yesSpend=nY-baseline.yes;
    const totalNew=debitSpend+sbiSpend+yesSpend;
    onSave({debit:nD,sbi:nS,yes:nY},totalNew,{debitSpend,sbiSpend,yesSpend,totalNew,usedIncomeBaseline:!bal,at:new Date().toISOString()});
  }

  const nSPreview=resolveSbi();
  const nYPreview=resolveYes();
  const sbiPct=sbiLimit?nSPreview/sbiLimit*100:0;
  const yesPct=yesLimit?nYPreview/yesLimit*100:0;
  const calc=data.lastCalc;

  const modeBtn=(val,label)=>h('button',{onClick:()=>switchMode(val),
    style:{flex:1,padding:'8px',borderRadius:9,border:`1.5px solid ${mode===val?C.purple:C.border}`,background:mode===val?C.purplelt:C.card2,color:mode===val?C.purple:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},label);

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 4px'}},
      h('div',{style:{fontSize:20,fontWeight:800,color:C.text}},'Update Balances'),
      h('div',{style:{fontSize:13,color:C.text2,marginTop:2}},'New spending is calculated automatically from the change since your last update.')
    ),
    !bal&&h('div',{style:{margin:'12px 16px 0',padding:'12px 14px',borderRadius:12,background:C.orangelt,border:`1px solid ${C.orange}`,fontSize:12.5,color:C.orange,fontWeight:600}},
      '\u26A0\uFE0F No previous balance saved yet. We\u2019ll assume your Debit account started this month at your total income ('+fmtC(incomeTotal)+') and both cards started at '+fmtC(0)+' outstanding, then calculate today\u2019s spend from that.'
    ),
    bal&&h('div',{style:{margin:'12px 16px 0',padding:'10px 14px',borderRadius:12,background:C.card2,fontSize:12,color:C.text2}},
      'Last saved: Debit '+fmtC(bal.debit)+' \u00B7 SBI Outstanding '+fmtC(bal.sbi)+' \u00B7 YES Outstanding '+fmtC(bal.yes)
    ),
    h('div',{style:{margin:'8px 16px 0',fontSize:11.5,color:C.text3}},'\uD83D\uDCA1 Leave any field blank to keep it unchanged \u2014 blank does NOT mean zero.'),
    h('div',{style:{padding:'16px'}},
      h('div',{style:{marginBottom:16}},
        h('div',{style:{fontSize:13,fontWeight:700,color:C.text,marginBottom:6}},'Debit Account Balance'),
        h(NumField,{value:debit,onChange:setDebit})
      ),
      h('div',{style:{display:'flex',gap:8,marginBottom:14}},modeBtn('remaining','Enter Remaining Limit'),modeBtn('outstanding','Enter Outstanding')),
      [['SBI Card',sbiDisp,setSbiDisp,sbiLimit],['YES Card',yesDisp,setYesDisp,yesLimit]].map(([label,val,setter,limit])=>
        h('div',{key:label,style:{marginBottom:16}},
          h('div',{style:{fontSize:13,fontWeight:700,color:C.text,marginBottom:6}},label+' \u2014 '+(isRemaining?'Remaining Available':'Outstanding Used')+(limit?'':' (set limit in Settings)')),
          h(NumField,{value:val,onChange:setter})
        )
      ),
      sbiLimit>0&&h('div',{style:{marginBottom:10}},
        h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,color:C.text2,marginBottom:4}},
          h('span',null,'SBI Used'),h('span',null,Math.round(sbiPct)+'% of '+fmtC(sbiLimit)+' ('+fmtC(nSPreview)+' outstanding)')),
        h(Bar,{pct:sbiPct,color:sbiPct>90?C.red:sbiPct>70?C.orange:C.green})
      ),
      yesLimit>0&&h('div',{style:{marginBottom:16}},
        h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,color:C.text2,marginBottom:4}},
          h('span',null,'YES Used'),h('span',null,Math.round(yesPct)+'% of '+fmtC(yesLimit)+' ('+fmtC(nYPreview)+' outstanding)')),
        h(Bar,{pct:yesPct,color:yesPct>90?C.red:yesPct>70?C.orange:C.green})
      ),
      h('button',{onClick:save,style:{width:'100%',padding:'15px',borderRadius:14,border:'none',background:C.purple,color:'#fff',fontWeight:800,fontSize:16,cursor:'pointer',fontFamily:'inherit'}},'Save Balances')
    ),
    calc&&h('div',{style:{margin:'0 16px 16px',padding:'14px',borderRadius:14,background:C.card,border:`1px solid ${C.border}`,boxShadow:C.shadow}},
      h('div',{style:{fontWeight:800,color:C.text,marginBottom:8,fontSize:14}},'Last Calculation'),
      calc.usedIncomeBaseline&&h('div',{style:{fontSize:11.5,color:C.text3,marginBottom:8}},'(Calculated using income as the starting Debit baseline)'),
      [['Debit Spend',calc.debitSpend],['SBI Spend',calc.sbiSpend],['YES Spend',calc.yesSpend]].map(([l,v])=>
        h('div',{key:l,style:{display:'flex',justifyContent:'space-between',fontSize:13,color:C.text2,padding:'3px 0'}},h('span',null,l),h('span',{style:{fontFamily:'monospace',fontWeight:700,color:C.text}},fmtC(v)))
      ),
      h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:800,color:calc.totalNew>0?C.orange:C.text2,borderTop:`1px solid ${C.border}`,marginTop:6,paddingTop:8}},
        h('span',null,'Added to Uncategorized'),h('span',{style:{fontFamily:'monospace'}},fmtC(calc.totalNew))
      ),
      calc.totalNew===0&&h('div',{style:{fontSize:11.5,color:C.text3,marginTop:6}},'No change detected \u2014 balances matched your last save exactly.')
    ),
    h('div',{style:{margin:'0 16px 16px'}},
      h('button',{onClick:()=>setShowAdjust(v=>!v),style:{width:'100%',padding:'12px',borderRadius:12,border:`1.5px dashed ${C.border2}`,background:'transparent',color:C.text2,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}},
        (showAdjust?'\u25BE ':'\u25B8 ')+'Manually Adjust Uncategorized Buckets'
      ),
      showAdjust&&h('div',{style:{marginTop:8,padding:'14px',borderRadius:14,background:C.card,border:`1px solid ${C.border}`,boxShadow:C.shadow}},
        h('div',{style:{fontSize:12,color:C.text2,marginBottom:12}},'Use this to correct '+monthLabel(month)+'\u2019s Debit / SBI / YES uncategorized totals directly \u2014 handy after moving to per-card tracking, or to match your real statements.'),
        [['Debit',adjDebit,setAdjDebit],['SBI',adjSbi,setAdjSbi],['YES',adjYes,setAdjYes]].map(([label,val,setter])=>
          h('div',{key:label,style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}},
            h('span',{style:{fontSize:13,fontWeight:700,color:C.text,width:50}},label),
            h('div',{style:{flex:1}},h(NumField,{value:val,onChange:setter}))
          )
        ),
        h('div',{style:{display:'flex',gap:8}},
          h('button',{onClick:()=>{setAdjDebit('0');setAdjSbi('0');setAdjYes('0')},style:{padding:'12px 14px',borderRadius:12,border:`1.5px solid ${C.border2}`,background:C.card2,color:C.text2,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}},'Fill \u20B90'),
          h('button',{onClick:saveAdjust,style:{flex:1,padding:'12px',borderRadius:12,border:'none',background:adjSaved?C.green:C.purple,color:'#fff',fontWeight:800,fontSize:14,cursor:'pointer',fontFamily:'inherit'}},adjSaved?'\u2713 Adjusted':'Save Adjustment')
        )
      )
    ),
    h('div',{style:{margin:'0 16px 16px'}},
      h('button',{onClick:()=>{if(confirm('Reset your saved Debit/SBI/YES balances? Your next Balances save will start fresh (using income as the baseline again). This month\u2019s uncategorized totals and transaction history are NOT affected.'))onResetBalances()},
        style:{width:'100%',padding:'12px',borderRadius:12,border:`1.5px solid ${C.orange}`,background:C.orangelt,color:C.orange,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}},'Reset Saved Balances / Start Fresh')
    ),
    h(SectionTitle,null,'Balance Update History'),
    h('div',{style:{padding:'0 16px'}},
      (!data.balanceLog||data.balanceLog.length===0)&&h('div',{style:{fontSize:12.5,color:C.text3,padding:'4px 0 12px'}},'No balance updates logged yet.'),
      data.balanceLog&&data.balanceLog.length>0&&h('div',{style:{background:C.card,borderRadius:14,overflow:'hidden',boxShadow:C.shadow,border:`1px solid ${C.border}`}},

              h('div',{style:{flex:1,minWidth:0}},

                  dtLabel,

                ),
                h('div',{style:{fontSize:11.5,color:C.text3,marginTop:2}},'Debit '+fmtC(e.debit)+' \u00B7 SBI '+fmtC(e.sbi)+' \u00B7 YES '+fmtC(e.yes)),

                  const msg=isLatest
                    ?'Delete this update? This will UNDO it \u2014 it subtracts '+fmtC(e.totalNew)+' back out of '+monthLabel(e.ym)+'\u2019s uncategorized total and restores your previous balances.'
                    :'Delete this log entry? It\u2019s an older record, so removing it only tidies up your history \u2014 it won\u2019t change any current totals.';
                  if(confirm(msg))onDeleteLog(e.id);
                },
                style:{border:'none',background:C.redlt,color:C.red,borderRadius:9,width:32,height:32,fontSize:15,cursor:'pointer',fontWeight:700,flexShrink:0}},'\uD83D\uDDD1\uFE0F')
            )
          );
        })
      )
    )
  );
}

/* ══════════════════════════ CATEGORIZE PAGE ══════════════════════════ */
function CategorizePage({data,month,onAddTxn,onEditTxn,onDeleteTxn,onResetUncategorized}){
  const md=getMonth(data,month);
  const buckets=md.uncategorized;
  const total=uncategorizedTotal(md);
  const[amount,setAmount]=useState('');
  const[catId,setCatId]=useState('');
  const[subId,setSubId]=useState('');
  const[source,setSource]=useState('debit');
  const[desc,setDesc]=useState('');
  const[date,setDate]=useState(today());
  const[err,setErr]=useState('');
  const[editing,setEditing]=useState(null); // {ym,txn}

  const cat=categoriesFor(data).find(c=>c.id===catId);
  const availForSource=buckets[source]||0;

  function save(){
    const amt=+amount;
    if(!amt||amt<=0){setErr('Enter a valid amount');return}
    if(!subId){setErr('Pick a category & subcategory');return}
    if(amt>availForSource+0.01){setErr('Amount exceeds '+getSrc(source).short+'\u2019s uncategorized balance ('+fmtC(availForSource)+')');return}
    onAddTxn({id:genId(),date,amount:amt,catId,subId,source,desc:desc.trim()});
    setAmount('');setCatId('');setSubId('');setDesc('');setErr('');
  }

  const recent=md.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.id>a.id?1:-1)).slice(0,8);

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 0'}},
      h('div',{style:{padding:'16px 18px',borderRadius:18,background:total>0.5?C.orangelt:C.greenlt,border:`1.5px solid ${total>0.5?C.orange:C.green}`,textAlign:'center'}},
        h('div',{style:{fontSize:12,fontWeight:700,color:total>0.5?C.orange:C.green,textTransform:'uppercase',letterSpacing:'.06em'}},'Uncategorized Remaining'),
        h('div',{style:{fontSize:32,fontWeight:900,color:total>0.5?C.orange:C.green,fontFamily:'monospace',marginTop:4}},fmtC(total)),
        h('div',{style:{display:'flex',justifyContent:'center',gap:14,marginTop:10}},
          SOURCES.map(s=>h('div',{key:s.id,style:{textAlign:'center'}},
            h('div',{style:{fontSize:10,fontWeight:700,color:C.text3,textTransform:'uppercase'}},s.short),
            h('div',{style:{fontSize:14,fontWeight:800,color:s.color,fontFamily:'monospace'}},fmtC(buckets[s.id]||0))
          ))
        )
      ),
      total>0.5&&h('button',{onClick:()=>{if(confirm('Reset all uncategorized amounts (Debit/SBI/YES) to \u20B90 for '+monthLabel(month)+'? Already-categorized expenses are NOT affected \u2014 this just clears the pending pool.'))onResetUncategorized()},

      h('div',{style:{fontSize:11.5,color:C.text3,marginBottom:12}},'Max from '+getSrc(source).short+': '+fmtC(availForSource)),
      h('div',{style:{marginBottom:12}},
        h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},
          CATEGORIES.map(c=>h('button',{key:c.id,onClick:()=>{setCatId(c.id);setSubId('')},
            style:{flexShrink:0,padding:'8px 12px',borderRadius:10,border:`1.5px solid ${catId===c.id?c.color:C.border}`,background:catId===c.id?c.color+'18':C.card2,color:catId===c.id?c.color:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
            c.icon+' '+c.name))
        )
      ),
      cat&&h('div',{style:{marginBottom:12,display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}},
        cat.subs.map(s=>h('button',{key:s.id,onClick:()=>setSubId(s.id),

              h('div',{style:{fontSize:13,fontWeight:700,color:C.text}},sub.name),
              h('div',{style:{fontSize:11,color:C.text3}},src.short+(t.desc?' \u00B7 '+t.desc:'')+' \u00B7 '+t.date)

            h('span',{style:{fontFamily:'monospace',fontWeight:800,color:C.red,fontSize:14,marginRight:2}},'\u2212'+fmt(t.amount)),

/* ══════════════════════════ HISTORY PAGE ══════════════════════════ */
function EditTxnSheet({data,ym,txn,onSave,onClose}){
  const[amount,setAmount]=useState(String(txn.amount));
  const[catId,setCatId]=useState(txn.catId);
  const[subId,setSubId]=useState(txn.subId);
  const[source,setSource]=useState(txn.source);
  const[desc,setDesc]=useState(txn.desc||'');
  const[date,setDate]=useState(txn.date);
  const[err,setErr]=useState('');

  const cat=categoriesFor(data).find(c=>c.id===catId);
  const originYm=txn.originYm||ym;
  const originMd=getMonth(data,originYm);
  // Available for the currently-selected source, as if this transaction's old
  // amount were already given back (since editing may keep or change source).
  const availForSource=(originMd.uncategorized[source]||0)+(source===txn.source?txn.amount:0);

  function save(){
    const amt=+amount;
    if(!amt||amt<=0){setErr('Enter a valid amount');return}
    if(!subId){setErr('Pick a category & subcategory');return}

  return h('div',{style:{background:C.card,borderRadius:'24px 24px 0 0',maxHeight:'92dvh',overflowY:'auto'}},

      h('div',{style:{width:40,height:4,borderRadius:99,background:C.border2}})
    ),
    h('div',{style:{padding:'14px 20px 0',fontSize:17,fontWeight:800,color:C.text}},'Edit Expense'),
    h('div',{style:{padding:'12px 20px 0'}},h(NumField,{value:amount,onChange:setAmount,placeholder:'Amount'})),
    h('div',{style:{padding:'6px 20px 12px',fontSize:11.5,color:C.text3}},'Max from '+getSrc(source).short+': '+fmtC(availForSource)),
    h('div',{style:{padding:'0 20px 12px'}},
      h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}},
        CATEGORIES.map(c=>h('button',{key:c.id,onClick:()=>{setCatId(c.id);if(c.id!==catId)setSubId('')},
          style:{flexShrink:0,padding:'8px 12px',borderRadius:10,border:`1.5px solid ${catId===c.id?c.color:C.border}`,background:catId===c.id?c.color+'18':C.card2,color:catId===c.id?c.color:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}},
          c.icon+' '+c.name))
      )
    ),
    cat&&h('div',{style:{padding:'0 20px 12px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}},
      cat.subs.map(s=>h('button',{key:s.id,onClick:()=>setSubId(s.id),
        style:{display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'9px 4px',borderRadius:12,border:`1.5px solid ${subId===s.id?cat.color:C.border}`,background:subId===s.id?cat.color+'18':C.card2,cursor:'pointer',fontFamily:'inherit'}},
        h('span',{style:{fontSize:'1.15rem'}},s.icon),
        h('span',{style:{fontSize:10,fontWeight:700,color:subId===s.id?cat.color:C.text2,textAlign:'center',lineHeight:1.2}},s.name)
      ))
    ),
    h('div',{style:{display:'flex',gap:8,padding:'0 20px 12px'}},
      SOURCES.map(s=>h('button',{key:s.id,onClick:()=>setSource(s.id),
        style:{flex:1,padding:'9px',borderRadius:10,border:`1.5px solid ${source===s.id?s.color:C.border}`,background:source===s.id?s.color+'18':C.card2,color:source===s.id?s.color:C.text2,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},s.short))
    ),
    h('div',{style:{padding:'0 20px 12px'}},
      h('input',{type:'date',value:date,onChange:e=>setDate(e.target.value),style:{width:'100%',padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'inherit',outline:'none'}})
    ),
    h('div',{style:{padding:'0 20px 12px'}},
      h('input',{value:desc,onChange:e=>setDesc(e.target.value),placeholder:'\uD83D\uDCDD Description (optional)',
        style:{width:'100%',padding:'10px 12px',borderRadius:10,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:14,color:C.text,fontFamily:'inherit',outline:'none'}})
    ),
    err&&h('div',{style:{color:C.red,fontSize:12,fontWeight:600,padding:'0 20px 10px'}},err),
    h('div',{style:{display:'flex',gap:10,padding:'0 20px',paddingBottom:'calc(16px + env(safe-area-inset-bottom,0px))'}},
      h('button',{onClick:onClose,style:{flex:1,padding:'14px',borderRadius:14,border:`1.5px solid ${C.border2}`,background:C.card2,color:C.text2,fontWeight:700,fontSize:15,cursor:'pointer',fontFamily:'inherit'}},'Cancel'),

    )

/* ══════════════════════════ SETTINGS PAGE ══════════════════════════ */
function SettingsPage({data,onUpdate,onResetIncomeAndBudgets,onResetEverything,onAddCustomSub,onDeleteCustomSub}){
  const month=curYm();
  const md=getMonth(data,month);
  const[salary,setSalary]=useState(String(md.income.salary||''));
  const[other,setOther]=useState(String(md.income.other||''));
  const[extras,setExtras]=useState(md.income.extras||[]);
  const[sbiLimit,setSbiLimit]=useState(String(data.cardLimits.sbi||''));
  const[yesLimit,setYesLimit]=useState(String(data.cardLimits.yes||''));
  const[budgets,setBudgets]=useState({...data.budgets});
  const[saved,setSaved]=useState(false);
  const[exporting,setExporting]=useState(false);
  const[exportErr,setExportErr]=useState('');

  async function handleExportPdf(){
    setExporting(true);setExportErr('');
    try{
      if(!window.PDFLib)throw new Error('PDF library did not load \u2014 check your internet connection and try again.');
      const bytes=await buildPdfReport(data);
      const stamp=new Date().toISOString().slice(0,10);
      downloadBytes(bytes,'Budget-Report-'+stamp+'.pdf');
    }catch(e){
      setExportErr(e&&e.message?e.message:'Something went wrong generating the PDF.');
    }
    setExporting(false);
  }
  const[newSubCat,setNewSubCat]=useState(''); // which category the add-form is open for
  const[newSubName,setNewSubName]=useState('');
  const[newSubIcon,setNewSubIcon]=useState('\uD83C\uDFF7\uFE0F');

  function handleAddCustomSub(catId){
    const name=newSubName.trim();
    if(!name)return;
    const id='custom_'+genId();
    onAddCustomSub({id,catId,name,icon:newSubIcon.trim()||'\uD83C\uDFF7\uFE0F'});
    setBudgets(b=>({...b,[id]:0}));
    setNewSubCat('');setNewSubName('');setNewSubIcon('\uD83C\uDFF7\uFE0F');
  }
  function handleDeleteCustomSub(sub){
    if(!confirm('Remove "'+sub.name+'"? Its budget will be cleared. Any past expenses already logged under it are kept, but you won\u2019t be able to pick it for new ones.'))return;
    onDeleteCustomSub(sub.id);
    setBudgets(b=>{const n={...b};delete n[sub.id];return n});
  }

  function addExtra(){setExtras(e=>[...e,{id:genId(),name:'',amount:''}])}
  function updExtra(id,field,val){setExtras(e=>e.map(x=>x.id===id?{...x,[field]:val}:x))}
  function delExtra(id){setExtras(e=>e.filter(x=>x.id!==id))}

  function saveAll(){
    onUpdate({
      cardLimits:{sbi:+sbiLimit||0,yes:+yesLimit||0},
      budgets:Object.fromEntries(Object.entries(budgets).map(([k,v])=>[k,+v||0])),
      monthIncome:{salary:+salary||0,other:+other||0,extras:extras.map(e=>({...e,amount:+e.amount||0}))},
    });
    setSaved(true);setTimeout(()=>setSaved(false),1800);
  }

  function handleResetIncomeBudgets(){
    if(!confirm('Reset '+monthLabel(month)+'\u2019s salary/income and ALL category budgets to \u20B90? This can\u2019t be undone.'))return;
    onResetIncomeAndBudgets();
    setSalary('');setOther('');setExtras([]);
    const zeroed={};allSubsFor(data).forEach(s=>zeroed[s.id]=0);
    setBudgets(zeroed);
  }
  function handleResetEverything(){
    if(!confirm('This wipes EVERYTHING \u2014 income, budgets, card limits, balances, uncategorized amounts, and all transaction history \u2014 back to a blank app. This cannot be undone. Continue?'))return;
    onResetEverything();
    setSalary('');setOther('');setExtras([]);
    setSbiLimit('');setYesLimit('');
    const zeroed={};allSubsFor(data).forEach(s=>zeroed[s.id]=0);
    setBudgets(zeroed);
  }

  return h('div',{style:{flex:1,overflowY:'auto',paddingBottom:90}},
    h('div',{style:{padding:'16px 16px 0'}},
      h('div',{style:{fontSize:20,fontWeight:800,color:C.text}},'Settings')
    ),
    h(SectionTitle,null,'Income \u2014 '+monthLabel(month)),
    h('div',{style:{padding:'0 16px'}},
      h('div',{style:{marginBottom:10}},h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'Monthly Salary'),h(NumField,{value:salary,onChange:setSalary})),
      h('div',{style:{marginBottom:10}},h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'Other Income'),h(NumField,{value:other,onChange:setOther})),
      extras.map(e=>h('div',{key:e.id,style:{display:'flex',gap:8,marginBottom:8,alignItems:'center'}},
        h('input',{value:e.name,onChange:ev=>updExtra(e.id,'name',ev.target.value),placeholder:'Description',style:{flex:1.3,padding:'9px 10px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'inherit',outline:'none'}}),
        h('input',{type:'number',value:e.amount,onChange:ev=>updExtra(e.id,'amount',ev.target.value),placeholder:'Amount',style:{flex:1,padding:'9px 10px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'monospace',outline:'none'}}),
        h('button',{onClick:()=>delExtra(e.id),style:{border:'none',background:C.redlt,color:C.red,borderRadius:9,width:32,height:32,fontSize:16,cursor:'pointer',fontWeight:700}},'\u00D7')
      )),
      h('button',{onClick:addExtra,style:{width:'100%',padding:'10px',borderRadius:10,border:`1.5px dashed ${C.border2}`,background:'transparent',color:C.purple,fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit',marginBottom:6}},'+ Add Income Source')
    ),
    h(SectionTitle,null,'Credit Card Limits'),
    h('div',{style:{padding:'0 16px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
      h('div',null,h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'SBI Limit'),h(NumField,{value:sbiLimit,onChange:setSbiLimit})),
      h('div',null,h('div',{style:{fontSize:12,color:C.text2,fontWeight:600,marginBottom:4}},'YES Limit'),h(NumField,{value:yesLimit,onChange:setYesLimit}))
    ),
    h(SectionTitle,null,'Category Budgets'),
    h('div',{style:{padding:'0 16px'}},
      categoriesFor(data).map(cat=>{
        const catSum=cat.subs.reduce((s,sub)=>s+(+budgets[sub.id]||0),0);
        const isAdding=newSubCat===cat.id;
        return h('div',{key:cat.id,style:{marginBottom:14,background:C.card,borderRadius:14,padding:'12px 14px',boxShadow:C.shadow,border:`1px solid ${C.border}`}},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
            h('div',{style:{fontWeight:800,color:C.text,fontSize:14}},cat.icon+' '+cat.name),
            h('div',{style:{fontFamily:'monospace',fontWeight:700,color:cat.color,fontSize:13}},fmtC(catSum))
          ),
          cat.subs.map(sub=>{
            const isCustom=sub.id.startsWith('custom_');
            return h('div',{key:sub.id,style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
              h('span',{style:{fontSize:13,color:C.text2,flex:1}},sub.icon+' '+sub.name+(isCustom?' \u2022':'')),
              h('input',{type:'number',value:budgets[sub.id]??0,onChange:e=>setBudgets(b=>({...b,[sub.id]:e.target.value})),
                style:{width:100,padding:'7px 9px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,fontFamily:'monospace',fontWeight:700,color:C.text,textAlign:'right',outline:'none'}}),
              isCustom&&h('button',{onClick:()=>handleDeleteCustomSub(sub),style:{border:'none',background:C.redlt,color:C.red,borderRadius:8,width:28,height:28,fontSize:13,cursor:'pointer',flexShrink:0}},'\u00D7')
            );
          }),
          isAdding?h('div',{style:{display:'flex',gap:6,marginTop:8,alignItems:'center'}},
            h('input',{value:newSubIcon,onChange:e=>setNewSubIcon(e.target.value),placeholder:'\uD83C\uDFF7\uFE0F',
              style:{width:44,padding:'8px 6px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:15,textAlign:'center',outline:'none'}}),
            h('input',{value:newSubName,onChange:e=>setNewSubName(e.target.value),placeholder:'New subcategory name',autoFocus:true,
              style:{flex:1,padding:'8px 10px',borderRadius:9,border:`1.5px solid ${C.border2}`,background:C.card2,fontSize:13,color:C.text,fontFamily:'inherit',outline:'none'}}),
            h('button',{onClick:()=>handleAddCustomSub(cat.id),style:{border:'none',background:cat.color,color:'#fff',borderRadius:9,padding:'8px 12px',fontWeight:700,fontSize:12,cursor:'pointer'}},'Add'),
            h('button',{onClick:()=>{setNewSubCat('');setNewSubName('')},style:{border:'none',background:C.card2,color:C.text2,borderRadius:9,width:30,height:36,fontSize:14,cursor:'pointer'}},'\u00D7')
          ):h('button',{onClick:()=>{setNewSubCat(cat.id);setNewSubName('');setNewSubIcon('\uD83C\uDFF7\uFE0F')},
            style:{width:'100%',padding:'8px',marginTop:4,borderRadius:9,border:`1.5px dashed ${C.border2}`,background:'transparent',color:cat.color,fontWeight:700,fontSize:12,cursor:'pointer',fontFamily:'inherit'}},'+ Add Subcategory')
        );
      })
    ),
    h('div',{style:{padding:'8px 16px 20px'}},
      h('button',{onClick:saveAll,style:{width:'100%',padding:'15px',borderRadius:14,border:'none',background:saved?C.green:C.purple,color:'#fff',fontWeight:800,fontSize:16,cursor:'pointer',fontFamily:'inherit',transition:'background .2s'}},saved?'\u2713 Saved':'Save Settings')
    ),
    h(SectionTitle,null,'Export'),
    h('div',{style:{padding:'0 16px 8px'}},
      h('button',{onClick:handleExportPdf,disabled:exporting,style:{width:'100%',padding:'14px',borderRadius:14,border:`1.5px solid ${C.purple}`,background:C.purplelt,color:C.purple,fontWeight:800,fontSize:15,cursor:exporting?'default':'pointer',fontFamily:'inherit',opacity:exporting?0.7:1}},
        exporting?'\u23F3 Generating your report\u2026':'\uD83D\uDCC4 Export PDF Report'),
      h('div',{style:{fontSize:11.5,color:C.text3,marginTop:8}},'A polished, multi-page summary covering every month you\u2019ve tracked \u2014 income, budgets vs actuals, category breakdowns, and payment source splits.'),
      exportErr&&h('div',{style:{color:C.red,fontSize:12,fontWeight:600,marginTop:8}},exportErr)
    ),
    h(SectionTitle,null,'Danger Zone'),
    h('div',{style:{padding:'0 16px 24px'}},
      h('button',{onClick:handleResetIncomeBudgets,style:{width:'100%',padding:'13px',borderRadius:12,border:`1.5px solid ${C.orange}`,background:C.orangelt,color:C.orange,fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginBottom:10}},'Reset Salary & Budgets to \u20B90'),
      h('div',{style:{fontSize:11.5,color:C.text3,marginBottom:16}},'Zeroes out '+monthLabel(month)+'\u2019s income and every category/subcategory budget. Card limits, balances, and transaction history are untouched.'),
      h('button',{onClick:handleResetEverything,style:{width:'100%',padding:'13px',borderRadius:12,border:`1.5px solid ${C.red}`,background:C.redlt,color:C.red,fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit',marginBottom:10}},'Factory Reset \u2014 Wipe Everything'),
      h('div',{style:{fontSize:11.5,color:C.text3}},'Clears income, budgets, card limits, balances, uncategorized amounts, and all transaction history. Use only if you want to start completely over.')
    )
  );
}

/* ══════════════════════════ APP ══════════════════════════ */
function App(){
  const[data,setData]=useState(()=>{
    const d=lsGet(SK,null);
    if(!d)return defaultData();
    const merged={...defaultData(),...d,budgets:{...defaultData().budgets,...(d.budgets||{})}};
    if(!merged.balanceLog||!merged.balanceLog.length){
      merged.balanceLog=merged.balances?[{id:genId(),at:new Date().toISOString(),ym:curYm(),
        debit:merged.balances.debit,sbi:merged.balances.sbi,yes:merged.balances.yes,
        debitSpend:0,sbiSpend:0,yesSpend:0,totalNew:0,imported:true}]:[];
    }
    return merged;
  });
  const[page,setPage]=useState('dash');
  const[month,setMonth]=useState(curYm());

  useEffect(()=>{lsSave(SK,data)},[data]);

  function saveBalances(newBal,spendDelta,calc){
    setData(d=>{
      const ym=curYm();
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.uncategorized.debit=(md.uncategorized.debit||0)+(calc?calc.debitSpend:0);
      md.uncategorized.sbi=(md.uncategorized.sbi||0)+(calc?calc.sbiSpend:0);
      md.uncategorized.yes=(md.uncategorized.yes||0)+(calc?calc.yesSpend:0);
      const logEntry={id:genId(),at:new Date().toISOString(),ym,
        debit:newBal.debit,sbi:newBal.sbi,yes:newBal.yes,
        debitSpend:calc?calc.debitSpend:0,sbiSpend:calc?calc.sbiSpend:0,yesSpend:calc?calc.yesSpend:0,
        totalNew:spendDelta,usedIncomeBaseline:calc?!!calc.usedIncomeBaseline:false};
      const balanceLog=[...(d.balanceLog||[]),logEntry];
      return{...d,balances:newBal,months,lastCalc:calc||null,balanceLog};
    });
  }
  function setCardInputMode(mode){
    setData(d=>({...d,cardInputMode:mode}));
  }
  function deleteLogEntry(id){
    setData(d=>{
      const log=d.balanceLog||[];
      const idx=log.findIndex(e=>e.id===id);
      if(idx===-1)return d;
      const isLatest=idx===log.length-1;
      let months=d.months,balances=d.balances,lastCalc=d.lastCalc;
      if(isLatest){
        const entry=log[idx];
        months={...d.months};
        const md=cloneMonthEntry(d,months,entry.ym);
        md.uncategorized.debit=Math.max(0,(md.uncategorized.debit||0)-(entry.debitSpend||0));
        md.uncategorized.sbi=Math.max(0,(md.uncategorized.sbi||0)-(entry.sbiSpend||0));
        md.uncategorized.yes=Math.max(0,(md.uncategorized.yes||0)-(entry.yesSpend||0));
        const prev=log[idx-1];
        balances=prev?{debit:prev.debit,sbi:prev.sbi,yes:prev.yes}:null;
        lastCalc=prev?{debitSpend:prev.debitSpend,sbiSpend:prev.sbiSpend,yesSpend:prev.yesSpend,totalNew:prev.totalNew,usedIncomeBaseline:prev.usedIncomeBaseline}:null;
      }
      const balanceLog=log.filter(e=>e.id!==id);
      return{...d,months,balances,lastCalc,balanceLog};
    });
  }
  function addTxn(txn){
    setData(d=>{
      const months={...d.months};
      const curYmNow=curYm();
      const dateYm=txn.date.slice(0,7);
      // The uncategorized pool being drawn down is always the CURRENT month's
      // pool for the chosen payment source (that's what's shown on the
      // Categorize screen), regardless of what date the expense is filed under.
      const curMd=cloneMonthEntry(d,months,curYmNow);
      curMd.uncategorized[txn.source]=Math.max(0,(curMd.uncategorized[txn.source]||0)-txn.amount);
      const finalTxn={...txn,originYm:curYmNow};
      // The transaction record itself is filed under its own date's month, so
      // History and per-month budget analytics stay accurate.
      const txnMd=dateYm===curYmNow?curMd:cloneMonthEntry(d,months,dateYm);
      txnMd.transactions=[...txnMd.transactions,finalTxn];
      return{...d,months};
    });
  }
  function deleteTxn(ym,txn){
    setData(d=>{
      const months={...d.months};
      // Remove the record from wherever it's filed...
      const dateMd=cloneMonthEntry(d,months,ym);
      dateMd.transactions=dateMd.transactions.filter(t=>t.id!==txn.id);
      // ...and give the money back to the bucket it was originally drawn from.
      const originYm=txn.originYm||ym;
      const originMd=cloneMonthEntry(d,months,originYm);
      originMd.uncategorized[txn.source]=(originMd.uncategorized[txn.source]||0)+txn.amount;
      return{...d,months};
    });
  }
  function editTxn(ym,oldTxn,updates){
    setData(d=>{
      const months={...d.months};
      const originYm=oldTxn.originYm||ym;
      // 1. give back the old amount to its original source bucket
      const originMd=cloneMonthEntry(d,months,originYm);
      originMd.uncategorized[oldTxn.source]=(originMd.uncategorized[oldTxn.source]||0)+oldTxn.amount;
      // 2. remove the old record from wherever it was filed
      const oldDateMd=cloneMonthEntry(d,months,ym);
      oldDateMd.transactions=oldDateMd.transactions.filter(t=>t.id!==oldTxn.id);
      // 3. draw the new amount from the (possibly new) source, same origin month
      const originMd2=cloneMonthEntry(d,months,originYm);
      originMd2.uncategorized[updates.source]=(originMd2.uncategorized[updates.source]||0)-updates.amount;
      // 4. file the updated record under its (possibly new) date's month
      const newDateYm=updates.date.slice(0,7);
      const newTxn={...oldTxn,...updates,originYm};
      const newDateMd=cloneMonthEntry(d,months,newDateYm);
      newDateMd.transactions=[...newDateMd.transactions,newTxn];
      return{...d,months};
    });
  }
  function updateSettings({cardLimits,budgets,monthIncome}){
    setData(d=>{
      const ym=curYm();
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.income=monthIncome;
      return{...d,cardLimits,budgets,months};
    });
  }
  // Directly overwrites the current month's uncategorized buckets. Used to
  // manually correct totals — e.g. after the one-time migration that lumps
  // old pre-split spending entirely into Debit, or to fix any other mismatch
  // against your real account/card statements.
  function adjustBuckets(newBuckets){
    setData(d=>{
      const ym=curYm();
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.uncategorized={debit:+newBuckets.debit||0,sbi:+newBuckets.sbi||0,yes:+newBuckets.yes||0};
      return{...d,months};
    });
  }
  // Zeroes out this month's income and every category/subcategory budget.
  function resetIncomeAndBudgets(){
    setData(d=>{
      const ym=curYm();
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.income={salary:0,other:0,extras:[]};
      const budgets={};allSubsFor(d).forEach(s=>budgets[s.id]=0);
      return{...d,budgets,months};
    });
  }
  // Clears the saved balances baseline so the next Balances save starts fresh
  // (using the income-baseline logic again). Balance history log is kept.
  function resetBalances(){
    setData(d=>({...d,balances:null,lastCalc:null}));
  }
  // Zeroes this month's uncategorized buckets directly (shortcut for the
  // manual adjustment tool). Doesn't touch already-categorized transactions.
  function resetUncategorized(){
    setData(d=>{
      const ym=curYm();
      const months={...d.months};
      const md=cloneMonthEntry(d,months,ym);
      md.uncategorized={debit:0,sbi:0,yes:0};
      return{...d,months};
    });
  }
  // Full factory reset — wipes everything back to a blank app.
  function resetEverything(){
    setData(()=>defaultData());
  }
  function addCustomSub(sub){
    setData(d=>({...d,customSubs:[...(d.customSubs||[]),sub],budgets:{...d.budgets,[sub.id]:0}}));
  }
  function deleteCustomSub(subId){
    setData(d=>{
      const budgets={...d.budgets};delete budgets[subId];
      return{...d,customSubs:(d.customSubs||[]).filter(s=>s.id!==subId),budgets};
    });
  }

  const md=getMonth(data,month);
  const uncategorized=uncategorizedTotal(md);

  const NAV=[
    {id:'dash',label:'Home',em:'\uD83C\uDFE0'},
    {id:'balances',label:'Balances',em:'\uD83D\uDCB3'},
    {id:'categorize',label:'Categorize',em:'\uD83C\uDFF7\uFE0F',badge:uncategorized>0.5},
    {id:'history',label:'History',em:'\uD83D\uDCDC'},
    {id:'settings',label:'Settings',em:'\u2699\uFE0F'},
  ];

  return h('div',{style:{height:'100dvh',display:'flex',flexDirection:'column',background:C.bg,color:C.text,fontFamily:"system-ui,-apple-system,sans-serif",overflow:'hidden'}},
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}},
      page==='dash'       &&h(Dashboard,      {data,month,setMonth,setPage}),
      page==='balances'   &&h(BalancesPage,   {data,month:curYm(),onSave:saveBalances,onModeChange:setCardInputMode,onDeleteLog:deleteLogEntry,onAdjustBuckets:adjustBuckets,onResetBalances:resetBalances}),
      page==='categorize' &&h(CategorizePage, {data,month:curYm(),onAddTxn:addTxn,onEditTxn:editTxn,onDeleteTxn:deleteTxn,onResetUncategorized:resetUncategorized}),
      page==='history'    &&h(HistoryPage,    {data,onEditTxn:editTxn,onDeleteTxn:deleteTxn}),
      page==='settings'   &&h(SettingsPage,   {data,onUpdate:updateSettings,onResetIncomeAndBudgets:resetIncomeAndBudgets,onResetEverything:resetEverything,onAddCustomSub:addCustomSub,onDeleteCustomSub:deleteCustomSub})
    ),
    h('nav',{style:{display:'flex',background:C.nav,borderTop:`1px solid ${C.border}`,paddingBottom:'env(safe-area-inset-bottom,0px)',flexShrink:0,boxShadow:'0 -2px 16px rgba(109,40,217,.08)'}},
      NAV.map(n=>{
        const on=page===n.id;
        return h('button',{key:n.id,onClick:()=>setPage(n.id),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'9px 0 10px',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:9.5,fontWeight:on?800:500,color:on?C.purple:C.text3,position:'relative',transition:'color .15s'}},
          on&&h('div',{style:{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:24,height:3,borderRadius:99,background:C.purple}}),
          h('span',{style:{fontSize:'1.25rem',position:'relative'}},n.em,
            n.badge&&h('span',{style:{position:'absolute',top:-2,right:-4,width:8,height:8,borderRadius:99,background:C.red,border:`1.5px solid ${C.nav}`}})
          ),
          n.label
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
